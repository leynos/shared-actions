name: Coverage (main)

# Pull requests use the coverage baseline saved by this main-push workflow.
# They do not contact CodeScene or receive its credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-upload:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN || '' }}
    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This job runs third-party tooling (uv, nfpm, the Rust toolchain)
          # and never pushes back to the repository, so drop the checkout
          # credential rather than persisting GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.13'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/scripts/*.py
      # Mirror ci.yml's coverage job exactly so the ratchet baseline written
      # here is comparable to what pull requests compute.
      - name: Install nfpm
        uses: ./.github/actions/install-nfpm
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      # Warm the project build so tests that shell out to `uv run --script`
      # do not emit uv build/install noise on stderr (see the note in ci.yml).
      - name: Sync project dependencies
        run: uv sync --group dev
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
      - name: Generate coverage
        uses: ./.github/actions/generate-coverage
        with:
          language: python
          python-source: workflow_scripts
          output-path: coverage.xml
          format: cobertura
          use-cargo-nextest: 'false'
          pytest-workers: ''
          with-ratchet: 'true'
          # `python-source: workflow_scripts` narrows the measured population, so
          # the percentages in the unscoped baseline written by earlier main runs
          # are not comparable with these. The baseline moves to its own path,
          # which the action seeds at zero when the restored cache does not carry
          # it, so the first scoped run sets the generation rather than failing
          # the ratchet against an incompatible number. Both lanes name the same
          # path, or the pull-request comparison reads a file nothing writes.
          baseline-python-file: .coverage-baseline.workflow-scripts.python
      # A workflow_dispatch run selects its own ref, and the push filter says
      # nothing about it, so the ref is checked here as well as the credential:
      # a dispatch from a feature branch must never publish that branch's
      # coverage as the trunk's.
      - name: Upload coverage to CodeScene
        if: github.ref == 'refs/heads/main' && env.CS_ACCESS_TOKEN != ''
        uses: ./.github/actions/upload-codescene-coverage
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          cli-version: "1.0.101"
