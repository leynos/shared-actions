name: Test resolve workflow source

on:
  workflow_dispatch:

# Default the token to no scopes; jobs opt in explicitly.
permissions: {}

jobs:
  resolve:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `env.ACT` is set by nektos/act and by nothing else; GitHub sets it
      # nowhere. So this step runs under act and is skipped on a real dispatch,
      # which is what keeps the two branches the fixture exercises disjoint.
      - name: Resolve (act short-circuit)
        id: act-branch
        if: ${{ env.ACT == 'true' }}
        uses: ./.github/actions/resolve-workflow-source

      - name: Assert act branch outputs
        if: ${{ env.ACT == 'true' }}
        shell: bash
        env:
          CHECKOUT: ${{ steps.act-branch.outputs.checkout }}
          WORKFLOW_DIR: ${{ steps.act-branch.outputs.workflow_dir }}
          REPO_OUT: ${{ steps.act-branch.outputs.repo }}
          REF_OUT: ${{ steps.act-branch.outputs.ref }}
        run: |
          set -euo pipefail
          [[ "${CHECKOUT}" == "false" ]]
          [[ "${WORKFLOW_DIR}" == "${GITHUB_WORKSPACE}" ]]
          [[ -n "${REPO_OUT}" ]]
          [[ -z "${REF_OUT}" ]]
          echo "resolve_act_branch=ok"

      # No `env:` here on purpose. Act forces `ACT=true` in the composite's own
      # environment whatever an outer step declares, so under act this step can
      # only be skipped, which the `if:` below does. On a dispatch `ACT` is
      # unset, the step runs, and the action's own `${ACT:-}` test falls
      # through to the missing token endpoint and exits 1.
      #
      # Setting `env: ACT:` here would be worse than useless: act feeds a
      # step's own `env` to that step's `if:`, so the guard would read the
      # value meant to reach the composite and select the step it was meant to
      # skip.
      - name: Resolve (OIDC fail-fast without token endpoint)
        id: oidc-branch
        if: ${{ env.ACT != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/resolve-workflow-source

      - name: Assert one branch ran and the other did not
        shell: bash
        env:
          ACT_OUTCOME: ${{ steps.act-branch.outcome }}
          OUTCOME: ${{ steps.oidc-branch.outcome }}
        run: |
          set -euo pipefail
          # Under act the act branch succeeds and the fail-fast branch is
          # skipped; on a dispatch the reverse. A skipped step reports the
          # outcome "skipped", so requiring the one and refusing the other is
          # what proves exactly one guard fired.
          if [[ -n "${ACT_OUTCOME}" ]]; then
            [[ "${ACT_OUTCOME}" == "success" && "${OUTCOME}" == "skipped" ]]
          else
            [[ "${OUTCOME}" == "failure" ]]
          fi
          if [[ "${ACT_OUTCOME}" == "success" ]]; then
            echo "resolve_act_branch=ok"
          else
            echo "resolve_act_branch=skipped"
          fi
          if [[ "${OUTCOME}" == "failure" ]]; then
            echo "resolve_oidc_failfast=ok"
          else
            echo "resolve_oidc_failfast=skipped"
          fi
