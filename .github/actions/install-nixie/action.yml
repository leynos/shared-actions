name: Install Nixie
description: Install pinned Nixie and verified Merman CLI releases for Mermaid validation
inputs:
  nixie-version:
    description: Nixie CLI version to install
    required: false
    default: "1.1.0"
  merman-version:
    description: Merman CLI version to install
    required: false
    default: "0.7.0"
  python-version:
    description: Python version used by uv to install Nixie
    required: false
    default: "3.14"
runs:
  using: composite
  steps:
    - name: Install Nixie and Merman CLI
      shell: bash
      env:
        NIXIE_VERSION: ${{ inputs.nixie-version }}
        MERMAN_VERSION: ${{ inputs.merman-version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail

        input_error() {
          echo "::error title=Install Nixie input::$1" >&2
          exit 1
        }

        if [[ "$MERMAN_VERSION" != "0.7.0" ]]; then
          input_error "merman-version ${MERMAN_VERSION} is unsupported; only 0.7.0 has a pinned release checksum"
        fi
        if [[ ! "$NIXIE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          input_error "nixie-version must use three numeric components"
        fi
        if [[ ! "$PYTHON_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
          input_error "python-version must use two or three numeric components"
        fi
        if ! command -v uv >/dev/null 2>&1; then
          echo "::error::uv is required to install nixie-cli" >&2
          exit 1
        fi

        sha256_for_path() {
          local path_to_hash="$1"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            local windows_path
            windows_path="$(cygpath --windows "$path_to_hash")"
            MERMAN_HASH_PATH="$windows_path" powershell.exe -NoProfile -NonInteractive -Command \
              '(Get-FileHash -Algorithm SHA256 -LiteralPath $env:MERMAN_HASH_PATH).Hash.ToLowerInvariant()' | tr -d '\r'
          else
            shasum -a 256 "$path_to_hash" | awk '{print $1}'
          fi
        }

        case "${RUNNER_OS:-}/${RUNNER_ARCH:-}" in
          Linux/X64)
            merman_archive="merman-cli-x86_64-unknown-linux-gnu.tar.xz"
            merman_archive_root="merman-cli-x86_64-unknown-linux-gnu"
            merman_checksum="dfdc2a978a884aa5a2ad5b85285fb5175cb435e82cf96efa860a550749e09d99"
            merman_executable_checksum="5e228914b31061ddc5f8d05c335e4cc88dcd116b888768494d78a9b670520965"
            merman_executable="merman-cli"
            nixie_executable="nixie"
            ;;
          macOS/ARM64)
            merman_archive="merman-cli-aarch64-apple-darwin.tar.xz"
            merman_archive_root="merman-cli-aarch64-apple-darwin"
            merman_checksum="5c61d806c9cdb1b16062797955fb51849d5df7789e0dc8ea4c54e22d61b865ae"
            merman_executable_checksum="70f78cd01fa41c573ed823bdd7dae30d4729c7c1483b485c80d239949400abd8"
            merman_executable="merman-cli"
            nixie_executable="nixie"
            ;;
          macOS/X64)
            merman_archive="merman-cli-x86_64-apple-darwin.tar.xz"
            merman_archive_root="merman-cli-x86_64-apple-darwin"
            merman_checksum="c73a9f676b2f9ec5b81ec805253f39f160b1d76a503c80408bea72fa017fb8f1"
            merman_executable_checksum="28ff1ec3a7ce3ce146be6559fa11d3340b37f3639efc53b8ecd9b3590ac27544"
            merman_executable="merman-cli"
            nixie_executable="nixie"
            ;;
          Windows/X64)
            merman_archive="merman-cli-x86_64-pc-windows-msvc.zip"
            merman_archive_root=""
            merman_checksum="51f4898058d7bae48255a15663cafc14fcee3e352f271a916b2c057587070977"
            merman_executable_checksum="8cafb025e90683b67c5eac646b07f656a0d519af21a292666df9a01ecbc3f794"
            merman_executable="merman-cli.exe"
            nixie_executable="nixie.exe"
            ;;
          *)
            echo "::error title=Unsupported Merman platform::no verified Merman 0.7.0 release is configured for ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}" >&2
            exit 1
            ;;
        esac

        merman_bin_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/merman/${MERMAN_VERSION}/bin"
        merman_path="${merman_bin_dir}/${merman_executable}"
        merman_is_verified=false
        if [[ -x "$merman_path" ]]; then
          actual_executable_checksum="$(sha256_for_path "$merman_path")"
          if [[ "$actual_executable_checksum" == "$merman_executable_checksum" ]]; then
            merman_is_verified=true
          else
            echo "::notice title=Merman cache refresh::cached merman-cli checksum did not match the verified release"
          fi
        fi

        if [[ "$merman_is_verified" != true ]]; then
          temporary_dir="$(mktemp -d)"
          trap 'rm -rf -- "${temporary_dir}"' EXIT
          merman_url="https://github.com/Latias94/merman/releases/download/v${MERMAN_VERSION}/${merman_archive}"
          archive_path="${temporary_dir}/${merman_archive}"

          curl --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 2 --retry-max-time 120 \
            --fail --location --silent --show-error --output "$archive_path" "$merman_url"
          actual_checksum="$(sha256_for_path "$archive_path")"
          if [[ "$actual_checksum" != "$merman_checksum" ]]; then
            echo "::error title=Merman checksum mismatch::expected ${merman_checksum}, received ${actual_checksum}" >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            windows_archive_path="$(cygpath --windows "$archive_path")"
            export MERMAN_ARCHIVE_PATH="$windows_archive_path"
            windows_extract_dir="$(cygpath --windows "$temporary_dir")"
            export MERMAN_EXTRACT_DIR="$windows_extract_dir"
            powershell.exe -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath $env:MERMAN_ARCHIVE_PATH -DestinationPath $env:MERMAN_EXTRACT_DIR -Force'
            merman_source_path="${temporary_dir}/${merman_executable}"
          else
            tar -xJf "$archive_path" -C "$temporary_dir"
            merman_source_path="${temporary_dir}/${merman_archive_root}/${merman_executable}"
          fi
          mkdir -p -- "$merman_bin_dir"
          install -m 0755 "$merman_source_path" "$merman_path"
          actual_executable_checksum="$(sha256_for_path "$merman_path")"
          if [[ "$actual_executable_checksum" != "$merman_executable_checksum" ]]; then
            echo "::error title=Merman executable checksum mismatch::installed merman-cli did not match the verified release" >&2
            exit 1
          fi
        fi

        if [[ ! -x "$merman_path" ]]; then
          echo "::error title=Merman installation failed::merman-cli was not installed at ${merman_path}" >&2
          exit 1
        fi

        uv tool install --python "${PYTHON_VERSION}" "nixie-cli==${NIXIE_VERSION}"
        uv_bin_dir="$(uv tool dir --bin)" || exit $?
        nixie_bin_dir="$uv_bin_dir"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          nixie_bin_dir="$(cygpath --unix "$uv_bin_dir")"
        fi
        nixie_path="${nixie_bin_dir}/${nixie_executable}"
        if [[ ! -x "$nixie_path" ]]; then
          echo "::notice title=Nixie shim repair::reinstalling nixie-cli because ${nixie_path} is absent"
          uv tool install --force --python "${PYTHON_VERSION}" "nixie-cli==${NIXIE_VERSION}"
        fi
        if [[ ! -x "$nixie_path" ]]; then
          echo "::error title=Nixie installation failed::nixie was not installed at ${nixie_path}" >&2
          exit 1
        fi

        printf '%s\n' "${merman_bin_dir}" >> "${GITHUB_PATH}"
        printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
