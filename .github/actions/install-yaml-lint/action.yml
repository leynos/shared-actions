name: Install YAML lint tools
description: >
  Install the pinned YAML and workflow lint tools: yamllint through uv, and
  checksum-verified actionlint and shellcheck releases. actionlint runs
  shellcheck over every `run:` script it finds on PATH, so both are installed
  from the same step and the three versions move together.
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - name: Install yamllint, actionlint and shellcheck
      shell: bash
      run: |
        set -euo pipefail

        # The pins. Change a version here, in the digests below, in the
        # README and in the tests together; Dependabot then moves every
        # consumer by bumping the SHA that references this action.
        yamllint_version="1.38.0"
        actionlint_version="1.7.12"
        shellcheck_version="0.11.0"

        # Emitted to the log for a scraper and to the summary for a reader.
        # The values are a fixed vocabulary, never the tool's own output.
        emit_metric() {
          echo "metric $1"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '%s\n' "metric $1" >> "$GITHUB_STEP_SUMMARY"
          fi
        }

        fail() {
          emit_metric "install-yaml-lint.result=$2"
          echo "::error title=Install YAML lint tools::$1" >&2
          exit 1
        }

        for required in uv curl tar install; do
          command -v "$required" >/dev/null 2>&1 ||
            fail "${required} is required on PATH" missing-prerequisite
        done

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum < "$1" | awk '{print $1}'
          else
            shasum -a 256 < "$1" | awk '{print $1}'
          fi
        }

        # Every digest was computed from an independent download of the
        # archive. actionlint also publishes a checksums file, which agreed;
        # shellcheck publishes none.
        case "${RUNNER_OS:-}/${RUNNER_ARCH:-}" in
          Linux/X64)
            actionlint_asset="actionlint_${actionlint_version}_linux_amd64.tar.gz"
            actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
            shellcheck_asset="shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
            shellcheck_sha256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
            ;;
          Linux/ARM64)
            actionlint_asset="actionlint_${actionlint_version}_linux_arm64.tar.gz"
            actionlint_sha256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
            shellcheck_asset="shellcheck-v${shellcheck_version}.linux.aarch64.tar.xz"
            shellcheck_sha256="12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588"
            ;;
          macOS/X64)
            actionlint_asset="actionlint_${actionlint_version}_darwin_amd64.tar.gz"
            actionlint_sha256="5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644"
            shellcheck_asset="shellcheck-v${shellcheck_version}.darwin.x86_64.tar.xz"
            shellcheck_sha256="3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6"
            ;;
          macOS/ARM64)
            actionlint_asset="actionlint_${actionlint_version}_darwin_arm64.tar.gz"
            actionlint_sha256="aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f"
            shellcheck_asset="shellcheck-v${shellcheck_version}.darwin.aarch64.tar.xz"
            shellcheck_sha256="56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79"
            ;;
          *)
            fail "no verified release is configured for ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}" unsupported-platform
            ;;
        esac

        bin_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/yaml-lint/${actionlint_version}-${shellcheck_version}/bin"
        mkdir -p -- "$bin_dir"
        temporary_dir="$(mktemp -d)"
        trap 'rm -rf -- "${temporary_dir}"' EXIT

        # Fetch one archive, refuse it unless its digest matches the pin, and
        # install one member. The member is named rather than globbed so an
        # unexpected archive layout fails instead of installing the wrong file.
        install_release() {
          local url="$1" asset="$2" expected="$3" member="$4" target="$5" actual
          curl --connect-timeout 15 --max-time 120 --retry 3 --retry-delay 2 \
            --retry-max-time 180 --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --output "${temporary_dir}/${asset}" "$url" ||
            fail "could not download ${asset}" download-failed
          actual="$(sha256_of "${temporary_dir}/${asset}")" ||
            fail "could not hash ${asset}" hash-failed
          if [[ "$actual" != "$expected" ]]; then
            fail "checksum mismatch for ${asset}: expected ${expected}, received ${actual}" digest-mismatch
          fi
          mkdir -p -- "${temporary_dir}/${target}"
          tar -xf "${temporary_dir}/${asset}" -C "${temporary_dir}/${target}" ||
            fail "could not extract ${asset}" extract-failed
          [[ -f "${temporary_dir}/${target}/${member}" ]] ||
            fail "${member} is not in ${asset}" missing-member
          install -m 0755 "${temporary_dir}/${target}/${member}" "${bin_dir}/${target}" ||
            fail "could not install ${target} into ${bin_dir}" install-failed
        }

        reports() {
          local reported
          reported="$("$1" "${@:3}" 2>&1)" || return 1
          [[ "$reported" == *"$2"* ]]
        }

        # The cache is the version-scoped directory itself. A binary that is
        # absent is a miss; one that is present but does not report the pinned
        # version is stale, which names a corrupted or replaced cache entry.
        cache_state() {
          if [[ ! -e "$1" ]]; then
            echo miss
          elif reports "$@"; then
            echo hit
          else
            echo stale
          fi
        }

        actionlint_state="$(cache_state "${bin_dir}/actionlint" "${actionlint_version}" -version)"
        if [[ "$actionlint_state" == hit ]]; then
          emit_metric "install-yaml-lint.actionlint=cache-hit"
        else
          emit_metric "install-yaml-lint.actionlint=cache-${actionlint_state}"
          install_release \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_asset}" \
            "$actionlint_asset" "$actionlint_sha256" actionlint actionlint
        fi
        shellcheck_state="$(cache_state "${bin_dir}/shellcheck" "version: ${shellcheck_version}" --version)"
        if [[ "$shellcheck_state" == hit ]]; then
          emit_metric "install-yaml-lint.shellcheck=cache-hit"
        else
          emit_metric "install-yaml-lint.shellcheck=cache-${shellcheck_state}"
          install_release \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/${shellcheck_asset}" \
            "$shellcheck_asset" "$shellcheck_sha256" "shellcheck-v${shellcheck_version}/shellcheck" shellcheck
        fi

        uv tool install "yamllint==${yamllint_version}" ||
          fail "uv could not install yamllint==${yamllint_version}" uv-install-failed
        uv_bin_dir="$(uv tool dir --bin)" ||
          fail "uv could not report its tool directory" uv-dir-failed

        # The runner prepends each GITHUB_PATH line, so the later one wins: the
        # verified release directory goes last, so an actionlint or shellcheck
        # that happens to sit in uv's directory cannot shadow the verified one.
        printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
        printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

        # The last word is the installed binary's own.
        reports "${bin_dir}/actionlint" "${actionlint_version}" -version ||
          fail "actionlint ${actionlint_version} did not report its version" version-mismatch
        reports "${bin_dir}/shellcheck" "version: ${shellcheck_version}" --version ||
          fail "shellcheck ${shellcheck_version} did not report its version" version-mismatch
        reports "${uv_bin_dir}/yamllint" "yamllint ${yamllint_version}" --version ||
          fail "yamllint ${yamllint_version} did not report its version" version-mismatch
        emit_metric "install-yaml-lint.result=ok"
