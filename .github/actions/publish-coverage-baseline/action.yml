name: Publish coverage baseline
description: >-
  Ratchet the coverage figures a generate-coverage job handed over, and save
  the advanced baseline to the cache store this runner's pull requests read.
inputs:
  artefact-name:
    description: >-
      Name of the hand-over artefact, the `baseline-artefact-name` the
      generate-coverage job was given.
    required: true
  baseline-rust-file:
    description: Path of the Rust coverage baseline; match generate-coverage.
    required: false
    default: .coverage-baseline.rust
  baseline-python-file:
    description: Path of the Python coverage baseline; match generate-coverage.
    required: false
    default: .coverage-baseline.python
runs:
  using: composite
  steps:
    - name: Download baseline hand-over
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artefact-name }}
        path: ${{ runner.temp }}/coverage-baseline-handover
    - name: Read baseline hand-over
      id: handover
      shell: bash
      env:
        GC_HANDOVER_DIR: ${{ runner.temp }}/coverage-baseline-handover
      run: |
        set -euo pipefail
        # The segment is part of the cache key, so the pull-request lanes
        # that restore it must have computed the same one: `py<major.minor>-`
        # when Python is measured, empty otherwise.
        segment="$(cat "$GC_HANDOVER_DIR/segment")"
        lang="$(cat "$GC_HANDOVER_DIR/lang")"
        echo "segment=$segment" >> "$GITHUB_OUTPUT"
        echo "lang=$lang" >> "$GITHUB_OUTPUT"
    - name: Setup uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        version: '0.12.19'
        enable-cache: false
        # The ratchet script runs through `uv run --script`; see the same
        # settings in generate-coverage for why no environment is saved.
        prune-cache: true
    - name: Prune restored uv cache
      # A cache restored by the calling workflow shares this directory, so
      # prune before the first `uv run --script` regardless of who restored.
      shell: bash
      run: bash "${{ github.action_path }}/../../scripts/prune_uv_cache.sh"
    - name: Restore baselines
      id: restore-baselines
      # The same restore, over the same path list, as generate-coverage's:
      # the path list is part of a cache entry's version, so a save over any
      # other list would be invisible to the pull-request restore.
      # v6.1.0
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ inputs.baseline-rust-file }}
          ${{ inputs.baseline-python-file }}
        key: ratchet-baseline-${{ runner.os }}-${{ steps.handover.outputs.segment }}${{ github.run_id }}
        restore-keys: ratchet-baseline-${{ runner.os }}-${{ steps.handover.outputs.segment }}
    - name: Ensure baseline files
      shell: bash
      env:
        GC_RUST_FILE: ${{ inputs.baseline-rust-file }}
        GC_PYTHON_FILE: ${{ inputs.baseline-python-file }}
      run: |
        set -euo pipefail
        for file in "$GC_RUST_FILE" "$GC_PYTHON_FILE"; do
          if [ ! -f "$file" ]; then
            mkdir -p "$(dirname "$file")"
            echo 0 > "$file"
          fi
        done
    - name: Ratchet coverage
      # The comparison generate-coverage runs in-job elsewhere: it fails when
      # the figure falls below the restored baseline and advances the file
      # when it rises. A failure stops the job before the save below, so a
      # drop never lowers the baseline the pull requests check against.
      shell: bash
      env:
        GC_HANDOVER_DIR: ${{ runner.temp }}/coverage-baseline-handover
        GC_LANG: ${{ steps.handover.outputs.lang }}
        GC_RUST_FILE: ${{ inputs.baseline-rust-file }}
        GC_PYTHON_FILE: ${{ inputs.baseline-python-file }}
        GC_RATCHET: ${{ github.action_path }}/../generate-coverage/scripts/ratchet_coverage.py
      run: |
        set -euo pipefail
        ratchet() {
          uv run --script "$GC_RATCHET" \
            --baseline-file "$1" \
            --current "$(cat "$2")"
        }
        if [[ "$GC_LANG" == "rust" || "$GC_LANG" == "mixed" ]]; then
          ratchet "$GC_RUST_FILE" "$GC_HANDOVER_DIR/rust.percent"
        fi
        if [[ "$GC_LANG" == "python" || "$GC_LANG" == "mixed" ]]; then
          ratchet "$GC_PYTHON_FILE" "$GC_HANDOVER_DIR/python.percent"
        fi
    - name: Save baselines
      id: save-baselines
      # Run-id-suffixed key, as generate-coverage saves: cache entries are
      # immutable, and the pull-request restore recovers the newest entry
      # through the shared prefix. Trunk pushes only, as there.
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      # v6.1.0
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ inputs.baseline-rust-file }}
          ${{ inputs.baseline-python-file }}
        key: ratchet-baseline-${{ runner.os }}-${{ steps.handover.outputs.segment }}${{ github.run_id }}
