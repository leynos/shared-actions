[pytest]
testpaths =
    .github/actions
    workflow_scripts/tests
    tests/workflows/test_coverage_lane_reading.py
    tests/workflows/test_coverage_timeout_tiers.py
    # Naming a file here is what makes it run: `make test` and CI's bare
    # `uv run pytest` both honour `testpaths`, and the rest of `tests/` is
    # held back only because it needs `act` and a container runtime. This
    # one needs neither, and it is the guard that keeps `action_pins.py` in
    # the typecheck target — a guard that does not run reports nothing.
    tests/test_makefile_typecheck.py
