name: Generate coverage
description: Run test coverage for Rust, Python and mixed Rust and Python projects
inputs:
  features:
    description: Cargo features to enable
    required: false
  with-default-features:
    description: Enable default features
    required: false
    default: "true"
  all-features:
    description: >
      Enable every Cargo feature via --all-features. Takes precedence over
      with-default-features, which it supersedes. Setting this together with a
      non-empty features list is rejected, because --all-features already
      enables everything the list could name.
    required: false
    default: "false"
  all-targets:
    description: >
      Pass --all-targets to the coverage run so benches, examples, and every
      test target are built and executed alongside lib and bin tests. Doc tests
      are not a --all-targets target; use the doctests input for those.
    required: false
    default: "false"
  doctests:
    description: >
      Run `cargo test --doc --workspace` after the instrumented run, using the
      same feature selection. The doc-test run is uninstrumented and
      contributes no coverage, because llvm-cov's nextest path cannot execute
      doc tests; it exists so one coverage job can be a repository's only test
      execution.
    required: false
    default: "false"
  language:
    description: |
      Coverage language scope. `auto` (the default) keeps the historical
      manifest-based detection: a root `Cargo.toml` selects Rust, a root
      `pyproject.toml` selects Python, and both together select mixed. Explicit
      values force the requested scope and fail fast when its prerequisites are
      absent: `rust` requires a resolved Cargo manifest and ignores a
      configuration-only `pyproject.toml`; `python` requires a syncable
      `pyproject.toml` with a `[project]` table; `mixed` requires both.
    required: false
    default: auto
  cargo-manifest:
    description: Optional path to Cargo.toml when the repository root has none
    required: false
  use-cargo-nextest:
    description: Use cargo-nextest for Rust coverage runs
    required: false
    default: "true"
  output-path:
    description: Output file path
    required: true
  format:
    description: Coverage format
    required: false
    default: cobertura
  with-ratchet:
    description: Fail if coverage falls below the stored baseline
    required: false
    default: "false"
  cargo-wait-timeout:
    description: >-
      Seconds cargo may run before the watchdog kills it. The watchdog exists
      to catch a hang, so the budget is sized for a cold sccache store: a lane
      that does not archive its target tree compiles everything on the first
      run of a branch and after every eviction. Raise it for a slower suite;
      lower it only if a hang must be caught sooner than the build can finish.
    required: false
    default: "1800"
  artefact-name-suffix:
    description: Optional suffix appended to the coverage artefact name
    required: false
  baseline-rust-file:
    description: Path to store the Rust coverage baseline
    required: false
    default: .coverage-baseline.rust
  baseline-python-file:
    description: Path to store the Python coverage baseline
    required: false
    default: .coverage-baseline.python
  with-cucumber-rs:
    description: Run cucumber-rs scenarios under coverage
    required: false
    default: "false"
  cucumber-rs-features:
    description: Path to cucumber feature files
    required: false
  cucumber-rs-args:
    description: Extra arguments for cucumber
    required: false
  pytest-workers:
    description: |
      Value passed to pytest-xdist's `-n` flag for the Python coverage run.
      Accepts a positive integer, "auto", "logical", or "" (empty) to
      disable parallelism and keep the historical serial pytest behaviour.
    required: false
    default: auto
  cache-provider:
    description: >
      Cache owner for Cargo and uv state. Use "github" for the action's
      built-in GitHub caches or "external" when the caller mounts one cache
      owner, such as a Namespace cache volume.
    required: false
    default: github
outputs:
  file:
    description: Path to the generated coverage file
    value: ${{ steps.out.outputs.file }}
  format:
    description: Format of the coverage file
    value: ${{ steps.out.outputs.format }}
  lang:
    description: Detected project language
    value: ${{ steps.detect.outputs.lang }}
  artefact-name:
    description: Name used for the uploaded coverage artefact
    value: ${{ steps.out.outputs.artefact_name }}
runs:
  using: composite
  steps:
    - name: Validate cache provider
      shell: bash
      env:
        GC_CACHE_PROVIDER: ${{ inputs.cache-provider }}
      run: |
        set -euo pipefail
        case "$GC_CACHE_PROVIDER" in
          github|external) ;;
          *)
            echo "::error::cache-provider must be github or external" >&2
            exit 1
            ;;
        esac
    - name: Setup uv
      id: setup-uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        enable-cache: ${{ inputs.cache-provider == 'github' && runner.environment == 'github-hosted' }}
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
        cache-suffix: action-${{ github.action_ref || github.sha }}
    - id: detect
      run: uv run --script "${{ github.action_path }}/scripts/detect.py"
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_CARGO_MANIFEST: ${{ inputs.cargo-manifest }}
        INPUT_LANGUAGE: ${{ inputs.language }}
      shell: bash
    - name: Restore baselines
      id: restore-baselines
      if: inputs.with-ratchet == 'true'
      # The restore sub-action, not the full `actions/cache` action: the full
      # action also registers a post-job save on its primary key, which the
      # "Save baselines" step below already writes. Both firing on the same
      # run-id key made every run log
      # "Failed to save: Unable to reserve cache ... already exists".
      # v6.1.0
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ inputs.baseline-rust-file }}
          ${{ inputs.baseline-python-file }}
        key: ratchet-baseline-${{ runner.os }}-${{ github.run_id }}
        restore-keys: ratchet-baseline-${{ runner.os }}-
    - name: Ensure baseline files
      if: inputs.with-ratchet == 'true'
      run: |
        if [ ! -f "${{ inputs.baseline-rust-file }}" ]; then
          mkdir -p "$(dirname '${{ inputs.baseline-rust-file }}')"
          echo 0 > "${{ inputs.baseline-rust-file }}"
        fi
        if [ ! -f "${{ inputs.baseline-python-file }}" ]; then
          mkdir -p "$(dirname '${{ inputs.baseline-python-file }}')"
          echo 0 > "${{ inputs.baseline-python-file }}"
        fi
      shell: bash
    - name: Cache cargo artefacts
      id: cargo-cache
      if: inputs.cache-provider == 'github' && (steps.detect.outputs.lang == 'rust' || steps.detect.outputs.lang == 'mixed')
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/bin/cargo-binstall
          ~/.cargo/bin/cargo-llvm-cov
          ~/.cargo/bin/cargo-nextest
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-llvmcov-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-llvmcov-
    - name: Ensure cargo-binstall
      if: steps.detect.outputs.lang == 'rust' || steps.detect.outputs.lang == 'mixed'
      run: |
        set -euo pipefail
        # NOTE: BINSTALL_SHA256 pins and validates only the installer script
        # (install-from-binstall-release.sh), not the cargo-binstall binary that
        # the script subsequently downloads and executes.
        #
        # Keep BINSTALL_VERSION and BINSTALL_SHA256 in sync; update both together.
        # To refresh the installer checksum: curl -fsSL "$INSTALLER_URL" | shasum -a 256 | awk '{print $1}'
        #
        # If a stronger supply-chain posture is required (similar to cargo-nextest),
        # extend this step to also verify the checksum of the downloaded cargo-binstall
        # artefact before invoking it, assuming such checksums are available upstream.
        # Export so the child installer shell inherits it; the installer reads
        # BINSTALL_VERSION from the environment to pick the pinned release and
        # otherwise silently falls back to releases/latest.
        export BINSTALL_VERSION="v1.19.1"
        binstall_ver="${BINSTALL_VERSION#v}"
        # Match the pinned version as a whole, space-delimited token so a
        # look-alike such as 1.19.10 does not satisfy a 1.19.1 pin. The `-V`
        # output may be a bare version ("1.19.1") or "<name> <version>".
        binstall_version_matches() {
          case " $1 " in
            *" ${binstall_ver} "*) return 0 ;;
            *) return 1 ;;
          esac
        }
        if command -v cargo-binstall >/dev/null 2>&1; then
          existing_version="$(cargo-binstall -V)"
          if binstall_version_matches "$existing_version"; then
            echo "cargo-binstall already installed: $existing_version"
            exit 0
          fi
          echo "cargo-binstall version mismatch: expected $binstall_ver, found $existing_version; reinstalling pinned version" >&2
        fi
        BINSTALL_SHA256="d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae"
        INSTALLER_URL="https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${BINSTALL_VERSION}/install-from-binstall-release.sh"
        INSTALLER_PATH="$(mktemp)"
        trap 'rm -f "$INSTALLER_PATH"' EXIT
        curl -fsSL --proto '=https' --tlsv1.2 "$INSTALLER_URL" -o "$INSTALLER_PATH"
        if [ ! -s "$INSTALLER_PATH" ]; then
          echo "cargo-binstall installer download failed or empty" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_SHA256="$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')"
        else
          ACTUAL_SHA256="$(shasum -a 256 "$INSTALLER_PATH" | awk '{print $1}')"
        fi
        if [ "$ACTUAL_SHA256" != "$BINSTALL_SHA256" ]; then
          echo "cargo-binstall install script checksum mismatch: $ACTUAL_SHA256" >&2
          exit 1
        fi
        bash "$INSTALLER_PATH"
        cargo_home_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        if [ -n "${GITHUB_PATH:-}" ]; then
          echo "$cargo_home_bin" >> "$GITHUB_PATH"
        fi
        cargo_binstall="$cargo_home_bin/cargo-binstall"
        installed_version="$("$cargo_binstall" -V)"
        if ! binstall_version_matches "$installed_version"; then
          echo "cargo-binstall version verification failed: expected $binstall_ver" >&2
          printf '%s\n' "$installed_version" >&2
          exit 1
        fi
        echo "cargo-binstall $installed_version verified"
      shell: bash
    - name: Install cargo-llvm-cov
      if: steps.detect.outputs.lang == 'rust' || steps.detect.outputs.lang == 'mixed'
      run: uv run --script "${{ github.action_path }}/scripts/install_cargo_llvm_cov.py"
      shell: bash
    - name: Install cargo-nextest
      if: (steps.detect.outputs.lang == 'rust' || steps.detect.outputs.lang == 'mixed') && inputs.use-cargo-nextest == 'true'
      run: uv run --script "${{ github.action_path }}/scripts/install_cargo_nextest.py"
      shell: bash
    # This isn't how you install cucumber :'(
    #- name: Install cargo-cucumber
    #  if: inputs.with-cucumber-rs == 'true' && (steps.detect.outputs.lang == 'rust' || steps.detect.outputs.lang == 'mixed')
    #  run: cargo install cargo-cucumber --force
    #  shell: bash
    - id: rust
      if: steps.detect.outputs.lang == 'rust' || steps.detect.outputs.lang == 'mixed'
      run: uv run --script "${{ github.action_path }}/scripts/run_rust.py"
      env:
        DETECTED_LANG: ${{ steps.detect.outputs.lang }}
        DETECTED_FMT: ${{ steps.detect.outputs.fmt }}
        DETECTED_CARGO_MANIFEST: ${{ steps.detect.outputs.cargo_manifest }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_FEATURES: ${{ inputs.features }}
        INPUT_WITH_DEFAULT_FEATURES: ${{ inputs.with-default-features }}
        INPUT_ALL_FEATURES: ${{ inputs.all-features }}
        INPUT_ALL_TARGETS: ${{ inputs.all-targets }}
        INPUT_DOCTESTS: ${{ inputs.doctests }}
        INPUT_USE_CARGO_NEXTEST: ${{ inputs.use-cargo-nextest }}
        INPUT_WITH_CUCUMBER_RS: ${{ inputs.with-cucumber-rs }}
        INPUT_CUCUMBER_RS_FEATURES: ${{ inputs.cucumber-rs-features }}
        INPUT_CUCUMBER_RS_ARGS: ${{ inputs.cucumber-rs-args }}
        BASELINE_RUST_FILE: ${{ inputs.baseline-rust-file }}
        RUN_RUST_CARGO_WAIT_TIMEOUT: ${{ inputs.cargo-wait-timeout }}
      shell: bash

    - name: Cache Python deps
      id: python-cache
      if: inputs.cache-provider == 'github' && (steps.detect.outputs.lang == 'python' || steps.detect.outputs.lang == 'mixed')
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-py-deps-${{ hashfiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-py-deps-

    - name: Report archive cache decisions
      if: ${{ always() }}
      shell: bash
      env:
        GC_CACHE_PROVIDER: ${{ inputs.cache-provider }}
        GC_LANGUAGE: ${{ steps.detect.outputs.lang }}
        GC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        GC_UV_STEP_OUTCOME: ${{ steps.setup-uv.outcome }}
        GC_UV_CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        GC_CARGO_STEP_OUTCOME: ${{ steps.cargo-cache.outcome }}
        GC_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        GC_PYTHON_STEP_OUTCOME: ${{ steps.python-cache.outcome }}
        GC_PYTHON_CACHE_HIT: ${{ steps.python-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        cache_outcome() {
          local step_outcome="$1"
          local cache_hit="$2"
          case "$step_outcome" in
            success)
              case "$cache_hit" in
                true) printf 'hit' ;;
                false|'') printf 'miss' ;;
                *) printf 'error' ;;
              esac
              ;;
            skipped) printf 'disabled' ;;
            *) printf 'error' ;;
          esac
        }

        cargo_outcome='disabled'
        python_outcome='disabled'
        uv_outcome='disabled'
        if [[ "$GC_CACHE_PROVIDER" == 'github' ]]; then
          if [[ "$GC_RUNNER_ENVIRONMENT" == 'github-hosted' ]]; then
            uv_outcome="$(cache_outcome "$GC_UV_STEP_OUTCOME" "$GC_UV_CACHE_HIT")"
          fi
          if [[ "$GC_LANGUAGE" == 'rust' || "$GC_LANGUAGE" == 'mixed' ]]; then
            cargo_outcome="$(cache_outcome "$GC_CARGO_STEP_OUTCOME" "$GC_CARGO_CACHE_HIT")"
          fi
          if [[ "$GC_LANGUAGE" == 'python' || "$GC_LANGUAGE" == 'mixed' ]]; then
            python_outcome="$(cache_outcome "$GC_PYTHON_STEP_OUTCOME" "$GC_PYTHON_CACHE_HIT")"
          fi
        fi

        printf '::notice title=generate-coverage cache::provider=%s cargo=%s python=%s uv=%s\n' \
          "$GC_CACHE_PROVIDER" "$cargo_outcome" "$python_outcome" "$uv_outcome"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          printf '%s\n' \
            '### generate-coverage cache' \
            "- provider: $GC_CACHE_PROVIDER" \
            "- cargo archive: $cargo_outcome" \
            "- Python archive: $python_outcome" \
            "- uv archive: $uv_outcome" >> "$GITHUB_STEP_SUMMARY"
        fi

    - id: python
      if: steps.detect.outputs.lang == 'python' || steps.detect.outputs.lang == 'mixed'
      run: uv run --script "${{ github.action_path }}/scripts/run_python.py"
      env:
        DETECTED_LANG: ${{ steps.detect.outputs.lang }}
        DETECTED_FMT: ${{ steps.detect.outputs.fmt }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        BASELINE_PYTHON_FILE: ${{ inputs.baseline-python-file }}
        INPUT_PYTEST_WORKERS: ${{ inputs.pytest-workers }}
      shell: bash
    - if: steps.detect.outputs.lang == 'mixed'
      run: uv run --script "${{ github.action_path }}/scripts/merge_cobertura.py"
      env:
        RUST_FILE: ${{ steps.rust.outputs.file }}
        PYTHON_FILE: ${{ steps.python.outputs.file }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      shell: bash
    - name: Ratchet coverage
      if: inputs.with-ratchet == 'true'
      run: |
        set -euo pipefail
        ratchet() {
          uv run --script "${{ github.action_path }}/scripts/ratchet_coverage.py" \
            --baseline-file "$1" \
            --current "$2"
        }

        lang="${{ steps.detect.outputs.lang }}"
        if [[ "$lang" == "rust" || "$lang" == "mixed" ]]; then
          ratchet "${{ inputs.baseline-rust-file }}" "${{ steps.rust.outputs.percent }}"
        fi
        if [[ "$lang" == "python" || "$lang" == "mixed" ]]; then
          ratchet "${{ inputs.baseline-python-file }}" "${{ steps.python.outputs.percent }}"
        fi
      shell: bash
    - name: Save baselines
      id: save-baselines
      # Save under the same run-id-suffixed key the restore step uses as its
      # primary key. GitHub Actions cache entries are immutable, so a constant
      # key (`ratchet-baseline-${{ runner.os }}`) can only ever be written once
      # and then freezes the baseline until the 7-day eviction. A per-run key
      # is unique, so every main run persists a fresh baseline that later runs
      # pick up via the `ratchet-baseline-${{ runner.os }}-` restore-key prefix
      # (newest matching entry wins). The `cache-hit` guard is intentionally
      # dropped: the restore primary key never matches within the same run, so
      # `cache-hit` is always false here and the guard only ever suppressed the
      # save on the constant key.
      # The save sub-action pairs with the restore sub-action above, so exactly
      # one step writes this key.
      if: success() && inputs.with-ratchet == 'true'
      # v6.1.0
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ inputs.baseline-rust-file }}
          ${{ inputs.baseline-python-file }}
        key: ratchet-baseline-${{ runner.os }}-${{ github.run_id }}
    - name: Report ratchet baseline cache decisions
      # Reported here rather than in the archive-cache step above because the
      # save half runs later; both halves of the split are observable in one
      # place. The notice names only the operation and a bounded outcome:
      # cache keys carry the run id, and neither key nor path belongs in a log
      # line consumers parse.
      if: ${{ always() }}
      shell: bash
      env:
        GC_WITH_RATCHET: ${{ inputs.with-ratchet }}
        GC_RESTORE_STEP_OUTCOME: ${{ steps.restore-baselines.outcome }}
        GC_RESTORE_CACHE_HIT: ${{ steps.restore-baselines.outputs.cache-hit }}
        GC_SAVE_STEP_OUTCOME: ${{ steps.save-baselines.outcome }}
      run: |
        set -euo pipefail
        restore_outcome='disabled'
        save_outcome='disabled'
        if [[ "$GC_WITH_RATCHET" == 'true' ]]; then
          case "$GC_RESTORE_STEP_OUTCOME" in
            success)
              case "$GC_RESTORE_CACHE_HIT" in
                true) restore_outcome='hit' ;;
                false|'') restore_outcome='miss' ;;
                *) restore_outcome='error' ;;
              esac
              ;;
            # 'disabled' is reserved for with-ratchet being off. The step's
            # own condition carries an implicit success(), so an earlier
            # failure skips it while the cache was still enabled; calling that
            # 'disabled' would misreport a configured cache as switched off.
            skipped) restore_outcome='skipped' ;;
            *) restore_outcome='error' ;;
          esac
          case "$GC_SAVE_STEP_OUTCOME" in
            success) save_outcome='saved' ;;
            skipped) save_outcome='skipped' ;;
            *) save_outcome='error' ;;
          esac
        fi

        # One stable line per outcome, in a fixed `name=value` shape a log
        # scraper can match without parsing the notice. The name is fixed and
        # the value comes from the closed vocabularies above, so the pair stays
        # low cardinality; no key, path, or run identifier appears.
        printf 'metric ratchet-cache.restore=%s\n' "$restore_outcome"
        printf 'metric ratchet-cache.save=%s\n' "$save_outcome"
        printf '::notice title=generate-coverage ratchet cache::restore=%s save=%s\n' \
          "$restore_outcome" "$save_outcome"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          printf '%s\n' \
            '### generate-coverage ratchet cache' \
            "- baseline restore: $restore_outcome" \
            "- baseline save: $save_outcome" >> "$GITHUB_STEP_SUMMARY"
        fi

    - id: out
      # Run even after a *later* failure (for example a ratchet gate that
      # trips) so the coverage outputs are still computed. Without this the
      # step is skipped on failure, `artefact_name` is empty, and the
      # always-run archive below fails with a confusing empty-artefact-name
      # error that masks the real cause. Gate on a successful detection: when
      # `detect` itself failed there is no format, so `set_outputs.py` would
      # raise "Coverage format is required" — a second failure of exactly the
      # kind this guard removes. Skipping `out` there lets the archive's
      # name fallback carry the upload while the real detection error surfaces.
      if: ${{ always() && steps.detect.outputs.fmt != '' }}
      run: uv run --script "${{ github.action_path }}/scripts/set_outputs.py"
      env:
        DETECTED_FMT: ${{ steps.detect.outputs.fmt }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_ARTEFACT_NAME_SUFFIX: ${{ inputs.artefact-name-suffix }}
        GITHUB_JOB: ${{ github.job }}
        STRATEGY_JOB_INDEX: ${{ strategy.job-index }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      shell: bash
    - name: Archive coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # Fall back to a run-scoped name when `out` could not compute one (for
        # example when coverage detection was skipped by an even earlier
        # failure), so a broken run still surfaces its real error rather than an
        # empty-artifact-name error.
        name: ${{ steps.out.outputs.artefact_name || format('coverage-{0}-{1}-{2}', github.job, strategy.job-index, github.run_id) }}
        # Fallback to the configured output path when the step that sets
        # outputs didn't run successfully and the file output is empty.
        path: ${{ steps.out.outputs.file || inputs.output-path }}
        retention-days: 14
