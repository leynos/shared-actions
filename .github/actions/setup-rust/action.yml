name: Setup Rust
description: Install Rust and cache cargo registry
inputs:
  toolchain:
    description: >
      Rust toolchain to install (e.g., 'stable', 'nightly', '1.70.0').
      Accepts any valid Rust toolchain identifier as supported by rustup.
    required: false
  install-postgres-deps:
    description: Install PostgreSQL system dependencies
    required: false
    default: "false"
  install-sqlite-deps:
    description: Install SQLite development libraries on Windows
    required: false
    default: "false"
  use-sccache:
    description: Enable sccache for non-release runs
    required: false
    default: "true"
  cache-provider:
    description: >
      Cache owner for Cargo and uv state. Use "github" for the action's
      built-in GitHub caches or "external" when the caller mounts one cache
      owner, such as a Namespace cache volume.
    required: false
    default: "github"
  install-binstall:
    description: Install cargo-binstall for faster binary crate installations
    required: false
    default: "true"
  with-darwin:
    description: Install macOS cross build toolchain
    required: false
    default: 'false'
  darwin-sdk-version:
    description: macOS SDK version for osxcross
    required: false
    default: '12.3'
  with-openbsd:
    description: Build OpenBSD std library for cross-compilation
    required: false
    default: 'false'
  openbsd-nightly:
    description: Nightly toolchain version for OpenBSD build
    required: false
    default: 'nightly-2025-07-20'
  rustflags:
    description: >
      Value exported as the RUSTFLAGS environment variable by the toolchain
      setup step. Set to the empty string to leave RUSTFLAGS unset, so an
      inherited value or the project's Cargo configuration
      (build.rustflags in .cargo/config.toml) applies. A pre-existing
      RUSTFLAGS environment variable always takes precedence over this
      input. The value must be a single line.
    required: false
    default: '-D warnings'
runs:
  using: composite
  steps:
    - name: Validate rustflags
      # The nested toolchain action writes this value to GITHUB_ENV as a plain
      # "RUSTFLAGS=<value>" line, so a line break in it would start a further
      # environment-file entry and set variables the caller never asked for.
      # Reject line breaks here rather than forwarding them. The value itself
      # is never echoed.
      shell: bash
      env:
        SR_RUSTFLAGS: ${{ inputs.rustflags }}
      run: |
        set -euo pipefail
        case "$SR_RUSTFLAGS" in
          *$'\n'*|*$'\r'*)
            echo "::error::rustflags must not contain line breaks" >&2
            exit 1
            ;;
        esac
    - name: Validate cache provider
      shell: bash
      env:
        SR_CACHE_PROVIDER: ${{ inputs.cache-provider }}
      run: |
        set -euo pipefail
        case "$SR_CACHE_PROVIDER" in
          github|external) ;;
          *)
            echo "::error::cache-provider must be github or external" >&2
            exit 1
            ;;
        esac
    - name: Install rust (explicit toolchain)
      if: ${{ inputs.toolchain != '' }}
      uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9
      with:
        override: true
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt, clippy, llvm-tools-preview
        cache: false
        rustflags: ${{ inputs.rustflags }}
    - name: Install rust (rust-toolchain file)
      if: ${{ inputs.toolchain == '' && hashFiles('rust-toolchain.toml', 'rust-toolchain') != '' }}
      uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9
      with:
        override: false
        components: rustfmt, clippy, llvm-tools-preview
        cache: false
        rustflags: ${{ inputs.rustflags }}
    - name: Install rust (stable default)
      if: ${{ inputs.toolchain == '' && hashFiles('rust-toolchain.toml', 'rust-toolchain') == '' }}
      uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9
      with:
        override: true
        toolchain: stable
        components: rustfmt, clippy, llvm-tools-preview
        cache: false
        rustflags: ${{ inputs.rustflags }}
    - name: Install cargo-binstall
      if: ${{ inputs.install-binstall == 'true' }}
      run: |
        set -euo pipefail
        # Keep BINSTALL_VERSION and BINSTALL_SHA256 in sync; update both together.
        # To refresh the checksum: curl -fsSL "$INSTALLER_URL" | shasum -a 256 | awk '{print $1}'
        export BINSTALL_VERSION="v1.19.1"
        BINSTALL_SHA256="d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae"
        INSTALLER_URL="https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${BINSTALL_VERSION}/install-from-binstall-release.sh"
        INSTALLER_PATH="$(mktemp)"
        trap 'rm -f "$INSTALLER_PATH"' EXIT
        curl -fsSL --proto '=https' --tlsv1.2 "$INSTALLER_URL" -o "$INSTALLER_PATH"
        if [ ! -s "$INSTALLER_PATH" ]; then
          echo "cargo-binstall installer download failed or empty" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_SHA256="$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')"
        else
          ACTUAL_SHA256="$(shasum -a 256 "$INSTALLER_PATH" | awk '{print $1}')"
        fi
        if [ "$ACTUAL_SHA256" != "$BINSTALL_SHA256" ]; then
          echo "cargo-binstall install script checksum mismatch: $ACTUAL_SHA256" >&2
          exit 1
        fi
        bash "$INSTALLER_PATH"
        # The cargo-binstall installer respects CARGO_HOME and writes
        # cargo-binstall into ${CARGO_HOME:-$HOME/.cargo}/bin, so the same
        # resolution gives us the absolute path to the freshly installed binary.
        cargo_home_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        echo "cargo-binstall: resolved cargo_home_bin=${cargo_home_bin}"
        if [ -n "${GITHUB_PATH:-}" ]; then
          echo "$cargo_home_bin" >> "$GITHUB_PATH"
          echo "cargo-binstall: appended ${cargo_home_bin} to GITHUB_PATH"
        else
          echo "cargo-binstall: GITHUB_PATH not set; skipping GITHUB_PATH append"
        fi
        case ":$PATH:" in
          *":$cargo_home_bin:"*)
            echo "cargo-binstall: ${cargo_home_bin} already on PATH; skipping prepend"
            ;;
          *)
            export PATH="$cargo_home_bin:$PATH"
            echo "cargo-binstall: prepended ${cargo_home_bin} to PATH"
            ;;
        esac
        cargo_binstall="$cargo_home_bin/cargo-binstall"
        binstall_ver="${BINSTALL_VERSION#v}"
        if ! "$cargo_binstall" -V | grep -qF "$binstall_ver"; then
          echo "cargo-binstall version verification failed: expected $binstall_ver" >&2
          "$cargo_binstall" -V >&2
          exit 1
        fi
        echo "cargo-binstall $("$cargo_binstall" -V) verified"
      shell: bash
    - name: Install uv
      id: setup-uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        enable-cache: ${{ inputs.cache-provider == 'github' && runner.environment == 'github-hosted' }}
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
          **/scripts/*.py
    - name: Install nightly toolchain (needed for OpenBSD cross-compilation)
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' }}
      run: |
        set -euo pipefail
        OPENBSD_NIGHTLY='${{ inputs.openbsd-nightly }}'
        NIGHTLY_DATE="${OPENBSD_NIGHTLY#nightly-}"
        curl -fsI "https://static.rust-lang.org/dist/${NIGHTLY_DATE}/channel-rust-nightly.toml" >/dev/null
        rustup toolchain install --profile minimal "$OPENBSD_NIGHTLY"
        echo "OPENBSD_NIGHTLY=$OPENBSD_NIGHTLY" >> "$GITHUB_ENV"
        echo "NIGHTLY_SYSROOT=$(rustc +$OPENBSD_NIGHTLY --print sysroot)" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache cargo registry
      id: cargo-cache
      if: ${{ inputs.cache-provider == 'github' }}
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Report archive cache decisions
      if: ${{ always() }}
      shell: bash
      env:
        SR_CACHE_PROVIDER: ${{ inputs.cache-provider }}
        SR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        SR_UV_STEP_OUTCOME: ${{ steps.setup-uv.outcome }}
        SR_UV_CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        SR_CARGO_STEP_OUTCOME: ${{ steps.cargo-cache.outcome }}
        SR_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        cache_outcome() {
          local step_outcome="$1"
          local cache_hit="$2"
          case "$step_outcome" in
            success)
              case "$cache_hit" in
                true) printf 'hit' ;;
                false|'') printf 'miss' ;;
                *) printf 'error' ;;
              esac
              ;;
            skipped) printf 'disabled' ;;
            *) printf 'error' ;;
          esac
        }

        if [[ "$SR_CACHE_PROVIDER" == 'external' ]]; then
          cargo_outcome='disabled'
          uv_outcome='disabled'
        else
          cargo_outcome="$(cache_outcome "$SR_CARGO_STEP_OUTCOME" "$SR_CARGO_CACHE_HIT")"
          if [[ "$SR_RUNNER_ENVIRONMENT" == 'github-hosted' ]]; then
            uv_outcome="$(cache_outcome "$SR_UV_STEP_OUTCOME" "$SR_UV_CACHE_HIT")"
          else
            uv_outcome='disabled'
          fi
        fi

        printf '::notice title=setup-rust cache::provider=%s cargo=%s uv=%s\n' \
          "$SR_CACHE_PROVIDER" "$cargo_outcome" "$uv_outcome"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          printf '%s\n' \
            '### setup-rust cache' \
            "- provider: $SR_CACHE_PROVIDER" \
            "- cargo archive: $cargo_outcome" \
            "- uv archive: $uv_outcome" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Select the sccache backend
      # BEFORE the sccache-action steps, deliberately. sccache binds its
      # backend once, when the server starts, and "Start the sccache server"
      # below is what starts it. GITHUB_ENV reaches only the next step, so
      # every export the server must see has to be written in an earlier one.
      # A value exported alongside the server start would be read by nobody:
      # the job would keep a local-disk cache while every log line claimed
      # otherwise.
      #
      # Its counterpart, "Export sccache as the rustc wrapper", sits AFTER
      # those steps for the opposite reason: it needs SCCACHE_PATH, which they
      # produce. The two exports cannot be merged or reordered, and a manifest
      # test holds both positions.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      run: |
        set -euo pipefail
        # Bounded outcome over a closed set, so a job that fell back to local
        # disk is visible in the log rather than only in a slow build.
        report() {
          echo "metric setup-rust.sccache.backend=$1"
        }
        # ${VAR+x} rather than -n: a caller who set the variable to false or
        # to an empty string has made a choice, and macOS runners ship bash
        # 3.2, which cannot parse [[ -v VAR ]].
        if [[ ${SCCACHE_GHA_ENABLED+x} ]]; then
          report caller
          echo "::notice title=setup-rust sccache::SCCACHE_GHA_ENABLED already set; leaving the caller's value in place"
          exit 0
        fi
        # A caller pointing sccache at their own directory wants that disk,
        # not GitHub's cache service; forcing the GHA backend would ignore the
        # storage they mounted.
        if [[ -n "${SCCACHE_DIR:-}" ]]; then
          report local
          echo "::notice title=setup-rust sccache::SCCACHE_DIR is set; leaving sccache on the caller's directory"
          exit 0
        fi
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        report gha
        echo "::notice title=setup-rust sccache::selected the GitHub Actions cache backend"

    - name: Record the caller's cache service selection
      id: cache-service
      # Read BEFORE the sccache-action steps, because they overwrite these.
      # The last thing mozilla-actions/sccache-action does is write
      # ACTIONS_CACHE_SERVICE_V2=on to GITHUB_ENV, along with the runner's own
      # ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN. On a GitHub-hosted
      # runner that is what a caller wants. On Ubicloud the v2 flag overrides
      # the empty value export-ubicloud-cache-credentials published, the proxy
      # serves v1, and every write goes to the wrong endpoint.
      #
      # All three are recorded, not just the one that does harm today. They
      # are the sccache-action's to change, and a version that started
      # exporting a different results URL or token would break the proxy the
      # same way, silently. (#441)
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      run: |
        set -euo pipefail
        # $1 the variable, $2 the output key, $3 non-empty when the value is a
        # credential. Bash 3.2 on macOS runners has no nameref, so the
        # indirect read is eval.
        record() {
          local name="$1" key="$2" secret="$3" value
          # ${VAR+x} rather than -n: clearing the variable, which is exactly
          # what export-ubicloud-cache-credentials does, is a choice, and
          # bash 3.2 cannot parse [[ -v VAR ]].
          if ! eval "[[ \${$name+x} ]]"; then
            echo "${key}_state=unset" >> "$GITHUB_OUTPUT"
            return
          fi
          eval "value=\${$name}"
          # A caller who exported a token without marking it secret would
          # otherwise have it appear here first. Masking is per value, never
          # blanket: masking a flag whose value is "on" would redact that
          # word everywhere in the log.
          if [[ -n "$secret" && -n "$value" ]]; then
            echo "::add-mask::$value"
          fi
          # The delimiter form carries an empty value, which the plain
          # name=value form cannot round-trip.
          {
            echo "${key}_state=set"
            echo "${key}_value<<SETUP_RUST_RECORDED"
            printf '%s\n' "$value"
            echo "SETUP_RUST_RECORDED"
          } >> "$GITHUB_OUTPUT"
        }
        record ACTIONS_CACHE_SERVICE_V2 cache_service ''
        record ACTIONS_RESULTS_URL results_url ''
        record ACTIONS_RUNTIME_TOKEN runtime_token secret

    # x86_64-apple-darwin binaries were dropped after sccache v0.12.0
    - name: Run sccache (x86_64 macOS)
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' && runner.os == 'macOS' && runner.arch == 'X64' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.12.0
    - name: Run sccache
      # Pinned, like its x86_64 macOS sibling. Left unset, the action asks the
      # GitHub API for the latest release on every job: a floating dependency
      # and a network call in the critical path. That call timed out on #440
      # and failed the job with "Unable to locate executable file: undefined",
      # a red check with no step log to explain it.
      #
      # This pin is the action's own. Consumers pinning a prebuilt sccache
      # binary of their own choose independently, and today do not agree:
      # 0.16.0 on Whitaker and Axinite, 0.17.0 on Chutoro and Wildside.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' && !(runner.os == 'macOS' && runner.arch == 'X64') }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - name: Restore the caller's cache service selection
      # AFTER both sccache-action steps and BEFORE anything starts a server,
      # deliberately. Undoes what those steps wrote to GITHUB_ENV, so a caller
      # who cleared ACTIONS_CACHE_SERVICE_V2, as an Ubicloud lane does, keeps
      # their choice. A caller who never set a variable keeps the action's
      # value, which is right on a GitHub-hosted runner.
      #
      # GITHUB_ENV reaches only the next step, so this cannot be merged into
      # the step that starts the server. A manifest test holds the order.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      env:
        CALLER_CACHE_SERVICE_STATE: ${{ steps.cache-service.outputs.cache_service_state }}
        CALLER_CACHE_SERVICE_VALUE: ${{ steps.cache-service.outputs.cache_service_value }}
        CALLER_RESULTS_URL_STATE: ${{ steps.cache-service.outputs.results_url_state }}
        CALLER_RESULTS_URL_VALUE: ${{ steps.cache-service.outputs.results_url_value }}
        CALLER_RUNTIME_TOKEN_STATE: ${{ steps.cache-service.outputs.runtime_token_state }}
        CALLER_RUNTIME_TOKEN_VALUE: ${{ steps.cache-service.outputs.runtime_token_value }}
      run: |
        set -euo pipefail
        # One bounded outcome per variable, over a closed set: a lane whose
        # proxy selection was silently overridden is visible in the log rather
        # than only in a cache that never fills.
        report() {
          echo "metric setup-rust.sccache.$1=$2"
        }
        # $1 the variable, $2 its metric, $3 the recorded state, $4 the
        # recorded value. Bash 3.2 on macOS runners has no nameref, so the
        # indirect read is eval.
        restore() {
          local name="$1" metric="$2" state="$3" recorded="$4"
          local is_set=no current=''
          if [[ "$state" != set ]]; then
            report "$metric" absent
            return
          fi
          if eval "[[ \${$name+x} ]]"; then
            is_set=yes
            eval "current=\${$name}"
          fi
          if [[ "$is_set" == yes && "$current" == "$recorded" ]]; then
            report "$metric" unchanged
            return
          fi
          # The delimiter form carries an empty value, which the plain
          # name=value form cannot round-trip.
          {
            printf '%s<<SETUP_RUST_RESTORED\n' "$name"
            printf '%s\n' "$recorded"
            echo "SETUP_RUST_RESTORED"
          } >> "$GITHUB_ENV"
          report "$metric" restored
          # The variable, never its value: one of the three is a credential.
          echo "::notice title=setup-rust sccache::restored the caller's ${name}, which the sccache steps had overwritten"
        }
        restore ACTIONS_CACHE_SERVICE_V2 cache-service \
          "${CALLER_CACHE_SERVICE_STATE:-unset}" "${CALLER_CACHE_SERVICE_VALUE-}"
        restore ACTIONS_RESULTS_URL results-url \
          "${CALLER_RESULTS_URL_STATE:-unset}" "${CALLER_RESULTS_URL_VALUE-}"
        restore ACTIONS_RUNTIME_TOKEN runtime-token \
          "${CALLER_RUNTIME_TOKEN_STATE:-unset}" "${CALLER_RUNTIME_TOKEN_VALUE-}"
    - name: Export sccache as the rustc wrapper
      id: rustc-wrapper
      # sccache-action installs sccache and exports SCCACHE_PATH, but Cargo
      # only routes compilation through it when RUSTC_WRAPPER names it. Without
      # this the action reports sccache as enabled while every consumer that
      # does not set the wrapper itself compiles without it, which is what
      # Chutoro's zero compile requests showed.
      #
      # AFTER both sccache-action steps, deliberately, since SCCACHE_PATH is
      # their output and does not exist before they run.
      #
      # Its counterpart, "Select the sccache backend", sits BEFORE those steps
      # for the opposite reason: sccache binds its backend at server start,
      # "Start the sccache server" below is what starts it, and GITHUB_ENV
      # reaches only the next step, so that choice has to be made first. The
      # two exports cannot be merged or reordered, and a manifest test holds
      # both positions.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      run: |
        set -euo pipefail
        # One bounded outcome per terminal path, over a closed set, with no
        # path or value in the line so a scraper sees a series it can
        # aggregate.
        report() {
          echo "metric setup-rust.sccache.wrapper=$1"
          # The next step needs to know whether this one exported, and the
          # environment cannot say: an inherited wrapper and one this step
          # wrote look identical from there.
          echo "state=$1" >> "$GITHUB_OUTPUT"
        }
        # A caller wrapping rustc for its own reasons must not be overridden
        # silently. ${VAR+x} rather than -n: an inherited empty value is still
        # a deliberate choice, and macOS runners ship bash 3.2, which cannot
        # parse [[ -v VAR ]].
        if [[ ${RUSTC_WRAPPER+x} ]]; then
          report caller-set
          echo "::notice title=setup-rust sccache::RUSTC_WRAPPER already set; leaving the caller's value in place"
          exit 0
        fi
        if [[ -z "${SCCACHE_PATH:-}" ]]; then
          report missing-sccache-path
          echo "::error title=setup-rust sccache::sccache-action did not export SCCACHE_PATH" >&2
          exit 1
        fi
        echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
        report exported
        echo "::notice title=setup-rust sccache::RUSTC_WRAPPER exported"
    - name: Start the sccache server
      # LAST of the sccache steps, deliberately. sccache reads its cache
      # configuration once, when the server starts, and never rebinds, so the
      # server has to start after every export that could change it: the
      # backend selection, the cache-service restore above, and whatever the
      # caller exported before this action ran.
      #
      # Starting it here rather than leaving it to the first wrapped rustc
      # also makes the binding a step with a name and an outcome, instead of
      # a side effect of a compile that happens to come first.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      env:
        WRAPPER_STATE: ${{ steps.rustc-wrapper.outputs.state }}
      run: |
        set -euo pipefail
        # One bounded outcome per terminal path, over a closed set.
        report() {
          echo "metric setup-rust.sccache.server=$1"
        }
        # Only restart a server this action's own wrapper export owns. An
        # inherited RUSTC_WRAPPER may name this very binary, when a caller ran
        # setup-rust earlier in the job or nested it through
        # rust-build-release, and stopping that server would discard the
        # statistics of everything compiled so far. Checked first, because a
        # caller who owns the wrapper owes this action no SCCACHE_PATH either.
        if [[ "${WRAPPER_STATE:-}" != exported ]]; then
          report caller-set
          exit 0
        fi
        if [[ -z "${SCCACHE_PATH:-}" ]]; then
          report missing-sccache-path
          echo "::error title=setup-rust sccache::sccache-action did not export SCCACHE_PATH" >&2
          exit 1
        fi
        # A server already running holds the backend it bound when it
        # started, which was before the restore above. Stopping it is the
        # only way to rebind; a fresh server also starts with zero counters,
        # so a caller's later --show-stats measures their own build.
        "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
        if ! "$SCCACHE_PATH" --start-server; then
          report start-failed
          echo "::error title=setup-rust sccache::could not start the sccache server" >&2
          exit 1
        fi
        # A server this step started has zero counters already. Zeroing is
        # belt and braces against a --start-server that adopted one, and it
        # costs a baseline rather than the cache, so it warns rather than
        # failing the job.
        if "$SCCACHE_PATH" --zero-stats >/dev/null; then
          report started
        else
          report started-stats-not-zeroed
          echo "::warning title=setup-rust sccache::could not zero sccache statistics; a later --show-stats may include earlier work"
        fi
        echo "::notice title=setup-rust sccache::sccache server started"
    - name: Install system dependencies
      if: ${{ inputs.install-postgres-deps == 'true' && runner.os == 'Linux' }}
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      shell: bash
    - name: Install libpq (headers + import library)
      if: ${{ inputs.install-postgres-deps == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        # Install PostgreSQL 17 but suppress the server service – we only need the client bits
        choco install postgresql17 --no-progress -y --params '/Password:postgres /NoService /SkipStackBuilder'

        # Tell the rest of the job where the headers and import library are
        $pgRoot = "${Env:ProgramFiles}\PostgreSQL\17"
        "PG_INCLUDE=$pgRoot\include" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "PG_LIB=$pgRoot\lib"         | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        echo "$pgRoot\bin"           | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install MSYS2 toolchain and SQLite
      if: ${{ inputs.install-sqlite-deps == 'true' && runner.os == 'Windows' }}
      # v2.32.0
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-sqlite3
    - name: Setup osxcross (macOS SDK + linker)
      if: ${{ inputs.with-darwin == 'true' && runner.os == 'Linux' }}
      uses: mbround18/setup-osxcross@b26146d499c54979ed3d023266865dc188881911
      with:
        osx-version: ${{ inputs.darwin-sdk-version }}
    - name: Install Rust macOS targets
      if: ${{ inputs.with-darwin == 'true' && runner.os == 'Linux' }}
      run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      shell: bash
    - name: Cache OpenBSD stdlib
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' }}
      id: openbsd-stdlib-cache
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.NIGHTLY_SYSROOT }}/lib/rustlib/x86_64-unknown-openbsd
        key: openbsd-stdlib-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
    - name: Clone Rust repo & build OpenBSD std
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' && steps.openbsd-stdlib-cache.outputs.cache-hit != 'true' }}
      run: |
        git clone --depth 1 --single-branch https://github.com/rust-lang/rust.git
        cd rust
        HOST_TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
        ./x.py build --stage 1 --target x86_64-unknown-openbsd library/std
        ARTEFACT_DIR="build/$HOST_TRIPLE/stage1/lib/rustlib/x86_64-unknown-openbsd"
        uv run --script "${{ github.action_path }}/scripts/copy_openbsd_stdlib.py" \
          "$ARTEFACT_DIR" "$NIGHTLY_SYSROOT"
      shell: bash
    - name: Add OpenBSD target
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' }}
      run: rustup target add x86_64-unknown-openbsd --toolchain ${{ env.OPENBSD_NIGHTLY }}
      shell: bash
