name: Upload CodeScene Coverage
description: Upload coverage reports to CodeScene
inputs:
  path:
    description: Coverage file path
    required: false
    default: __auto__
  format:
    description: Coverage format (cobertura or lcov)
    required: false
    default: cobertura
  access-token:
    description: CodeScene project access token
    required: false
    default: ""
  cli-version:
    description: Approved cs-coverage version from cli-manifest.json
    required: false
    default: "1.0.101"
  archive-checksum:
    description: Optional SHA-256 which must equal the manifest archive digest
    required: false
    default: ""
  installer-checksum:
    description: Deprecated; non-empty values are rejected, use archive-checksum
    required: false
    default: ""
  mode:
    description: Install, upload an analysed branch report, or check pull-request coverage
    required: false
    default: upload
  project-url:
    description: CodeScene project API URL; required when mode is check
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate inputs
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PROJECT_URL: ${{ inputs.project-url }}
        INPUT_INSTALLER_CHECKSUM: ${{ inputs.installer-checksum }}
      run: |
        if [ -n "$INPUT_INSTALLER_CHECKSUM" ]; then
          echo "installer-checksum is deprecated; remove it or use archive-checksum" >&2
          exit 1
        fi
        case "$INPUT_FORMAT" in
          cobertura|lcov) ;;
          *) echo "Unsupported format: $INPUT_FORMAT" >&2; exit 1 ;;
        esac
        case "$INPUT_MODE" in
          install|upload) ;;
          check)
            if [ -z "$INPUT_PROJECT_URL" ]; then
              echo "mode: check requires project-url" >&2
              exit 1
            fi
            ;;
          *) echo "Unsupported mode: $INPUT_MODE" >&2; exit 1 ;;
        esac
      shell: bash
    - name: Check coverage gate applicability
      id: gate-applicability
      if: inputs.mode == 'check'
      env:
        BASE_REF: ${{ github.base_ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
          echo "skip=true" >>"$GITHUB_OUTPUT"
          printf '%s\n' "::warning title=CodeScene coverage gate skipped::The changed-line coverage gate needs the pull request base to be an analysed branch. This pull request targets '$BASE_REF', not the repository default branch '$DEFAULT_BRANCH'."
        fi
      shell: bash
    - name: Determine coverage file
      id: cov-file
      if: >-
        inputs.mode != 'install' &&
        steps.gate-applicability.outputs.skip != 'true'
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        file="$INPUT_PATH"
        if [ -z "$file" ] || [ "$file" = "__auto__" ]; then
          if [ "$INPUT_FORMAT" = "lcov" ]; then file="lcov.info"; else file="coverage.xml"; fi
        fi
        echo "path=$file" >>"$GITHUB_OUTPUT"
      shell: bash
    - name: Resolve trusted CodeScene CLI
      id: cli
      if: steps.gate-applicability.outputs.skip != 'true'
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI_VERSION: ${{ inputs.cli-version }}
        ARCHIVE_CHECKSUM: ${{ inputs.archive-checksum }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        emit_metric() {
          printf '%s\n' "$1"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; fi
        }
        if python3 "$ACTION_PATH/scripts/install_cs_coverage.py" resolve \
          --manifest "$ACTION_PATH/cli-manifest.json" \
          --version "$CLI_VERSION" \
          --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
          --archive-checksum "$ARCHIVE_CHECKSUM" \
          --github-output "$GITHUB_OUTPUT"; then
          emit_metric "cs-coverage.resolve=verified"
        else
          status=$?
          emit_metric "cs-coverage.resolve=failed"
          exit "$status"
        fi
      shell: bash
    - name: Upload coverage GitHub artefact
      if: >-
        inputs.mode != 'install' &&
        steps.gate-applicability.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ steps.cov-file.outputs.path }}
    - name: Cache CodeScene Coverage CLI
      id: cs-cache
      if: steps.gate-applicability.outputs.skip != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local/bin/cs-coverage
        key: cs-coverage-${{ steps.cli.outputs.version }}-${{ steps.cli.outputs.platform }}-${{ steps.cli.outputs.digest }}
    - name: Install CodeScene Coverage CLI
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        steps.cs-cache.outputs.cache-hit != 'true'
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI_VERSION: ${{ inputs.cli-version }}
        ARCHIVE_CHECKSUM: ${{ inputs.archive-checksum }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        emit_metric() {
          printf '%s\n' "$1"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; fi
        }
        if python3 "$ACTION_PATH/scripts/install_cs_coverage.py" install \
          --manifest "$ACTION_PATH/cli-manifest.json" \
          --version "$CLI_VERSION" \
          --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
          --archive-checksum "$ARCHIVE_CHECKSUM" \
          --binary "$HOME/.local/bin/cs-coverage"; then
          emit_metric "cs-coverage.download=verified"
          emit_metric "cs-coverage.digest=verified"
          emit_metric "cs-coverage.install=verified"
        else
          status=$?
          emit_metric "cs-coverage.install=failed"
          exit "$status"
        fi
      shell: bash
    - name: Verify CodeScene Coverage CLI
      if: steps.gate-applicability.outputs.skip != 'true'
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI_VERSION: ${{ inputs.cli-version }}
        ARCHIVE_CHECKSUM: ${{ inputs.archive-checksum }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        emit_metric() {
          printf '%s\n' "$1"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; fi
        }
        if python3 "$ACTION_PATH/scripts/install_cs_coverage.py" verify \
          --manifest "$ACTION_PATH/cli-manifest.json" \
          --version "$CLI_VERSION" \
          --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
          --archive-checksum "$ARCHIVE_CHECKSUM" \
          --binary "$HOME/.local/bin/cs-coverage"; then
          emit_metric "cs-coverage.version=verified"
        else
          status=$?
          emit_metric "cs-coverage.version=failed"
          exit "$status"
        fi
      shell: bash
    - name: Add cs-coverage to PATH
      if: steps.gate-applicability.outputs.skip != 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Upload coverage to CodeScene
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        inputs.access-token != '' && inputs.mode == 'upload'
      env:
        COVERAGE_FILE: ${{ steps.cov-file.outputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        CS_ACCESS_TOKEN: ${{ inputs.access-token }}
      run: |
        command -v cs-coverage >/dev/null 2>&1 || { echo "cs-coverage CLI not found" >&2; exit 1; }
        file="$COVERAGE_FILE"
        [ -f "$file" ] || { echo "Coverage file not found: $file" >&2; exit 1; }
        cs-coverage upload --format "$INPUT_FORMAT" --metric "line-coverage" "$file"
      shell: bash
    - name: Check coverage against CodeScene gates
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        inputs.access-token != '' && inputs.mode == 'check'
      env:
        COVERAGE_FILE: ${{ steps.cov-file.outputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        CS_ACCESS_TOKEN: ${{ inputs.access-token }}
        CS_PROJECT_URL: ${{ inputs.project-url }}
      run: |
        command -v cs-coverage >/dev/null 2>&1 || { echo "cs-coverage CLI not found" >&2; exit 1; }
        file="$COVERAGE_FILE"
        [ -f "$file" ] || { echo "Coverage file not found: $file" >&2; exit 1; }
        if [ "$INPUT_FORMAT" = "lcov" ] && [[ "$file" != *.info ]]; then
          echo "cs-coverage check requires LCOV files to end in .info (got: $file)" >&2
          exit 1
        fi
        if cs-coverage check --coverage-files "$file"; then :; else
          status=$?
          if [ "$status" -eq 2 ]; then
            printf '%s\n' "cs-coverage could not evaluate the changed-line gate. The pull request base '${GITHUB_BASE_REF:-unknown}' must have coverage uploaded to CodeScene." >&2
          fi
          exit "$status"
        fi
      shell: bash
