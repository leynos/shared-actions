name: Upload CodeScene Coverage
description: Upload coverage reports to CodeScene
inputs:
  path:
    description: Coverage file path
    required: false
    # sentinel value, replaced based on format if unchanged
    default: __auto__
  format:
    description: Coverage format (cobertura or lcov)
    required: false
    default: cobertura
  access-token:
    description: CodeScene project access token
    required: true
  installer-checksum:
    description: >-
      SHA-256 checksum of the installer script. Leave unset to use the
      digest pinned by this action; set it only to move ahead of that pin.
    required: false
  cli-version:
    description: >-
      cs-coverage CLI build to install. CodeScene publishes the CLI only
      as "latest" and under each build's commit SHA; release numbers such
      as "1.0.103" are not downloadable. Leave unset to use the build
      pinned by this action, which is cached; "latest" floats and skips
      the cache.
    required: false
  mode:
    description: >-
      "upload" sends coverage for an analysed branch (CodeScene accepts
      uploads only for branches the project analyses, typically main);
      "check" runs the pull-request changed-line coverage gate, which
      diffs the PR against its merge base (requires a fetch-depth: 0
      checkout) and needs project-url.
    required: false
    default: upload
  project-url:
    description: >-
      CodeScene project API URL (e.g.
      "https://api.codescene.io/v2/projects/<id>"). Required when mode
      is "check".
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Export env for later steps
      run: |
        printf 'CS_ACCESS_TOKEN=%s\n' "${{ inputs.access-token }}" >>"${GITHUB_ENV}"
        printf 'CODESCENE_CLI_SHA256=%s\n' "${{ inputs.installer-checksum }}" >>"${GITHUB_ENV}"
        if [ -n "${{ inputs.project-url }}" ]; then
          printf 'CS_PROJECT_URL=%s\n' "${{ inputs.project-url }}" >>"${GITHUB_ENV}"
        fi
      shell: bash
    - name: Validate inputs
      run: |
        case "${{ inputs.format }}" in
          cobertura|lcov) ;;
          *)
            echo "Unsupported format: ${{ inputs.format }}" >&2
            exit 1
            ;;
        esac
        case "${{ inputs.mode }}" in
          upload) ;;
          check)
            if [ -z "${{ inputs.project-url }}" ]; then
              echo "mode: check requires project-url" >&2
              exit 1
            fi
            ;;
          *)
            echo "Unsupported mode: ${{ inputs.mode }}" >&2
            exit 1
            ;;
        esac
      shell: bash

    - name: Check coverage gate applicability
      id: gate-applicability
      if: inputs.mode == 'check'
      env:
        BASE_REF: ${{ github.base_ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
          echo "skip=true" >>"$GITHUB_OUTPUT"
          printf '%s\n' \
            "::warning title=CodeScene coverage gate skipped::The changed-line coverage gate needs the pull request base to be an analysed branch. This pull request targets '$BASE_REF', not the repository default branch '$DEFAULT_BRANCH'."
        fi
      shell: bash

    - name: Determine coverage file
      id: cov-file
      if: steps.gate-applicability.outputs.skip != 'true'
      run: |
        file="${{ inputs.path }}"
        if [ -z "$file" ] || [ "$file" = "__auto__" ]; then
          if [ "${{ inputs.format }}" = "lcov" ]; then
            file="lcov.info"
          else
            file="coverage.xml"
          fi
        fi
        echo "path=$file" >> "$GITHUB_OUTPUT"
      shell: bash

    # The installer takes the build to install as its first positional
    # argument and serves that argument straight into the artefact URL.
    # CodeScene publishes only "latest" and per-build commit SHAs there,
    # so PINNED_CLI_VERSION is a build SHA: it names one immutable
    # artefact, where "latest" changes under the whole estate without a
    # commit.
    #
    # Resolving the build is a pure computation on two values and it
    # happens here, on its own, because the cache key names the build.
    # While the download sat in front of the lookup, a failed or altered
    # download stopped a run that had a perfectly good cached binary and
    # would never have used the script.
    - name: Resolve CodeScene CLI build
      id: resolve-cli
      if: steps.gate-applicability.outputs.skip != 'true'
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        PINNED_CLI_VERSION: ce87259e704bde6038d1a6904ce4dbf56359e5ee
      run: |
        version="${CLI_VERSION:-$PINNED_CLI_VERSION}"
        if [ "$version" = "latest" ]; then
          cacheable=false
        else
          cacheable=true
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "cacheable=${cacheable}" >> "$GITHUB_OUTPUT"
      shell: bash

    # Caching a "latest" binary would pin whatever build was cached
    # first, so the cache only participates when a build is pinned. The
    # key is exact and carries no restore-keys: a prefix restore would
    # hand back a different build and silently defeat the pin.
    #
    # The architecture is in the key because the installer picks a
    # different artefact for aarch64 and amd64 and puts both at the same
    # path. GitHub's cache version covers the path and the compression
    # tool, not the CPU, so without this an arm64 Linux runner could
    # restore an x86-64 binary and fail later with an exec-format error
    # rather than here.
    - name: Cache CodeScene Coverage CLI
      id: cs-cache
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        steps.resolve-cli.outputs.cacheable == 'true'
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local/bin/cs-coverage
        key: cs-coverage-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-cli.outputs.version }}

    # PINNED_INSTALLER_SHA256 is the installer script's digest at the
    # pinned build. It is overridable, and an empty override falls back
    # to the pin rather than switching verification off. The download
    # runs only when the cache missed, so a cached binary needs no
    # network at all.
    - name: Download installer
      id: installer
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        steps.cs-cache.outputs.cache-hit != 'true'
      env:
        PINNED_INSTALLER_SHA256: ec9279ce87b523b6e958a8d551283484c391d3de9f5dd2ba2b4f784ecf19b1e4
      run: |
        expected="${CODESCENE_CLI_SHA256:-$PINNED_INSTALLER_SHA256}"
        if [ -z "$expected" ]; then
          echo "No SHA-256 to verify the CodeScene installer against" >&2
          exit 1
        fi
        # macOS images ship `shasum` and not `sha256sum`, so the tool is
        # chosen rather than assumed. Both read the same "digest  path"
        # line on standard input.
        if command -v sha256sum >/dev/null 2>&1; then
          set -- sha256sum -c -
        elif command -v shasum >/dev/null 2>&1; then
          set -- shasum -a 256 -c -
        else
          echo "Neither sha256sum nor shasum is available to verify the CodeScene installer" >&2
          exit 1
        fi
        script=$(mktemp)
        curl -fsSL -o "$script" https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh
        if ! printf '%s  %s\n' "${expected}" "$script" | "$@"; then
          printf '%s\n' \
            "The CodeScene installer script does not match SHA-256 ${expected}. CodeScene publishes no versioned installer, so the script changes in place; review the new script, then update the pin in this action or pass installer-checksum." >&2
          exit 1
        fi
        echo "script=$script" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Upload coverage GitHub artefact
      if: steps.gate-applicability.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ steps.cov-file.outputs.path }}

    - name: Install CodeScene Coverage CLI
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        env.CS_ACCESS_TOKEN != '' &&
        steps.cs-cache.outputs.cache-hit != 'true'
      env:
        CLI_VERSION: ${{ steps.resolve-cli.outputs.version }}
      run: |
        script="${{ steps.installer.outputs.script }}"
        bash "$script" -y "${CLI_VERSION}"
        rm "$script"
      shell: bash

    - name: Add cs-coverage to PATH
      if: steps.gate-applicability.outputs.skip != 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Upload coverage to CodeScene
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        env.CS_ACCESS_TOKEN != '' && inputs.mode == 'upload'
      run: |
        command -v cs-coverage >/dev/null 2>&1 || { echo "cs-coverage CLI not found" >&2; exit 1; }
        file="${{ steps.cov-file.outputs.path }}"
        if [ ! -f "$file" ]; then
          echo "Coverage file not found!" >&2
          echo "  Expected file: $file" >&2
          echo "  Current working directory: $(pwd)" >&2
          echo "  Expected format: ${{ inputs.format }}" >&2
          exit 1
        fi
        cs-coverage upload \
          --format "${{ inputs.format }}" \
          --metric "line-coverage" \
          "$file"
      shell: bash

    # `cs-coverage check` infers the report format from the file
    # extension and requires LCOV files to end in ".info".
    - name: Check coverage against CodeScene gates
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        env.CS_ACCESS_TOKEN != '' && inputs.mode == 'check'
      run: |
        command -v cs-coverage >/dev/null 2>&1 || { echo "cs-coverage CLI not found" >&2; exit 1; }
        file="${{ steps.cov-file.outputs.path }}"
        if [ ! -f "$file" ]; then
          echo "Coverage file not found!" >&2
          echo "  Expected file: $file" >&2
          echo "  Current working directory: $(pwd)" >&2
          exit 1
        fi
        if [ "${{ inputs.format }}" = "lcov" ]; then
          case "$file" in
            *.info) ;;
            *)
              echo "cs-coverage check requires LCOV files to end in .info (got: $file)" >&2
              exit 1
              ;;
          esac
        fi
        if cs-coverage check --verbose --coverage-files "$file"; then
          :
        else
          status=$?
          if [ "$status" -eq 2 ]; then
            printf '%s\n' \
              "cs-coverage could not evaluate the changed-line gate. The pull request base '${GITHUB_BASE_REF:-unknown}' must have coverage uploaded to CodeScene." >&2
          fi
          exit "$status"
        fi
      shell: bash
