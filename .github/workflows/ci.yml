name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    env:
      MERMAN_CLI_VERSION: '0.7.0'
      WHITAKER_INSTALLER_VERSION: '0.2.6'
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/scripts/*.py
      - name: Install nfpm
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-nfpm
      - name: Setup Bun
        if: matrix.os == 'ubuntu-latest'
        # v2.0.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Setup Bun (macOS)
        if: matrix.os == 'macos-15'
        # v2.0.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install action-validator
        run: bun install -g @action-validator/core @action-validator/cli
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: make check-fmt
        shell: bash
      - name: Enforce en-GB-oxendict spelling
        if: matrix.os == 'ubuntu-latest'
        run: make spelling
        shell: bash
      - name: Markdown lint
        if: matrix.os == 'ubuntu-latest'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
            !**/.uv-cache/**
            !**/.uv-tools/**
      - name: Set up isolated Rust for Merman
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install 1.95.0 --profile minimal
        shell: bash
      - name: Cache Merman CLI
        if: matrix.os == 'ubuntu-latest'
        id: cache-merman-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/merman-cli
          key: merman-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.MERMAN_CLI_VERSION }}
      - name: Install Merman CLI
        if: matrix.os == 'ubuntu-latest' && steps.cache-merman-cli.outputs.cache-hit != 'true'
        run: cargo +1.95.0 install merman-cli --version "=${MERMAN_CLI_VERSION}" --locked
        shell: bash
      - name: Install Nixie
        if: matrix.os == 'ubuntu-latest'
        run: uv tool install --python 3.14 nixie-cli==1.1.0
        shell: bash
      - name: Validate Mermaid diagrams
        if: matrix.os == 'ubuntu-latest'
        run: make nixie
        shell: bash
      - name: Setup Rust
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/setup-rust
      - name: Install Whitaker
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-whitaker
        with:
          installer-version: ${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Run lint checks
        if: matrix.os == 'ubuntu-latest'
        run: make lint
        shell: bash
      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil
        shell: bash
      - name: Run tests
        run: |
          uv sync --group dev
          uv run pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash

  coverage:
    name: coverage
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so `cs-coverage check` can reach the pull request's
          # merge base.
          fetch-depth: 0
          # This job runs third-party tooling (uv, nfpm, the Rust toolchain)
          # and never pushes back to the repository, so drop the checkout
          # credential rather than persisting GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/scripts/*.py
      # Mirror the python-tests ubuntu leg so the same tests execute (rather
      # than skip) under coverage, giving a representative baseline. nfpm
      # unblocks the linux-packages tests; setup-rust unblocks the
      # rust-build-release tests (their autouse fixture skips the whole
      # directory when rustup is absent). Whitaker, Bun, and action-validator
      # are lint/validation tooling that no collected test needs, so they are
      # omitted here.
      - name: Install nfpm
        uses: ./.github/actions/install-nfpm
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil
        shell: bash
      # Build and cache the project like the python-tests job does. Several
      # tests shell out to `uv run --script`, which builds shared-actions into
      # the script environment; without a warm build cache that emits `Using
      # CPython` / `Installed N packages` on stderr, which those tests assert
      # to be empty (setup-rust test_validate_workspaces).
      - name: Sync project dependencies
        run: uv sync --group dev
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
      # Coverage runs on pull requests via the shared generate-coverage
      # action. Pushes to main upload their own coverage and advance the
      # ratchet baseline via coverage-main.yml; ci.yml never runs on main, so
      # there is no duplicate generation for a given commit.
      - name: Generate coverage
        uses: ./.github/actions/generate-coverage
        with:
          output-path: coverage.xml
          # Python project: detect.py classifies this repo as Python because
          # there is no root Cargo.toml (rust-toy-app is a test fixture, not a
          # coverage target). cobertura is mandatory — the shared action
          # rejects lcov for non-Rust projects.
          format: cobertura
          # No-op for a Python-detected project (the Rust coverage leg never
          # runs); kept explicit per the first-run checklist.
          use-cargo-nextest: 'false'
          # ci.yml runs the suite serially (`uv run pytest`); keep the
          # coverage run serial too for deterministic coverage and a stable
          # ratchet baseline. Follow-up 4 can adopt pytest-xdist (`make test`
          # already runs `-n auto`) once determinism under slipcover is
          # confirmed.
          pytest-workers: ''
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'pull_request' && env.CS_ACCESS_TOKEN != ''
        uses: ./.github/actions/upload-codescene-coverage
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/72004
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  python-tests-windows:
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/scripts/*.py
      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil
        shell: bash
      - name: Run tests
        run: |
          uv sync --group dev
          uv run pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
