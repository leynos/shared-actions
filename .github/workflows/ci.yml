name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    env:
      MERMAN_CLI_VERSION: '0.7.0'
      WHITAKER_INSTALLER_VERSION: '0.2.6'
    strategy:
      fail-fast: false
      matrix:
        os:
          - >-
              ${{ github.event.pull_request.head.repo.fork
                 && 'ubuntu-latest' || 'ubicloud-standard-2' }}
          - macos-15
    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/scripts/*.py
      - name: Install nfpm
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-nfpm
      - name: Setup Bun
        if: runner.os == 'Linux'
        # v2.0.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Setup Bun (macOS)
        if: runner.os == 'macOS'
        # v2.0.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install action-validator
        run: bun install -g @action-validator/core @action-validator/cli
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-mdtablefix
        with:
          version: "0.6.0"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: make check-fmt
        shell: bash
      - name: Enforce en-GB-oxendict spelling
        if: runner.os == 'Linux'
        run: make spelling
        shell: bash
      - name: Markdown lint
        if: runner.os == 'Linux'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      # From a pinned, digest-verified release archive, like every other tool
      # here. This replaced a `cargo install` that ran on every pull request:
      # its actions/cache entry saved and then never restored, so the build was
      # not occasional but constant, and at 5m 42s it was the largest single
      # step in the repository's slowest job. See issue #483 for the log
      # extracts. The isolated Rust 1.95.0 toolchain went with it, because it
      # existed only to build this one tool; the `setup-rust` step below is
      # what the rest of the job uses.
      - name: Install Merman CLI
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-tool
        with:
          tool: merman-cli
          version: ${{ env.MERMAN_CLI_VERSION }}
      - name: Install Nixie
        if: runner.os == 'Linux'
        run: uv tool install --python 3.14 nixie-cli==1.1.0
        shell: bash
      - name: Validate Mermaid diagrams
        if: runner.os == 'Linux'
        run: make nixie
        shell: bash
      - name: Setup Rust
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-rust
      - name: Install Whitaker
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-whitaker
        with:
          installer-version: ${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Run lint checks
        if: runner.os == 'Linux'
        run: make lint
        shell: bash
      - name: Run tests
        # Not on Linux. The coverage job below runs this same suite under
        # the coverage action on the same trigger, and its own comment says
        # it installs nfpm and Rust so that the same tests execute there
        # rather than skip. Running them twice cost 5 minutes 14 seconds a
        # pull request and told us nothing the coverage run did not.
        if: runner.os == 'macOS'
        run: |
          uv sync --group dev
          uv run pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash

  coverage:
    name: coverage
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
         && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so `cs-coverage check` can reach the pull request's
          # merge base.
          fetch-depth: 0
          # This job runs third-party tooling (uv, nfpm, the Rust toolchain)
          # and never pushes back to the repository, so drop the checkout
          # credential rather than persisting GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/scripts/*.py
      # Mirror the python-tests ubuntu leg so the same tests execute (rather
      # than skip) under coverage, giving a representative baseline. nfpm
      # unblocks the linux-packages tests; setup-rust unblocks the
      # rust-build-release tests (their autouse fixture skips the whole
      # directory when rustup is absent). Whitaker, Bun, and action-validator
      # are lint/validation tooling that no collected test needs, so they are
      # omitted here.
      - name: Install nfpm
        uses: ./.github/actions/install-nfpm
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      # Build and cache the project like the python-tests job does. Several
      # tests shell out to `uv run --script`, which builds shared-actions into
      # the script environment; without a warm build cache that emits `Using
      # CPython` / `Installed N packages` on stderr, which those tests assert
      # to be empty (setup-rust test_validate_workspaces).
      - name: Sync project dependencies
        run: uv sync --group dev
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
      # Coverage runs on pull requests via the shared generate-coverage
      # action. Pushes to main upload their own coverage and advance the
      # ratchet baseline via coverage-main.yml; ci.yml never runs on main, so
      # there is no duplicate generation for a given commit.
      - name: Generate coverage
        uses: ./.github/actions/generate-coverage
        with:
          output-path: coverage.xml
          # Python project: detect.py classifies this repo as Python because
          # there is no root Cargo.toml (rust-toy-app is a test fixture, not a
          # coverage target). cobertura is mandatory — the shared action
          # rejects lcov for non-Rust projects.
          format: cobertura
          # No-op for a Python-detected project (the Rust coverage leg never
          # runs); kept explicit per the first-run checklist.
          use-cargo-nextest: 'false'
          # ci.yml runs the suite serially (`uv run pytest`); keep the
          # coverage run serial too for deterministic coverage and a stable
          # ratchet baseline. Follow-up 4 can adopt pytest-xdist (`make test`
          # already runs `-n auto`) once determinism under slipcover is
          # confirmed.
          pytest-workers: ''
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'pull_request' && env.CS_ACCESS_TOKEN != ''
        uses: ./.github/actions/upload-codescene-coverage
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/72004
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  python-tests-windows:
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/scripts/*.py
      - name: Run tests
        run: |
          uv sync --group dev
          uv run pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
