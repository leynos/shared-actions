name: df12 duplication gate
description: >
  Provision the pinned df12-python-lints package into an isolated uv tool
  environment, install the nose detector it pins (the package verifies the
  release archive's SHA-256 against its own digest table), and run
  `df12-duplication check` over a repository.
inputs:
  python-lints-sha:
    description: >
      Full 40-digit commit of leynos/df12-python-lints to install. The default
      is the commit the estate runs; a branch, tag or short SHA is refused.
    required: false
    default: 1d6c3bba594651823c9ba8e8b40265cae59a1c52
  repository:
    description: Directory holding the pyproject.toml with `[tool.nose]`.
    required: false
    default: .
  python-version:
    description: Interpreter for the tool environment.
    required: false
    default: '3.14'
outputs:
  exit-status:
    description: >
      Exit status of `df12-duplication check`: 0 clean, 1 blocking families, 2
      invalid configuration or failed analysis. A failed `install` is also 2.
    value: ${{ steps.check.outputs.exit-status }}
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: false

    - name: Prune restored uv cache
      # A calling workflow's own setup-uv may have restored a cache into the
      # directory this step inherits; remove interpreter-bound entries before
      # the first uv invocation.
      shell: bash
      run: bash "${{ github.action_path }}/../../scripts/prune_uv_cache.sh"

    - name: Run df12-duplication install and check
      id: check
      shell: bash
      env:
        DF12_SHA: ${{ inputs.python-lints-sha }}
        DF12_REPOSITORY: ${{ inputs.repository }}
        DF12_PYTHON: ${{ inputs.python-version }}
      run: |
        set -euo pipefail

        emit_metric() {
          echo "metric $1"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '%s\n' "metric $1" >> "$GITHUB_STEP_SUMMARY"
          fi
        }

        fail() {
          emit_metric "df12-duplication.result=$2"
          echo "::error title=df12-duplication::$1" >&2
          echo "exit-status=2" >> "${GITHUB_OUTPUT:-/dev/null}"
          exit 2
        }

        [[ "$DF12_SHA" =~ ^[0-9a-f]{40}$ ]] ||
          fail "python-lints-sha must be a full 40-digit lowercase commit" invalid-input
        [[ "$DF12_PYTHON" =~ ^3\.[0-9]+$ ]] ||
          fail "python-version must look like 3.14" invalid-input
        [[ -n "$DF12_REPOSITORY" && -d "$DF12_REPOSITORY" ]] ||
          fail "repository must be an existing directory" invalid-input
        command -v uv >/dev/null 2>&1 ||
          fail "uv is required on PATH" missing-prerequisite

        spec="df12-python-lints[duplication] @ git+https://github.com/leynos/df12-python-lints.git@${DF12_SHA}"

        # The binary is never cached between runs: `install` downloads the
        # pinned release archive and checks its SHA-256 every time, so no
        # restored file can stand in for a verified one.
        uv tool run --python "$DF12_PYTHON" --from "$spec" -- \
          df12-duplication install --repository "$DF12_REPOSITORY" ||
          fail "df12-duplication install failed" install-failed

        status=0
        uv tool run --python "$DF12_PYTHON" --from "$spec" -- \
          df12-duplication check --repository "$DF12_REPOSITORY" || status=$?

        echo "exit-status=${status}" >> "${GITHUB_OUTPUT:-/dev/null}"
        case "$status" in
          0) emit_metric "df12-duplication.result=clean" ;;
          1) emit_metric "df12-duplication.result=blocking" ;;
          *) emit_metric "df12-duplication.result=invalid" ;;
        esac
        exit "$status"
