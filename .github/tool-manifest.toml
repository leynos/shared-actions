# Tool manifest for the `install-tool` action.
#
# One entry per tool, version and target triple. `install-tool` installs only
# what is listed here, at the version a caller names; there is no floating
# version and no lookup of a "latest" release, because that is a network call
# in the critical path and a dependency that changes underneath you.
#
# Every digest below was computed from an independent download of the archive
# it describes, which is the trust anchor. Where upstream publishes a `.sha256`
# sidecar it was fetched and compared, and `sidecar = "match"` records that it
# agreed. `sidecar = "absent"` means upstream publishes none, so the pin has no
# second opinion behind it; see issue #450 for which projects those are.
#
# `url` is recorded rather than derived from the triple, because asset naming
# does not follow it: sccache ships musl archives for every Linux target and
# cargo-nextest ships one universal archive for both Apple targets.
#
# `member` is where the binary sits inside the archive. Some upstreams put it
# at the root and others under a single directory, so the manifest says which
# rather than the installer guessing at `--strip-components`.
#
# `version-args` is how the installed binary is asked for its version, which is
# not `--version` for all of them: cargo-llvm-cov and cargo-dylint are cargo
# subcommands and want their subcommand name first. An empty list means the
# tool cannot be asked at all. Every one of these was found by running the
# binary, not by assuming.
#
# To add or bump a tool: download every archive, compute its SHA-256, compare
# against the sidecar where one exists, and record the result. Never copy a
# digest out of a sidecar without downloading the archive, because that records
# only that the sidecar agrees with itself.

schema = 1


# rustsec publishes no .sha256 sidecars and no aggregate checksums
