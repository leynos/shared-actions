name: Test export-ubicloud-cache-credentials

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exports-the-credentials:
    # The runner's own ACTIONS_CACHE_URL names a public GitHub endpoint, which
    # the action refuses by design. Job-level environment variables are
    # inherited by a composite action's steps, so these stand in for what an
    # Ubicloud runner would expose.
    runs-on: ubuntu-latest
    env:
      ACTIONS_CACHE_URL: http://10.1.2.3:51123/e3b0c44298fc1c14/
      ACTIONS_RUNTIME_TOKEN: workflow-runtime-token
      ACTIONS_CACHE_SERVICE_V2: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export cache credentials
        uses: ./.github/actions/export-ubicloud-cache-credentials

      - name: Verify a later shell step sees them
        shell: bash
        env:
          EXPECTED_CACHE_URL: http://10.1.2.3:51123/e3b0c44298fc1c14/
          EXPECTED_RUNTIME_TOKEN: workflow-runtime-token
        run: |
          set -euo pipefail
          # The point of the action: a run: step cannot read these from the
          # runner, only from GITHUB_ENV.
          if [[ "${ACTIONS_CACHE_URL:-}" != "$EXPECTED_CACHE_URL" ]]; then
            echo "::error::ACTIONS_CACHE_URL did not reach this step" >&2
            exit 1
          fi
          if [[ "${ACTIONS_RUNTIME_TOKEN:-}" != "$EXPECTED_RUNTIME_TOKEN" ]]; then
            echo "::error::ACTIONS_RUNTIME_TOKEN did not reach this step" >&2
            exit 1
          fi
          if [[ -n "${ACTIONS_CACHE_SERVICE_V2:-}" ]]; then
            echo "::error::ACTIONS_CACHE_SERVICE_V2 was not cleared" >&2
            exit 1
          fi
          echo "credentials reached a later shell step"

  refuses-a-public-host:
    runs-on: ubuntu-latest
    env:
      ACTIONS_CACHE_URL: https://acghubeus1.actions.githubusercontent.com/abc/
      ACTIONS_RUNTIME_TOKEN: workflow-runtime-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export cache credentials
        id: export
        continue-on-error: true
        uses: ./.github/actions/export-ubicloud-cache-credentials

      - name: Verify the step failed closed
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXPORT_OUTCOME" != failure ]]; then
            echo "::error::a public cache host was accepted" >&2
            exit 1
          fi
          if [[ -n "${ACTIONS_CACHE_SERVICE_V2:-}" ]]; then
            echo "::error::the action exported a value before failing" >&2
            exit 1
          fi
          echo "public host refused"

  refuses-a-missing-cache-url:
    runs-on: ubuntu-latest
    env:
      ACTIONS_CACHE_URL: ""
      ACTIONS_RUNTIME_TOKEN: workflow-runtime-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export cache credentials
        id: export
        continue-on-error: true
        uses: ./.github/actions/export-ubicloud-cache-credentials

      - name: Verify the step failed closed
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXPORT_OUTCOME" != failure ]]; then
            echo "::error::a missing cache URL was accepted" >&2
            exit 1
          fi
          echo "missing cache URL refused"
