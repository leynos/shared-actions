[project]
name = "shared-actions"
version = "1.2.2"
description = "Shared GitHub Actions for coverage and testing workflows"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "ISC"}
authors = [
    {name = "Payton McIntosh", email = "pmcintosh@df12.net"},
]
keywords = ["github-actions", "coverage", "testing"]
dependencies = [
    "httpx>=0.28,<0.29",
    "tenacity>=8.2,<10.0",
    "plumbum>=1.8,<3.0",
    "typer>=0.9,<1.0",
    "lxml>=5.2,<7.0",
    "cyclopts>=3.24,<5.0",
    "syspath-hack>=0.4.0,<0.5.0",
    "jinja2>=3.1,<4.0",
    # Pin Polythene to the requested commit for Linux package validation tooling.
    "polythene@git+https://github.com/leynos/polythene.git@61b4566130305fcb32f419f09ae8b3940ceb4107",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pytest>=8.0,<10.0",
    "pyyaml>=6.0,<7.0",
    "ty>=0.0.1a20",
    "uuid6>=2025.0.1",
    "cmd-mox==0.2.0",
    "hypothesis>=6,<7",
    "pytest-bdd>=8.0,<9.0",
    "pathspec==1.1.1",
    "syrupy>=4,<6",
]

[tool.ruff]
line-length = 88
# The standalone spelling helper follows the shared Weaver-approved baseline
# and is checked by the isolated, version-pinned spelling-helper-test target.
exclude = [
    "episodic-work",
    "scripts/typos_rollout_check.py",
    "scripts/tests/test_typos_rollout_check.py",
]

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "C4",
    "FA",
    "ISC",
    "ICN",
    "RET",
    "SIM",
    "TID",
    "TC",
    "PTH",
    "TD",
    "A",
    "BLE",
    "S",
    "DTZ",
    "FBT",
    "N",
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "EM",
    "D",
    "ANN",
]
per-file-ignores = {"**/test_*.py" = ["S101"]}
ignore = ["D205", "E402"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
    "msgspec.json",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
msgspec = "ms"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess.run".msg = "Use `plumbum` instead of `subprocess.run`"
"subprocess.check_call".msg = "Use `plumbum` instead of `subprocess.check_call`"
"subprocess.check_output".msg = "Use `plumbum` instead of `subprocess.check_output`"
"subprocess.check_returncode".msg = "Use `plumbum` instead of `subprocess.check_returncode`"

[tool.ruff.lint.pydocstyle]
# Enforce NumPy docstring style
convention = "numpy"

[tool.mutmut]
# Mutate only the reusable-workflow helper scripts. The .github/actions
# scripts are excluded: mutmut's sandbox does not copy .github/, their
# tests are co-located with the action sources, and several rely on
# GITHUB_ACTION_PATH discovery and subprocess execution that mutmut's
# in-process attribution cannot see.
source_paths = ["workflow_scripts/"]
# Select only the in-process unit tests; the act-gated workflow tests
# under tests/workflows (ACT_WORKFLOW_TESTS) must stay out of mutmut's
# selection.
pytest_add_cli_args_test_selection = ["workflow_scripts/tests/"]
do_not_mutate = ["workflow_scripts/tests/*"]
# The root conftest.py makes workflow_scripts importable from the
# sandbox and registers the cmd-mox plugin; pytest.ini keeps the pytest
# configuration identical inside mutants/.
also_copy = ["conftest.py", "pytest.ini"]

[tool.pytest.ini_options]
# Ensure asyncio fixtures create a new event loop for each test
asyncio_default_fixture_loop_scope = "function"
# Tests automatically killed after seconds elapsed
timeout = 30

[tool.setuptools]
py-modules = [
    "cmd_utils",
    "cmd_utils_importer",
]

[tool.uv]
package = true

[tool.skylos.gate]
strict = true

[tool.skylos.whitelist]
names = [
    "JsonValue",
    "_CargoProcCtx",
    "_assert_cargo_streams",
    "_build_cargo_env",
    "_finalize_pump_threads",
    "_handle_cargo_output_event",
    "_kill_cargo_process",
    "_poll_pump_loop_iteration",
    "_pump_cargo_output",
    "_pump_cargo_output_posix",
    "_pump_cargo_output_windows",
    "_raise_cargo_timeout",
    "_run_cargo",
    "_spawn_cargo",
    "_wait_for_cargo",
    "emit",
    "fail",
    "get_line_coverage_percent_from_cobertura",
    "lines_from_detail",
    "request_graphql",
    "with_env",
]

[tool.skylos.whitelist.documented]
"JsonValue" = "Workflow scripts need the direct-script import path when package-relative imports are unavailable."
"_CargoProcCtx" = "run_rust imports the cargo runner's process context through its action-local module path."
"_assert_cargo_streams" = "The action-local _run_cargo entry point calls this cargo stream guard."
"_build_cargo_env" = "The action-local _run_cargo entry point builds its subprocess environment with this helper."
"_finalize_pump_threads" = "The Windows cargo-output pump calls this helper after joining its threads."
"_handle_cargo_output_event" = "The POSIX cargo-output pump dispatches selector events through this helper."
"_kill_cargo_process" = "The POSIX cargo-output pump uses this helper to clean up failing processes."
"_poll_pump_loop_iteration" = "The Windows cargo-output pump uses this helper while its reader threads run."
"_pump_cargo_output" = "The action-local _run_cargo entry point dispatches output handling through this helper."
"_pump_cargo_output_posix" = "The platform dispatcher invokes this helper on POSIX runners."
"_pump_cargo_output_windows" = "The platform dispatcher invokes this helper on Windows runners."
"_raise_cargo_timeout" = "Cargo process and output-pump timeout paths invoke this helper."
"_run_cargo" = "run_rust imports the action-local cargo runner entry point."
"_spawn_cargo" = "The action-local _run_cargo entry point creates cargo processes with this helper."
"_wait_for_cargo" = "The action-local _run_cargo entry point waits for cargo through this helper."
"emit" = "Workflow scripts select package-relative or direct-script output imports at runtime."
"fail" = "Workflow scripts select package-relative or direct-script failure imports at runtime."
"get_line_coverage_percent_from_cobertura" = "run_python imports this parser from its action-local sibling module."
"lines_from_detail" = "The Cobertura parser calls this nested line-counter helper."
"request_graphql" = "The Dependabot script selects package-relative or direct-script GraphQL imports at runtime."
"with_env" = "The cross-build command wrapper delegates environment binding through this method."

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
