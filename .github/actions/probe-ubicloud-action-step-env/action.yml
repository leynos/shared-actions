name: Probe Ubicloud action-step environment
description: >
  Reports, from inside a composite action's `run:` step, which cache variables
  the runner presents and which backend an sccache server started there binds.
  Test scaffolding for `test-ubicloud-sccache-proxy.yml`, not a public action:
  it exists so that one position in a job can be observed from inside an action
  rather than only from the workflow. Callers have no use for it.
inputs:
  position:
    description: Label for the position being measured
    required: true
  start-server:
    description: Start an sccache server from this position
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Report the environment a composite action step sees
      shell: bash
      env:
        POSITION: ${{ inputs.position }}
        START_SERVER: ${{ inputs.start-server }}
      run: |
        set -euo pipefail
        "${GITHUB_WORKSPACE}/.github/scripts/report-cache-env.sh" "$POSITION"
        if [[ "$START_SERVER" == 'true' ]]; then
          "${GITHUB_WORKSPACE}/.github/scripts/start-and-report-sccache.sh" "$POSITION"
        fi
