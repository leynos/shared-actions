name: Install Nixie
description: Install pinned Nixie and version-checked Merman CLI releases for Mermaid validation
inputs:
  nixie-version:
    description: Nixie CLI version to install
    required: false
    default: "1.1.0"
  merman-version:
    description: Merman CLI version to install
    required: false
    default: "0.7.0"
  python-version:
    description: Python version used by uv to install Nixie
    required: false
    default: "3.14"
runs:
  using: composite
  steps:
    - name: Prune restored uv cache
      shell: bash
      run: bash "${{ github.action_path }}/../../scripts/prune_uv_cache.sh"
    - name: Check cargo-binstall availability
      id: check-cargo-binstall
      shell: bash
      run: |
        if cargo binstall -V >/dev/null 2>&1; then
          echo "installed=true" >> "${GITHUB_OUTPUT}"
        else
          echo "installed=false" >> "${GITHUB_OUTPUT}"
        fi
    - name: Install cargo-binstall
      if: steps.check-cargo-binstall.outputs.installed != 'true'
      uses: cargo-bins/cargo-binstall@8f137732cada3c067cb574fe3537fedfe2a6451d
      with:
        version: "1.22.0"
    - name: Install Nixie and Merman CLI
      id: install-nixie-merman
      shell: bash
      env:
        NIXIE_VERSION: ${{ inputs.nixie-version }}
        MERMAN_VERSION: ${{ inputs.merman-version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        # Resolving the Merman release asset costs one `api.github.com` call,
        # and unauthenticated calls are rate-limited per source address. The
        # hosted macOS runners share addresses widely enough to receive
        # `403 Forbidden`, after which cargo-binstall retries until it times
        # out. The job token lifts the limit to a per-repository budget, and a
        # job without one falls back to unauthenticated requests as before.
        # It is kept under its own name because the variable is assigned on
        # the `cargo binstall` command rather than exported from this step:
        # the Merman version probe runs the unsigned executable, which must
        # not inherit a credential. The fragment captures this value, clears
        # it and inherited token aliases, and re-supplies it only for the one
        # `cargo binstall` call.
        MERMAN_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Not named `GITHUB_TOKEN` in the step environment: the cached and
        # freshly installed Merman binary and Nixie are all started from this
        # fragment, and none of them should inherit a credential. The value
        # is captured, removed along with inherited token aliases, and
        # re-supplied for the one command that needs it.
        github_token="${MERMAN_GITHUB_TOKEN:-}"
        unset MERMAN_GITHUB_TOKEN GITHUB_TOKEN GH_TOKEN
        binstall_with_token() {
          # The release lookup may present the job token when the caller
          # supplies one. The assignment prefix scopes the value to this one
          # command, so the Merman version probe and Nixie never see it.
          if [[ -n "$github_token" ]]; then
            GITHUB_TOKEN="$github_token" cargo binstall "$@"
          else
            # Do not let cargo-binstall recover credentials from runner-local
            # Git or GitHub CLI configuration when this action has no token.
            cargo binstall --no-discover-github-token "$@"
          fi
        }

        input_error() {
          echo "::error title=Install Nixie input::$1" >&2
          exit 1
        }

        if [[ ! "$MERMAN_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          input_error "merman-version must use three numeric components without leading zeroes"
        fi
        if [[ ! "$NIXIE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          input_error "nixie-version must use three numeric components"
        fi
        if [[ ! "$PYTHON_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
          input_error "python-version must use two or three numeric components"
        fi
        if ! command -v uv >/dev/null 2>&1; then
          echo "::error::uv is required to install nixie-cli" >&2
          exit 1
        fi
        if ! command -v cargo >/dev/null 2>&1; then
          echo "::error::cargo is required to run cargo-binstall for merman-cli" >&2
          exit 1
        fi

        case "${RUNNER_OS:-}/${RUNNER_ARCH:-}" in
          Linux/X64)
            merman_target="x86_64-unknown-linux-gnu"
            merman_executable="merman-cli"
            nixie_executable="nixie"
            ;;
          macOS/ARM64)
            merman_target="aarch64-apple-darwin"
            merman_executable="merman-cli"
            nixie_executable="nixie"
            ;;
          macOS/X64)
            merman_target="x86_64-apple-darwin"
            merman_executable="merman-cli"
            nixie_executable="nixie"
            ;;
          Windows/X64)
            merman_target="x86_64-pc-windows-msvc"
            merman_executable="merman-cli.exe"
            nixie_executable="nixie.exe"
            ;;
          *)
            echo "::error title=Unsupported Merman platform::no Merman binary target is configured for ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}" >&2
            exit 1
            ;;
        esac

        merman_bin_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/merman/${MERMAN_VERSION}/bin"
        merman_path="${merman_bin_dir}/${merman_executable}"
        merman_version_is_usable() {
          local reported_version
          [[ -x "$merman_path" ]] || return 1
          reported_version="$("$merman_path" --version 2>/dev/null)" || return 1
          [[ "${reported_version##* }" == "$MERMAN_VERSION" ]]
        }

        if ! merman_version_is_usable; then
          if [[ -e "$merman_path" ]]; then
            echo "::notice title=Merman cache refresh::cached merman-cli is unusable or does not report version ${MERMAN_VERSION}"
            rm -rf -- "$merman_path"
          fi
          mkdir -p -- "$merman_bin_dir"
          if binstall_with_token \
            --no-confirm \
            --disable-strategies=compile \
            --targets "$merman_target" \
            --install-path "$merman_bin_dir" \
            --version "=${MERMAN_VERSION}" \
            merman-cli; then
            :
          else
            binstall_status=$?
            echo "::error title=Merman binary installation failed::cargo-binstall could not install merman-cli ${MERMAN_VERSION} for ${RUNNER_OS}/${RUNNER_ARCH} (${merman_target}); no compatible prebuilt binary release may be available" >&2
            exit "$binstall_status"
          fi
          if [[ ! -x "$merman_path" ]]; then
            echo "::error title=Merman installation failed::cargo-binstall did not create a usable executable at ${merman_path}; the requested binary release may be unavailable" >&2
            exit 1
          fi
          if ! merman_version_is_usable; then
            echo "::error title=Merman version mismatch::installed merman-cli did not report requested version ${MERMAN_VERSION}" >&2
            exit 1
          fi
        fi

        uv tool install --python "${PYTHON_VERSION}" "nixie-cli==${NIXIE_VERSION}"
        uv_bin_dir="$(uv tool dir --bin)" || exit $?
        nixie_bin_dir="$uv_bin_dir"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          nixie_bin_dir="$(cygpath --unix "$uv_bin_dir")"
        fi
        nixie_path="${nixie_bin_dir}/${nixie_executable}"
        if [[ ! -x "$nixie_path" ]]; then
          echo "::notice title=Nixie shim repair::reinstalling nixie-cli because ${nixie_path} is absent"
          uv tool install --force --python "${PYTHON_VERSION}" "nixie-cli==${NIXIE_VERSION}"
        fi
        if [[ ! -x "$nixie_path" ]]; then
          echo "::error title=Nixie installation failed::nixie was not installed at ${nixie_path}" >&2
          exit 1
        fi

        merman_github_path="${merman_bin_dir}"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          merman_github_path="$(cygpath --windows "$merman_bin_dir")"
        fi
        printf '%s\n' "${merman_github_path}" >> "${GITHUB_PATH}"
        printf '%s\n' "${uv_bin_dir}" >> "${GITHUB_PATH}"
