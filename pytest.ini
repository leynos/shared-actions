[pytest]
# `tests/workflows` is named as a directory, not as a list of files. Naming
# files meant a contract module added later was collected by nothing and
# passed the gate without ever running; `test_main_owned_coverage.py` was
# added that way and went unrun. The act-dependent modules in the directory
# skip themselves unless ACT_WORKFLOW_TESTS is set, so the whole directory is
# safe to collect by default.
testpaths =
    .github/actions
    workflow_scripts/tests
    tests/workflows
