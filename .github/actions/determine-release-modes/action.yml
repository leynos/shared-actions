name: Determine Release Modes
description: Normalize GitHub Actions event payloads into release workflow decision flags

inputs:
  dry-run:
    description: Override dry-run mode (auto-detected from event when not set)
    required: false
    default: ""
  publish:
    description: Override publish flag (auto-detected from event when not set)
    required: false
    default: ""

outputs:
  dry-run:
    description: '"true" or "false" indicating dry-run mode'
    value: ${{ steps.determine.outputs.dry_run }}
  should-publish:
    description: '"true" or "false" indicating whether to publish to a release'
    value: ${{ steps.determine.outputs.should_publish }}
  should-upload-workflow-artifacts:
    description: '"true" or "false" indicating whether to upload workflow artefacts'
    value: ${{ steps.determine.outputs.should_upload_workflow_artifacts }}

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: false

    - name: Prune restored uv cache
      # This action saves no cache, but a calling workflow's own setup-uv may
      # have restored one into the directory this step inherits. The script
      # runs through `uv run`, so an `environments-v2` entry bound to another
      # runner's interpreter must go before the first invocation.
      shell: bash
      run: |
        set -euo pipefail
        uv cache prune

    - name: Determine release modes
      id: determine
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_PUBLISH: ${{ inputs.publish }}
      run: |
        set -euo pipefail
        uv run "${{ github.action_path }}/scripts/determine_release_modes.py"
