name: Test Dependabot auto-merge

on:
  pull_request:
    # A library-only change cannot affect this lane; see
    # tests/workflows/test_cv005_contracts_lane.py.
    paths-ignore:
      - 'packages/cv005-contracts/**'

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      id-token: write
    uses: ./.github/workflows/dependabot-automerge.yml
    with:
      required-label: dependencies
      merge-method: squash
      dry-run: true
    secrets:
      # Dummy token for dry-run testing only; not used in API calls
      github-token: test-token
