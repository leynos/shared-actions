name: Ratchet coverage
description: Run cargo llvm-cov and fail if coverage decreases
inputs:
  baseline-file:
    description: Path to store the coverage baseline
    required: false
    default: .coverage-baseline
  args:
    description: Additional arguments passed to cargo llvm-cov
    required: false
    default: ''
outputs:
  percent:
    description: Coverage percentage reported by cargo llvm-cov
    value: ${{ steps.cov.outputs.percent }}
runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        uv-version: ">=0.7.19,<0.8.0"
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
          **/scripts/*.py
    - name: Restore baseline
      id: restore-baseline
      # The restore sub-action, not the full `actions/cache` action: the full
      # action also registers a post-job save on its primary key, which the
      # "Save baseline" step below already writes.
      # v6.1.0
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ inputs.baseline-file }}
        key: ratchet-baseline-${{ runner.os }}-${{ github.run_id }}
        restore-keys: ratchet-baseline-${{ runner.os }}-
    - name: Cache cargo artefacts
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/bin/cargo-llvm-cov
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-llvmcov-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-llvmcov-
    - name: Install cargo-llvm-cov
      run: uv run --script "${{ github.action_path }}/scripts/install_cargo_llvm_cov.py"
      shell: bash
    - if: runner.os == 'Windows'
      name: Install bc (MSYS2)
      uses: msys2/setup-msys2@v2
      with:
        install: bc
        path-type: inherit
    - name: Run coverage
      id: cov
      run: uv run --script "${{ github.action_path }}/scripts/run_coverage.py" --args "${{ inputs.args }}"
      shell: bash
    - name: Ratchet coverage
      run: |
        uv run --script "${{ github.action_path }}/scripts/ratchet_coverage.py" \
          --baseline-file "${{ inputs.baseline-file }}" \
          --current "${{ steps.cov.outputs.percent }}"
      shell: bash
    - name: Save baseline
      # Save under the same run-id-suffixed key the restore step uses as its
      # primary key. GitHub Actions cache entries are immutable, so the former
      # constant key could only ever be written once and then froze the
      # baseline until eviction. A per-run key is unique, so every run persists
      # a fresh baseline that later runs recover through the
      # `ratchet-baseline-${{ runner.os }}-` restore-key prefix, newest match
      # first.
      if: success()
      # The save sub-action pairs with the restore sub-action above, so exactly
      # one step writes this key.
      # v6.1.0
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ inputs.baseline-file }}
        key: ratchet-baseline-${{ runner.os }}-${{ github.run_id }}
