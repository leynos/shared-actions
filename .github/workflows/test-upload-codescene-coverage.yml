name: Test Upload CodeScene Coverage

# The half of the uploader's contract that contacts nothing. A cold runner
# installs the pinned CLI through the action's `install` mode, the resolved
# version is asserted offline, and the installer's refusals are driven
# directly. None of it holds CS_ACCESS_TOKEN or reaches codescene.io, so it
# runs on every pull request that touches the uploader.
#
# The service-touching half lives in test-codescene-parser-proof.yml, which
# is dispatch and main only. This file does not name the service, its
# credential or its gate subcommand anywhere, comments included, so the
# uploader's own test can scan it as raw text and be stricter than the
# workflow contract needs to be.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-runner-contract:
    # A fork's pull request cannot reach the repository's own action tree in
    # the shape this proof needs, and dependabot's branches change no part of
    # it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    # The lane skips a fork's pull request rather than falling back,
    # because it reads CS_ACCESS_TOKEN and a fork cannot. It therefore
    # names the Ubicloud label outright: no arm of it ever runs on a
    # fork's runner.
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm the runner has no preinstalled CodeScene CLI
        shell: bash
        run: |
          if command -v cs-coverage >/dev/null 2>&1; then
            echo 'cs-coverage was unexpectedly preinstalled on this runner' >&2
            exit 1
          fi
      - name: Install pinned CodeScene CLI without a preinstalled dependency
        uses: ./.github/actions/upload-codescene-coverage
        with:
          mode: install
          cli-version: "1.0.101"
      - name: Verify the resolved version offline
        shell: bash
        run: |
          set -euo pipefail
          # CS_DISABLE_VERSION_CHECK stops the client polling for a newer
          # release, so this reads the installed binary and nothing else. No
          # token is set, and none is needed.
          CS_DISABLE_VERSION_CHECK=1 cs-coverage version | tee /tmp/cs-coverage-version.log
          grep -F 'cs-coverage version 1.0.101 (ca2b95180eff32b5072e81f20d718d7b747650be)' /tmp/cs-coverage-version.log
      - name: Confirm the Slipcover fixtures the parser proof reads are present
        shell: bash
        run: |
          set -euo pipefail
          # The parser proof itself is dispatch-only because it calls the
          # service. What a pull request can still catch is a fixture deleted
          # or renamed out from under it, which would otherwise make that
          # proof pass over an empty loop.
          shopt -s nullglob
          fixtures=(.github/actions/upload-codescene-coverage/tests/fixtures/slipcover-*-cobertura.xml)
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo 'no Slipcover cobertura fixtures remain for the parser proof' >&2
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$fixture"
          done
      - name: Reject unpinned version and checksum conflict
        shell: bash
        run: |
          set -euo pipefail
          script=.github/actions/upload-codescene-coverage/scripts/install_cs_coverage.py
          manifest=.github/actions/upload-codescene-coverage/cli-manifest.json
          if python3 "$script" resolve --manifest "$manifest" --version latest --runner-os Linux --runner-arch X64; then exit 1; fi
          if python3 "$script" resolve --manifest "$manifest" --version 1.0.101 --runner-os Linux --runner-arch X64 --archive-checksum "$(printf '0%.0s' {1..64})"; then exit 1; fi
