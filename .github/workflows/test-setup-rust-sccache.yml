name: Test setup-rust sccache wrapper

on:
  pull_request:
  # A push to main is the one run that saves the sccache directory
  # setup-rust owns, so the next run of exports-the-wrapper starts warm.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exports-the-wrapper:
    # Unlike the cache credentials, this one is provable on a hosted runner:
    # sccache-action really installs sccache and exports SCCACHE_PATH, and the
    # export step really writes GITHUB_ENV, so a later shell step can see the
    # result. That end-to-end path is what the unit tests cannot show.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          install-binstall: 'false'
          use-sccache: 'true'

      - name: Verify a later step compiles through sccache
        shell: bash
        env:
          CACHE_BACKEND: ${{ steps.setup.outputs.cache-backend }}
        run: |
          set -euo pipefail
          # The runner-aware selection, read on a real GitHub-hosted runner:
          # left to the action, it is local disk, cached by the action.
          if [[ "$CACHE_BACKEND" != local ]]; then
            echo "::error::a GitHub-hosted runner selected ${CACHE_BACKEND:-nothing}" >&2
            exit 1
          fi
          if [[ -z "${RUSTC_WRAPPER:-}" ]]; then
            echo "::error::RUSTC_WRAPPER did not reach this step" >&2
            exit 1
          fi
          if [[ ! -x "$RUSTC_WRAPPER" ]]; then
            echo "::error::RUSTC_WRAPPER is not an executable: $RUSTC_WRAPPER" >&2
            exit 1
          fi
          # Before anything compiles, and after the wrapper checks so a
          # missing wrapper reports as one: a directory restored from main
          # must serve hits to the same crate on the same path.
          .github/scripts/assert-sccache-warm-hit.sh \
            "$RUSTC_WRAPPER" rust-toy-app/Cargo.toml
          # Asserts a cacheable compilation actually reached the backend, not
          # merely that requests were counted. See the script for why a
          # hello-world binary proves neither.
          .github/scripts/assert-sccache-cached-a-build.sh "$RUSTC_WRAPPER" "Local disk"

  respects_a_caller_backend_choice:
    # A caller who turned the backend off must stay off, so the action cannot
    # quietly re-enable a cache they declined.
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          install-binstall: 'false'
          use-sccache: 'true'

      - name: Verify the caller's choice survived
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SCCACHE_GHA_ENABLED:-}" != false ]]; then
            echo "::error::the action overrode SCCACHE_GHA_ENABLED=false" >&2
            exit 1
          fi
          location="$("$RUSTC_WRAPPER" --show-stats | awk -F'  +' '/Cache location/ {print $2; exit}')"
          if [[ "$location" == *ghac* ]]; then
            echo "::error::the GitHub Actions backend was used against the caller's wishes" >&2
            exit 1
          fi
          echo "the caller's backend choice was left in place"

  respects_a_caller_wrapper:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: /usr/bin/env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          install-binstall: 'false'
          use-sccache: 'true'

      - name: Verify the caller's wrapper survived
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUSTC_WRAPPER:-}" != /usr/bin/env ]]; then
            echo "::error::the action replaced the caller's RUSTC_WRAPPER" >&2
            exit 1
          fi
          echo "the caller's wrapper was left in place"

  restores_a_caller_cache_service_choice:
    # The failure this proves against is silent and expensive: a caller who
    # cleared ACTIONS_CACHE_SERVICE_V2, as an Ubicloud lane does, had it set
    # back to `on` by mozilla-actions/sccache-action writing GITHUB_ENV, and
    # every cache write then went to the wrong service.
    #
    # The proxy path itself is not provable on a hosted runner; that is covered
    # by the manifest ordering tests and by the measurement recorded in #441.
    # What is provable here is the part that broke: whether the caller's value
    # survives the action. SCCACHE_GHA_ENABLED is off so the assertion is about
    # the variable alone, not about reaching any cache service.
    runs-on: ubuntu-latest
    env:
      ACTIONS_CACHE_SERVICE_V2: ''
      SCCACHE_GHA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          install-binstall: 'false'
          use-sccache: 'true'

      - name: Verify the caller's cache service choice survived
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z ${ACTIONS_CACHE_SERVICE_V2+x} ]]; then
            echo "::error::ACTIONS_CACHE_SERVICE_V2 was unset entirely" >&2
            exit 1
          fi
          if [[ -n "${ACTIONS_CACHE_SERVICE_V2}" ]]; then
            echo "::error::the sccache steps' value survived: ${ACTIONS_CACHE_SERVICE_V2}" >&2
            exit 1
          fi
          echo "the caller's cleared cache service selection was restored"

  refuses_a_missing_ubicloud_proxy:
    # expect-cache: ubicloud on a runner with no proxy must fail, and fail
    # before exporting anything. Only a real GitHub-hosted runner can put a
    # real public cache URL in front of the check; the Node tests cover the
    # rest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust expecting Ubicloud
        id: setup
        continue-on-error: true
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          install-binstall: 'false'
          use-sccache: 'true'
          expect-cache: ubicloud

      - name: Verify the step failed closed
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SETUP_OUTCOME" != failure ]]; then
            echo "::error::expect-cache: ubicloud passed on a GitHub-hosted runner" >&2
            exit 1
          fi
          if [[ -n "${ACTIONS_CACHE_SERVICE_V2+set}" ]]; then
            echo "::error::the selection exported credentials before failing" >&2
            exit 1
          fi
          echo "a missing Ubicloud proxy failed the job, as it must"
