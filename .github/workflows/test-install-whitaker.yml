name: Test install-whitaker

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WHITAKER_TEST_INSTALLER_VERSION: 0.2.7

jobs:
  install-whitaker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Whitaker
        uses: ./.github/actions/install-whitaker
        with:
          cargo-home: ${{ runner.temp }}/whitaker-test-cargo
          installer-version: ${{ env.WHITAKER_TEST_INSTALLER_VERSION }}

      - name: Verify installation contract
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${RUNNER_TEMP}/whitaker-test-cargo"
          test -x "${cargo_home}/bin/whitaker-installer"
          echo "whitaker_test_installer_path=${cargo_home}/bin/whitaker-installer"
          echo "whitaker_test_installation=complete"

  install-whitaker-windows:
    # The zip arm's only real exercise. Windows is the one platform whose
    # release asset is a zip, and issue #446 was invisible to every other leg
    # and to the unit tests: the extract step's `shell: bash` is Git Bash,
    # whose PATH puts MSYS2's GNU tar ahead of the Windows system tar, so a
    # probe for "what is tar" chose a tool that cannot read a zip. Nothing
    # short of a real `windows-latest` runner reproduces that PATH.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record which tar wins PATH
        # Evidence rather than assertion. If a future image reorders PATH so
        # that the system bsdtar wins, this leg would still pass while no
        # longer testing what it was added to test, and the log is what says
        # which of those happened.
        shell: bash
        run: |
          set -euo pipefail
          echo "tar resolves to: $(command -v tar)"
          tar --version | head -n 1
          if [ -x /c/Windows/System32/tar.exe ]; then
            echo "system tar present: $(/c/Windows/System32/tar.exe --version | head -n 1)"
          else
            echo "system tar absent"
          fi

      - name: Resolve a POSIX cargo home
        id: paths
        # `runner.temp` is a native path on Windows, and the action requires an
        # absolute POSIX path or a `~/` prefix, so the other legs'
        # `${{ runner.temp }}/...` cannot be reused verbatim here.
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="$(cygpath -u "$RUNNER_TEMP")/whitaker-test-cargo"
          printf 'cargo-home=%s\n' "$cargo_home" >> "$GITHUB_OUTPUT"

      - name: Install Whitaker
        uses: ./.github/actions/install-whitaker
        with:
          cargo-home: ${{ steps.paths.outputs['cargo-home'] }}
          installer-version: ${{ env.WHITAKER_TEST_INSTALLER_VERSION }}

      - name: Verify installation contract
        shell: bash
        env:
          CARGO_HOME_UNDER_TEST: ${{ steps.paths.outputs['cargo-home'] }}
        run: |
          set -euo pipefail
          test -x "${CARGO_HOME_UNDER_TEST}/bin/whitaker-installer.exe"
          echo "whitaker_test_installer_path=${CARGO_HOME_UNDER_TEST}/bin/whitaker-installer.exe"
          echo "whitaker_test_installation=complete"

  install-whitaker-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare failing installer
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${RUNNER_TEMP}/whitaker-test-failure-cargo"
          mkdir -p "${cargo_home}/bin"
          cat > "${cargo_home}/bin/whitaker-installer" <<'INSTALLER'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "whitaker-installer failed while installing the Dylint suite" >&2
          exit 33
          INSTALLER
          chmod +x "${cargo_home}/bin/whitaker-installer"
          # Mark the fixture as the requested version so the action reuses it
          # instead of replacing a seemingly stale installer.
          printf '%s\n' "${WHITAKER_TEST_INSTALLER_VERSION}" \
            > "${cargo_home}/bin/.whitaker-installer-version"

      - name: Install Whitaker
        id: install-whitaker
        continue-on-error: true
        uses: ./.github/actions/install-whitaker
        with:
          cargo-home: ${{ runner.temp }}/whitaker-test-failure-cargo
          installer-version: ${{ env.WHITAKER_TEST_INSTALLER_VERSION }}

      - name: Verify failure propagation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.install-whitaker.outcome }}" = failure
          echo "whitaker_test_failure_propagated=true"
