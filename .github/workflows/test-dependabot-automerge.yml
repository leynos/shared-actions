name: Test Dependabot auto-merge

on:
  pull_request:
    # A library-only change cannot affect this lane; see
    # tests/workflows/test_cv005_contracts_lane.py.
    paths-ignore:
      - 'packages/cv005-contracts/**'

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      id-token: write
    uses: ./.github/workflows/dependabot-automerge.yml
    with:
      required-label: dependencies
      merge-method: squash
      dry-run: true
    secrets:
      # Dummy token for dry-run testing only; not used in API calls
      github-token: test-token
