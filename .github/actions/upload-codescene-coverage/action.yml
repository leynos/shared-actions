name: Upload CodeScene Coverage
description: Upload coverage reports to CodeScene
inputs:
  path:
    description: Coverage file path
    required: false
    default: __auto__
  format:
    description: Coverage format (cobertura or lcov)
    required: false
    default: cobertura
  access-token:
    description: CodeScene project access token
    required: true
  cli-version:
    description: Approved cs-coverage version from cli-manifest.json
    required: false
    default: "1.0.101"
  archive-checksum:
    description: Optional SHA-256 which must equal the manifest archive digest
    required: false
    default: ""
  mode:
    description: Install, upload an analysed branch report, or check pull-request coverage
    required: false
    default: upload
  project-url:
    description: CodeScene project API URL; required when mode is check
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Export env for later steps
      run: |
        printf 'CS_ACCESS_TOKEN=%s\n' "${{ inputs.access-token }}" >>"${GITHUB_ENV}"
        if [ -n "${{ inputs.project-url }}" ]; then
          printf 'CS_PROJECT_URL=%s\n' "${{ inputs.project-url }}" >>"${GITHUB_ENV}"
        fi
      shell: bash
    - name: Validate inputs
      run: |
        case "${{ inputs.format }}" in
          cobertura|lcov) ;;
          *) echo "Unsupported format: ${{ inputs.format }}" >&2; exit 1 ;;
        esac
        case "${{ inputs.mode }}" in
          install|upload) ;;
          check)
            if [ -z "${{ inputs.project-url }}" ]; then
              echo "mode: check requires project-url" >&2
              exit 1
            fi
            ;;
          *) echo "Unsupported mode: ${{ inputs.mode }}" >&2; exit 1 ;;
        esac
      shell: bash
    - name: Check coverage gate applicability
      id: gate-applicability
      if: inputs.mode == 'check'
      env:
        BASE_REF: ${{ github.base_ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
          echo "skip=true" >>"$GITHUB_OUTPUT"
          printf '%s\n' "::warning title=CodeScene coverage gate skipped::The changed-line coverage gate needs the pull request base to be an analysed branch. This pull request targets '$BASE_REF', not the repository default branch '$DEFAULT_BRANCH'."
        fi
      shell: bash
    - name: Determine coverage file
      id: cov-file
      if: steps.gate-applicability.outputs.skip != 'true'
      run: |
        file="${{ inputs.path }}"
        if [ -z "$file" ] || [ "$file" = "__auto__" ]; then
          if [ "${{ inputs.format }}" = "lcov" ]; then file="lcov.info"; else file="coverage.xml"; fi
        fi
        echo "path=$file" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Resolve trusted CodeScene CLI
      id: cli
      if: steps.gate-applicability.outputs.skip != 'true'
      run: |
        python3 "${{ github.action_path }}/scripts/install_cs_coverage.py" resolve \
          --manifest "${{ github.action_path }}/cli-manifest.json" \
          --version "${{ inputs.cli-version }}" \
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}" \
          --archive-checksum "${{ inputs.archive-checksum }}" \
          --github-output "$GITHUB_OUTPUT"
      shell: bash
    - name: Upload coverage GitHub artefact
      if: steps.gate-applicability.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ steps.cov-file.outputs.path }}
    - name: Cache CodeScene Coverage CLI
      id: cs-cache
      if: steps.gate-applicability.outputs.skip != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local/bin/cs-coverage
        key: cs-coverage-${{ steps.cli.outputs.version }}-${{ steps.cli.outputs.platform }}-${{ steps.cli.outputs.digest }}
    - name: Install CodeScene Coverage CLI
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        steps.cs-cache.outputs.cache-hit != 'true'
      run: |
        python3 "${{ github.action_path }}/scripts/install_cs_coverage.py" install \
          --manifest "${{ github.action_path }}/cli-manifest.json" \
          --version "${{ inputs.cli-version }}" \
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}" \
          --archive-checksum "${{ inputs.archive-checksum }}" \
          --binary "$HOME/.local/bin/cs-coverage"
      shell: bash
    - name: Verify CodeScene Coverage CLI
      if: steps.gate-applicability.outputs.skip != 'true'
      run: |
        python3 "${{ github.action_path }}/scripts/install_cs_coverage.py" verify \
          --manifest "${{ github.action_path }}/cli-manifest.json" \
          --version "${{ inputs.cli-version }}" \
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}" \
          --archive-checksum "${{ inputs.archive-checksum }}" \
          --binary "$HOME/.local/bin/cs-coverage"
      shell: bash
    - name: Add cs-coverage to PATH
      if: steps.gate-applicability.outputs.skip != 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Upload coverage to CodeScene
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        env.CS_ACCESS_TOKEN != '' && inputs.mode == 'upload'
      run: |
        command -v cs-coverage >/dev/null 2>&1 || { echo "cs-coverage CLI not found" >&2; exit 1; }
        file="${{ steps.cov-file.outputs.path }}"
        [ -f "$file" ] || { echo "Coverage file not found: $file" >&2; exit 1; }
        cs-coverage upload --format "${{ inputs.format }}" --metric "line-coverage" "$file"
      shell: bash
    - name: Check coverage against CodeScene gates
      if: >-
        steps.gate-applicability.outputs.skip != 'true' &&
        env.CS_ACCESS_TOKEN != '' && inputs.mode == 'check'
      run: |
        command -v cs-coverage >/dev/null 2>&1 || { echo "cs-coverage CLI not found" >&2; exit 1; }
        file="${{ steps.cov-file.outputs.path }}"
        [ -f "$file" ] || { echo "Coverage file not found: $file" >&2; exit 1; }
        if [ "${{ inputs.format }}" = "lcov" ] && [[ "$file" != *.info ]]; then
          echo "cs-coverage check requires LCOV files to end in .info (got: $file)" >&2
          exit 1
        fi
        if cs-coverage check --verbose --coverage-files "$file"; then :; else
          status=$?
          if [ "$status" -eq 2 ]; then
            printf '%s\n' "cs-coverage could not evaluate the changed-line gate. The pull request base '${GITHUB_BASE_REF:-unknown}' must have coverage uploaded to CodeScene." >&2
          fi
          exit "$status"
        fi
      shell: bash
