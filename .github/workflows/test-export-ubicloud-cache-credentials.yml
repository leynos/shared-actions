name: Test export-ubicloud-cache-credentials

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# What this workflow can and cannot prove.
#
# The runner supplies its own ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN to
# every action step and overrides any workflow-level values of the same names,
# so the success path cannot be simulated here: a job that sets a private URL
# still sees GitHub's public one inside the action. That is the very property
# the action exists to work with, and it is covered by the Node tests, which
# run the shipped script directly.
#
# What a GitHub-hosted runner can prove, and nothing else can, is that the
# guard fires against a real runner's real cache endpoint. If the private-host
# check ever regressed, this job would start passing the action, and the
# runtime token would be exported on a runner this action must refuse.
jobs:
  refuses-a-github-hosted-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export cache credentials
        id: export
        continue-on-error: true
        uses: ./.github/actions/export-ubicloud-cache-credentials

      - name: Verify the step failed closed
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXPORT_OUTCOME" != failure ]]; then
            echo "::error::the action accepted a GitHub-hosted cache endpoint" >&2
            exit 1
          fi
          # A failure before any export leaves this unset. Were the action to
          # export and then fail, the value would be present and empty.
          if [[ -n "${ACTIONS_CACHE_SERVICE_V2+set}" ]]; then
            echo "::error::the action exported a value before failing" >&2
            exit 1
          fi
          echo "a GitHub-hosted runner was refused, as it must be"
