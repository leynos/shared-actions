name: Setup Rust
description: Install Rust and cache cargo registry
inputs:
  toolchain:
    description: >
      Rust toolchain to install (e.g., 'stable', 'nightly', '1.70.0').
      Accepts any valid Rust toolchain identifier as supported by rustup.
    required: false
  install-postgres-deps:
    description: Install PostgreSQL system dependencies
    required: false
    default: "false"
  install-sqlite-deps:
    description: Install SQLite development libraries on Windows
    required: false
    default: "false"
  use-sccache:
    description: Enable sccache for non-release runs
    required: false
    default: "true"
  cache-provider:
    description: >
      Cache owner for Cargo and uv state. Use "github" for the action's
      built-in GitHub caches or "external" when the caller mounts one cache
      owner, such as a Namespace cache volume.
    required: false
    default: "github"
  save-cache:
    description: >
      Whether this job writes the cargo archive cache, as opposed to only
      reading it. Each resolved cache key must have exactly one owner:
      when two jobs write the same key, one reserves it and the other is
      refused, and the entry can end up written but not readable. The key
      is "<runner os>-cargo-<hash of rust-toolchain.toml and Cargo.lock>",
      so jobs on different runner operating systems resolve different keys
      and each of those keys needs its own owner. Set this to "false" in
      every job but the one owning the key that job resolves. Reading is
      unaffected either way, so a reader still gets a warm registry.
    required: false
    default: "true"
  install-binstall:
    description: Install cargo-binstall for faster binary crate installations
    required: false
    default: "true"
  with-darwin:
    description: Install macOS cross build toolchain
    required: false
    default: 'false'
  darwin-sdk-version:
    description: macOS SDK version for osxcross
    required: false
    default: '12.3'
  with-openbsd:
    description: Build OpenBSD std library for cross-compilation
    required: false
    default: 'false'
  openbsd-nightly:
    description: Nightly toolchain version for OpenBSD build
    required: false
    default: 'nightly-2025-07-20'
  export-rustc-wrapper:
    description: >
      Whether to export RUSTC_WRAPPER (naming sccache) to the rest of the job.
      "true", the default, routes every later cargo invocation through sccache.
      Set it to "false" for a job that must not inherit the wrapper: a root
      lane run through `sudo -E` (root's rustc cannot write through the
      runner-owned server) or nested cargo builds such as trybuild fixtures
      (each compile is a miss that is also stored). The server still starts and
      SCCACHE_PATH stays exported, so the caller scopes the wrapper to the
      commands that should use it, for example
      `RUSTC_WRAPPER="$SCCACHE_PATH" cargo build`. Read only when use-sccache is
      "true"; a RUSTC_WRAPPER the caller already set is never overridden either
      way.
    required: false
    default: 'true'
  rustflags:
    description: >
      Value exported as the RUSTFLAGS environment variable by the toolchain
      setup step. Set to the empty string to leave RUSTFLAGS unset, so an
      inherited value or the project's Cargo configuration
      (build.rustflags in .cargo/config.toml) applies. A pre-existing
      RUSTFLAGS environment variable always takes precedence over this
      input. The value must be a single line.
    required: false
    default: '-D warnings'
  sccache-cache-discriminator:
    description: >
      Distinguishes this job's sccache directory cache from other jobs on
      the same OS, architecture and compiler, such as matrix entries that
      build different features. Defaults to the job id. Used only on a
      GitHub-hosted runner where setup-rust owns the sccache cache.
    required: false
    default: ''
  expect-cache:
    description: >
      The sccache backend this job requires: "ubicloud", "github" or "any".
      With "any", the default, the action selects the backend the runner
      offers and never fails for want of one. A job that runs only on
      Ubicloud sets "ubicloud", so a missing cache proxy fails the job
      instead of falling back. Applies only when sccache is in use.
    required: false
    default: any
  install-mold:
    description: >
      Install the pinned mold linker on a Linux runner, verified against the
      action's SHA-256 table and put on PATH as mold and ld.mold. A no-op with
      a notice on macOS and Windows, so a matrix can pass it unconditionally.
      Sets no linker flag: select mold in the project's Cargo configuration.
    required: false
    default: 'false'
  mold-version:
    description: >
      mold release to install when install-mold is "true". Only versions
      whose digests the action records are accepted.
    required: false
    default: '2.41.0'
  install-clang-lld:
    description: >
      Install clang and lld on a Linux runner via apt, then verify clang and
      ld.lld land on PATH. A no-op with a notice on macOS and Windows, so a
      matrix can pass it unconditionally. Sets no linker flag: select clang
      and lld through the project's Cargo configuration, or
      CARGO_TARGET_<triple>_LINKER and RUSTFLAGS.
    required: false
    default: 'false'
outputs:
  cache-backend:
    description: >
      The sccache backend selected: "ubicloud", "github" or "local". Empty
      when sccache is not in use (use-sccache is not "true", or the event is
      a release).
    value: ${{ steps.sccache-backend.outputs.cache-backend }}
  sccache-status:
    description: >
      "started" when the action started the sccache server, "fallback" when
      the server would not start and the job compiles without the compiler
      cache. Empty when the action did not start a server (use-sccache is not
      "true", the event is a release, or the caller owns the wrapper).
    value: ${{ steps.sccache-server.outputs.status }}
  sccache-path:
    description: >
      Absolute path of the sccache binary the action installed, for a caller
      that scopes RUSTC_WRAPPER itself (export-rustc-wrapper: "false"). Set only
      once the server has started, so it is empty when the server fell back to
      an uncached build (a caller wrapping with it then would restart a dead
      server), when sccache is not in use, and when the caller owns the wrapper.
    value: ${{ steps.sccache-server.outputs.path }}
  mold-status:
    description: >
      "installed", "cached" or "skipped" (install-mold on a runner other than
      Linux). Empty when install-mold is not "true".
    value: ${{ steps.mold.outputs.status || steps.mold-skip.outputs.status }}
  mold-version:
    description: >
      The mold version now on PATH. Empty when mold was skipped or not
      requested.
    value: ${{ steps.mold.outputs.version }}
  clang-lld-status:
    description: >
      "installed" or "skipped" (install-clang-lld on a runner other than
      Linux). Empty when install-clang-lld is not "true".
    value: ${{ steps.clang-lld.outputs.status || steps.clang-lld-skip.outputs.status }}
runs:
  using: composite
  steps:
    - name: Validate rustflags
      # The nested toolchain action writes this value to GITHUB_ENV as a plain
      # "RUSTFLAGS=<value>" line, so a line break in it would start a further
      # environment-file entry and set variables the caller never asked for.
      # Reject line breaks here rather than forwarding them. The value itself
      # is never echoed.
      shell: bash
      env:
        SR_RUSTFLAGS: ${{ inputs.rustflags }}
      run: |
        set -euo pipefail
        case "$SR_RUSTFLAGS" in
          *$'\n'*|*$'\r'*)
            echo "::error::rustflags must not contain line breaks" >&2
            exit 1
            ;;
        esac
    - name: Validate cache provider
      shell: bash
      env:
        SR_CACHE_PROVIDER: ${{ inputs.cache-provider }}
      run: |
        set -euo pipefail
        case "$SR_CACHE_PROVIDER" in
          github|external) ;;
          *)
            echo "::error::cache-provider must be github or external" >&2
            exit 1
            ;;
        esac
    - name: Validate expect-cache
      shell: bash
      env:
        SR_EXPECT_CACHE: ${{ inputs.expect-cache }}
      run: |
        set -euo pipefail
        case "$SR_EXPECT_CACHE" in
          ubicloud|github|any) ;;
          *)
            echo "::error::expect-cache must be ubicloud, github or any" >&2
            exit 1
            ;;
        esac
    - name: Validate install-mold
      shell: bash
      env:
        SR_INSTALL_MOLD: ${{ inputs.install-mold }}
      run: |
        set -euo pipefail
        case "$SR_INSTALL_MOLD" in
          true|false) ;;
          *)
            echo "::error::install-mold must be true or false" >&2
            exit 1
            ;;
        esac
    - name: Validate install-clang-lld
      shell: bash
      env:
        SR_INSTALL_CLANG_LLD: ${{ inputs.install-clang-lld }}
      run: |
        set -euo pipefail
        case "$SR_INSTALL_CLANG_LLD" in
          true|false) ;;
          *)
            echo "::error::install-clang-lld must be true or false" >&2
            exit 1
            ;;
        esac
    - name: Validate cache ownership
      shell: bash
      env:
        SR_SAVE_CACHE: ${{ inputs.save-cache }}
      run: |
        set -euo pipefail
        # Refused rather than guessed at. Reading a typo as "not false" would
        # silently make a second writer of a key that must have one owner,
        # which is the defect this input exists to prevent.
        case "$SR_SAVE_CACHE" in
          true|false) ;;
          *)
            echo "::error::save-cache must be true or false" >&2
            exit 1
            ;;
        esac
    - name: Install rust (explicit toolchain)
      if: ${{ inputs.toolchain != '' }}
      uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9
      with:
        override: true
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt, clippy, llvm-tools-preview
        cache: false
        rustflags: ${{ inputs.rustflags }}
    - name: Install rust (rust-toolchain file)
      if: ${{ inputs.toolchain == '' && hashFiles('rust-toolchain.toml', 'rust-toolchain') != '' }}
      uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9
      with:
        override: false
        components: rustfmt, clippy, llvm-tools-preview
        cache: false
        rustflags: ${{ inputs.rustflags }}
    - name: Install rust (stable default)
      if: ${{ inputs.toolchain == '' && hashFiles('rust-toolchain.toml', 'rust-toolchain') == '' }}
      uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9
      with:
        override: true
        toolchain: stable
        components: rustfmt, clippy, llvm-tools-preview
        cache: false
        rustflags: ${{ inputs.rustflags }}
    - name: Install cargo-binstall
      if: ${{ inputs.install-binstall == 'true' }}
      run: |
        set -euo pipefail
        # Keep BINSTALL_VERSION and BINSTALL_SHA256 in sync; update both together.
        # To refresh the checksum: curl -fsSL "$INSTALLER_URL" | shasum -a 256 | awk '{print $1}'
        export BINSTALL_VERSION="v1.19.1"
        BINSTALL_SHA256="d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae"
        INSTALLER_URL="https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${BINSTALL_VERSION}/install-from-binstall-release.sh"
        INSTALLER_PATH="$(mktemp)"
        trap 'rm -f "$INSTALLER_PATH"' EXIT
        curl -fsSL --proto '=https' --tlsv1.2 "$INSTALLER_URL" -o "$INSTALLER_PATH"
        if [ ! -s "$INSTALLER_PATH" ]; then
          echo "cargo-binstall installer download failed or empty" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_SHA256="$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')"
        else
          ACTUAL_SHA256="$(shasum -a 256 "$INSTALLER_PATH" | awk '{print $1}')"
        fi
        if [ "$ACTUAL_SHA256" != "$BINSTALL_SHA256" ]; then
          echo "cargo-binstall install script checksum mismatch: $ACTUAL_SHA256" >&2
          exit 1
        fi
        bash "$INSTALLER_PATH"
        # The cargo-binstall installer respects CARGO_HOME and writes
        # cargo-binstall into ${CARGO_HOME:-$HOME/.cargo}/bin, so the same
        # resolution gives us the absolute path to the freshly installed binary.
        cargo_home_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        echo "cargo-binstall: resolved cargo_home_bin=${cargo_home_bin}"
        if [ -n "${GITHUB_PATH:-}" ]; then
          echo "$cargo_home_bin" >> "$GITHUB_PATH"
          echo "cargo-binstall: appended ${cargo_home_bin} to GITHUB_PATH"
        else
          echo "cargo-binstall: GITHUB_PATH not set; skipping GITHUB_PATH append"
        fi
        case ":$PATH:" in
          *":$cargo_home_bin:"*)
            echo "cargo-binstall: ${cargo_home_bin} already on PATH; skipping prepend"
            ;;
          *)
            export PATH="$cargo_home_bin:$PATH"
            echo "cargo-binstall: prepended ${cargo_home_bin} to PATH"
            ;;
        esac
        cargo_binstall="$cargo_home_bin/cargo-binstall"
        binstall_ver="${BINSTALL_VERSION#v}"
        if ! "$cargo_binstall" -V | grep -qF "$binstall_ver"; then
          echo "cargo-binstall version verification failed: expected $binstall_ver" >&2
          "$cargo_binstall" -V >&2
          exit 1
        fi
        echo "cargo-binstall $("$cargo_binstall" -V) verified"
      shell: bash
    - name: Install uv
      id: setup-uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: ${{ inputs.cache-provider == 'github' && runner.environment == 'github-hosted' }}
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
          **/scripts/*.py
    # The script owns every decision (release, digest, tool-cache reuse,
    # PATH); the step only binds the runner's values. It sets no linker flag:
    # the consumer's .cargo/config.toml selects mold.
    - name: Install mold
      id: mold
      if: ${{ inputs.install-mold == 'true' && runner.os == 'Linux' }}
      shell: bash
      env:
        SR_MOLD_SCRIPT: ${{ github.action_path }}/scripts/install_mold.py
        SR_MOLD_VERSION: ${{ inputs.mold-version }}
        SR_RUNNER_ARCH: ${{ runner.arch }}
        SR_TOOL_CACHE: ${{ runner.tool_cache }}
        SR_RUNNER_TEMP: ${{ runner.temp }}
      run: >-
        uv run --script "$SR_MOLD_SCRIPT"
        --mold-version "$SR_MOLD_VERSION"
        --runner-arch "$SR_RUNNER_ARCH"
        --tool-cache "$SR_TOOL_CACHE"
        --temp-dir "$SR_RUNNER_TEMP"
        --github-path "$GITHUB_PATH"
        --github-output "$GITHUB_OUTPUT"
    - name: Skip mold off Linux
      id: mold-skip
      if: ${{ inputs.install-mold == 'true' && runner.os != 'Linux' }}
      shell: bash
      run: |
        echo "::notice title=setup-rust mold::mold is Linux-only; skipped on $RUNNER_OS, where the platform linker is used"
        echo "metric setup-rust.mold=skipped"
        echo "status=skipped" >> "$GITHUB_OUTPUT"
    # Plain apt install, unlike mold: clang and lld are Ubuntu-archive
    # packages with no cross-architecture download or digest to pin, so there
    # is nothing here for a checksum table to verify. The action sets no
    # linker flag; the consumer's Cargo configuration selects clang/lld, the
    # way install-mold leaves mold selection to the consumer.
    - name: Install clang and lld
      id: clang-lld
      if: ${{ inputs.install-clang-lld == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clang lld
        missing=()
        command -v clang >/dev/null 2>&1 || missing+=(clang)
        command -v ld.lld >/dev/null 2>&1 || missing+=(ld.lld)
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error title=setup-rust clang-lld::missing on PATH after install: ${missing[*]}" >&2
          exit 1
        fi
        echo "metric setup-rust.clang-lld=installed"
        echo "status=installed" >> "$GITHUB_OUTPUT"
    - name: Skip clang and lld off Linux
      id: clang-lld-skip
      if: ${{ inputs.install-clang-lld == 'true' && runner.os != 'Linux' }}
      shell: bash
      run: |
        echo "::notice title=setup-rust clang-lld::clang and lld are Linux-only; skipped on $RUNNER_OS, where the platform compiler and linker are used"
        echo "metric setup-rust.clang-lld=skipped"
        echo "status=skipped" >> "$GITHUB_OUTPUT"
    - name: Install nightly toolchain (needed for OpenBSD cross-compilation)
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' }}
      run: |
        set -euo pipefail
        OPENBSD_NIGHTLY='${{ inputs.openbsd-nightly }}'
        NIGHTLY_DATE="${OPENBSD_NIGHTLY#nightly-}"
        curl -fsI "https://static.rust-lang.org/dist/${NIGHTLY_DATE}/channel-rust-nightly.toml" >/dev/null
        rustup toolchain install --profile minimal "$OPENBSD_NIGHTLY"
        echo "OPENBSD_NIGHTLY=$OPENBSD_NIGHTLY" >> "$GITHUB_ENV"
        echo "NIGHTLY_SYSROOT=$(rustc +$OPENBSD_NIGHTLY --print sysroot)" >> "$GITHUB_ENV"
      shell: bash
    # Two steps rather than one, because a composite action cannot choose
    # which action a step uses at run time. Exactly one of them runs: the
    # owner saves and restores, every other job only restores.
    - name: Cache cargo registry
      id: cargo-cache
      if: ${{ inputs.cache-provider == 'github' && inputs.save-cache == 'true' }}
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Restore the cargo registry cache
      id: cargo-cache-restore
      if: ${{ inputs.cache-provider == 'github' && inputs.save-cache == 'false' }}
      # v6.1.0, the restore-only half of the same action at the same commit.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Report archive cache decisions
      if: ${{ always() }}
      shell: bash
      env:
        SR_CACHE_PROVIDER: ${{ inputs.cache-provider }}
        SR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        SR_UV_STEP_OUTCOME: ${{ steps.setup-uv.outcome }}
        SR_UV_CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        SR_SAVE_CACHE: ${{ inputs.save-cache }}
        SR_CARGO_STEP_OUTCOME: ${{ steps.cargo-cache.outcome }}
        SR_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        SR_CARGO_RESTORE_OUTCOME: ${{ steps.cargo-cache-restore.outcome }}
        SR_CARGO_RESTORE_CACHE_HIT: ${{ steps.cargo-cache-restore.outputs.cache-hit }}
      run: |
        set -euo pipefail
        cache_outcome() {
          local step_outcome="$1"
          local cache_hit="$2"
          case "$step_outcome" in
            success)
              case "$cache_hit" in
                true) printf 'hit' ;;
                false|'') printf 'miss' ;;
                *) printf 'error' ;;
              esac
              ;;
            skipped) printf 'disabled' ;;
            *) printf 'error' ;;
          esac
        }

        if [[ "$SR_CACHE_PROVIDER" == 'external' ]]; then
          cargo_outcome='disabled'
          uv_outcome='disabled'
        else
          # Exactly one of the two cache steps ran, so the reported outcome
          # comes from that one. Reading the skipped step instead would
          # report every restore-only job as "disabled" and hide whether
          # its registry was warm.
          #
          # An unset variable falls back to saving, matching the input's
          # own default, so a caller of this fragment that does not set it
          # reports the behaviour the action actually has.
          if [[ "${SR_SAVE_CACHE:-true}" == 'false' ]]; then
            cargo_step_outcome="$SR_CARGO_RESTORE_OUTCOME"
            cargo_cache_hit="$SR_CARGO_RESTORE_CACHE_HIT"
          else
            cargo_step_outcome="$SR_CARGO_STEP_OUTCOME"
            cargo_cache_hit="$SR_CARGO_CACHE_HIT"
          fi
          cargo_outcome="$(cache_outcome "$cargo_step_outcome" "$cargo_cache_hit")"
          if [[ "$SR_RUNNER_ENVIRONMENT" == 'github-hosted' ]]; then
            uv_outcome="$(cache_outcome "$SR_UV_STEP_OUTCOME" "$SR_UV_CACHE_HIT")"
          else
            uv_outcome='disabled'
          fi
        fi

        printf '::notice title=setup-rust cache::provider=%s cargo=%s uv=%s\n' \
          "$SR_CACHE_PROVIDER" "$cargo_outcome" "$uv_outcome"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          printf '%s\n' \
            '### setup-rust cache' \
            "- provider: $SR_CACHE_PROVIDER" \
            "- cargo archive: $cargo_outcome" \
            "- uv archive: $uv_outcome" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Select the sccache backend
      id: sccache-backend
      # BEFORE the sccache-action steps, deliberately. sccache binds its
      # backend once, when the server starts, and "Start the sccache server"
      # below is what starts it. GITHUB_ENV reaches only the next step, so
      # every export the server must see has to be written in an earlier one.
      # A value exported alongside the server start would be read by nobody:
      # the job would keep a local-disk cache while every log line claimed
      # otherwise.
      #
      # Its counterpart, "Export sccache as the rustc wrapper", sits AFTER
      # those steps for the opposite reason: it needs SCCACHE_PATH, which they
      # produce. The two exports cannot be merged or reordered, and a manifest
      # test holds both positions.
      #
      # A JavaScript action, not a shell step, because the runner hands
      # ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN to action steps only. The
      # URL is what tells an Ubicloud runner from a GitHub-hosted one;
      # runner.environment cannot, because a fork-fallback job reads
      # differently by event. See docs/adr/0005-runner-aware-sccache-backend.md.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      # v9.0.0
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
      env:
        SR_EXPECT_CACHE: ${{ inputs.expect-cache }}
        SR_CACHE_PROVIDER: ${{ inputs.cache-provider }}
        SR_SCCACHE_DIR: ${{ runner.temp }}/sccache
      with:
        script: |
          // The private-address check from export-ubicloud-cache-credentials,
          // kept identical: a contract drives both copies over the same hosts.
          // It accepts a complete IPv4 or IPv6 unique-local literal only, so
          // the DNS name 10.attacker.example, or any name that merely resolves
          // privately, is refused and never handed the runtime token.
          const parseIpv4 = (host) => {
            const parts = host.split('.');
            if (parts.length !== 4) {
              return null;
            }
            const octets = parts.map((part) =>
              /^[0-9]{1,3}$/.test(part) ? Number(part) : Number.NaN,
            );
            return octets.every(
              (octet) => Number.isInteger(octet) && octet >= 0 && octet <= 255,
            )
              ? octets
              : null;
          };

          // fc00::/7, the IPv6 unique-local range: the first byte is fc or fd.
          const isIpv6UniqueLocal = (host) => {
            const [first] = host.split(':');
            if (!/^[0-9a-f]{1,4}$/.test(first)) {
              return false;
            }
            const leadingByte = Number.parseInt(first, 16) >>> 8;
            return leadingByte === 0xfc || leadingByte === 0xfd;
          };

          // Ubicloud's proxy listens on the runner's private network. A public
          // host means this is not an Ubicloud runner, and republishing a
          // GitHub-hosted cache endpoint would point sccache at the wrong
          // service while claiming otherwise.
          const isPrivateHost = (hostname) => {
            const host = hostname.replace(/^\[|\]$/g, '').toLowerCase();
            if (host === 'localhost' || host === '::1') {
              return true;
            }
            if (host.includes(':')) {
              return isIpv6UniqueLocal(host);
            }
            const octets = parseIpv4(host);
            if (octets === null) {
              return false;
            }
            const [first, second] = octets;
            if (first === 10 || first === 127) {
              return true;
            }
            if (first === 192 && second === 168) {
              return true;
            }
            return first === 172 && second >= 16 && second <= 31;
          };

          // The closed set the output, the metric and expect-cache share.
          const BACKENDS = {
            ubicloud: 'ubicloud',
            github: 'github',
            local: 'local',
          };
          const EXPECTATIONS = new Set(['ubicloud', 'github', 'any']);
          // The bound on the directory the action owns and saves on hosted
          // runners, unless the caller sets SCCACHE_CACHE_SIZE.
          const OWNED_CACHE_SIZE = '2G';
          const DESCRIPTIONS = {
            ubicloud: "Ubicloud's cache proxy",
            github: 'the GitHub Actions cache',
            local: 'local disk',
          };

          const isSet = (value) => value !== undefined && value !== '';

          const isPrivateLiteralUrl = (value) => {
            try {
              return isPrivateHost(new URL(value).hostname);
            } catch {
              return false;
            }
          };

          // Which cache service this runner offers. A private literal is
          // Ubicloud's proxy. Any other runner with a runtime token has
          // GitHub's service. Under nektos/act, or with no token at all,
          // there is no service sccache can use, and local disk is the
          // answer rather than a failed build.
          const runnerService = (env) => {
            if (isSet(env.ACT) || !isSet(env.ACTIONS_RUNTIME_TOKEN)) {
              return BACKENDS.local;
            }
            return isPrivateLiteralUrl(env.ACTIONS_CACHE_URL ?? '')
              ? BACKENDS.ubicloud
              : BACKENDS.github;
          };

          // sccache 0.17's own reading of its switches: SCCACHE_GHA_VERSION
          // enables the service outright, and SCCACHE_GHA_ENABLED counts
          // when it is true, on or 1 in any case.
          const callerEnablesService = (env) =>
            isSet(env.SCCACHE_GHA_VERSION) ||
            ['true', 'on', '1'].includes(
              (env.SCCACHE_GHA_ENABLED ?? '').toLowerCase(),
            );

          // What the caller has already decided. An explicit switch wins,
          // false and empty included, so a job that turned the cache off
          // stays off. Failing that, a caller's SCCACHE_DIR is storage they
          // mounted, and wins over any service.
          const callerChoice = (env) => {
            if (env.SCCACHE_GHA_ENABLED !== undefined || isSet(env.SCCACHE_GHA_VERSION)) {
              return { owner: 'caller-switch', usesService: callerEnablesService(env) };
            }
            if (isSet(env.SCCACHE_DIR)) {
              return { owner: 'caller-directory', usesService: false };
            }
            return { owner: 'action', usesService: true };
          };

          // Which backend follows from the service and the caller's choice.
          // GitHub's service is used only when a caller asks for it: left to
          // the action, a GitHub-hosted runner gets local disk, which the
          // action caches itself. That backend measured 0.28 s per hit
          // against 0.42 s per compile on chutoro, and rejected all 643
          // writes on whitaker's Windows lane (ADR 0005).
          const backendFor = (service, choice) => {
            if (!choice.usesService) {
              return BACKENDS.local;
            }
            const leftToAction = choice.owner === 'action';
            return leftToAction && service === BACKENDS.github
              ? BACKENDS.local
              : service;
          };

          // A pure decision: it returns what should happen and performs none
          // of it. The runner decides which service; the caller decides
          // whether sccache uses one.
          const selectBackend = (env, expect) => {
            const service = runnerService(env);
            const choice = callerChoice(env);
            const backend = backendFor(service, choice);
            const plan = {
              backend,
              owner: choice.owner,
              writesSwitch:
                choice.owner === 'action' && backend === BACKENDS.ubicloud,
              // The action owns the directory, and so its cache, only on a
              // GitHub-hosted runner it chose for, and only while it owns the
              // job's other caches: cache-provider external hands every cache
              // path to the caller.
              ownsLocalCache:
                choice.owner === 'action' &&
                service === BACKENDS.github &&
                env.SR_CACHE_PROVIDER === 'github' &&
                isSet(env.SR_SCCACHE_DIR),
              // An empty ACTIONS_CACHE_SERVICE_V2 is what
              // export-ubicloud-cache-credentials leaves behind, and the
              // runner never sets it empty, so it marks credentials that are
              // already published.
              exportsCredentials:
                backend === BACKENDS.ubicloud &&
                env.ACTIONS_CACHE_SERVICE_V2 !== '',
            };
            if (!EXPECTATIONS.has(expect)) {
              return {
                ...plan,
                failure: 'expect-cache must be ubicloud, github or any.',
              };
            }
            if (expect !== 'any' && backend !== expect) {
              return {
                ...plan,
                failure:
                  `expect-cache is ${expect}, but this job selected ` +
                  `${DESCRIPTIONS[backend]} for sccache. The runner's cache ` +
                  "service and the caller's sccache settings together chose " +
                  'a different backend.',
              };
            }
            return plan;
          };

          // The only part that touches the toolkit.
          const publishCredentials = (env) => {
            // The proxy URL carries a bearer-like path segment, so it is as
            // sensitive as the token. Both are masked before anything else.
            core.setSecret(env.ACTIONS_RUNTIME_TOKEN);
            core.setSecret(env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_CACHE_URL', env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', env.ACTIONS_RUNTIME_TOKEN);
            // sccache selects GitHub's v2 service when this is set, and the
            // proxy serves v1. The record and restore steps below carry the
            // cleared value past the sccache-action steps, which set it again.
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', '');
          };

          const plan = selectBackend(process.env, process.env.SR_EXPECT_CACHE ?? 'any');
          const proceeds = plan.failure === undefined;
          // Publishing comes first because it masks: the runner redacts only
          // what it already knows, so nothing may be written before it.
          if (proceeds && plan.exportsCredentials) {
            publishCredentials(process.env);
          }
          if (proceeds && plan.writesSwitch) {
            core.exportVariable('SCCACHE_GHA_ENABLED', 'true');
          }
          const ownsCache = proceeds && plan.ownsLocalCache;
          if (ownsCache) {
            core.exportVariable('SCCACHE_DIR', process.env.SR_SCCACHE_DIR);
            // sccache's local default is 10 GiB, and every trunk push saves
            // a new entry against the repository's cache quota, so the
            // directory the action owns is bounded unless the caller chose.
            if (!isSet(process.env.SCCACHE_CACHE_SIZE)) {
              core.exportVariable('SCCACHE_CACHE_SIZE', OWNED_CACHE_SIZE);
            }
          }
          core.setOutput('owns-local-cache', ownsCache ? 'true' : 'false');
          core.setOutput('sccache-dir', ownsCache ? process.env.SR_SCCACHE_DIR : '');
          core.setOutput('cache-backend', plan.backend);
          // A fixed name and a value from a closed set, so a scraper sees a
          // series it can aggregate. No URL, host, path or token appears.
          core.info(`metric setup-rust.sccache.backend=${plan.backend}`);
          if (proceeds) {
            const cached = ownsCache ? ', cached by setup-rust' : '';
            core.notice(
              `selected ${DESCRIPTIONS[plan.backend]} (${plan.owner}${cached})`,
              { title: 'setup-rust sccache' },
            );
          } else {
            core.setFailed(plan.failure);
          }

    - name: Key the sccache directory cache
      id: sccache-cache-key
      # Only on the arm where the action owns the directory: a GitHub-hosted
      # runner, left to the action, with cache-provider github. One lane per
      # key: OS, architecture, the exact compiler, a discriminator the caller
      # can set (the job id by default), then the lockfile. The run id makes
      # every save a new entry, and the restore keys fall back first across
      # lockfiles, then to the lane's newest entry.
      if: ${{ steps.sccache-backend.outputs.owns-local-cache == 'true' }}
      shell: bash
      env:
        SR_DISCRIMINATOR: ${{ inputs.sccache-cache-discriminator || github.job }}
        SR_LOCK_HASH: ${{ hashFiles('**/Cargo.lock') }}
      run: |
        set -euo pipefail
        # cksum is POSIX and ships on every runner image, including Git Bash
        # on Windows; the hash names a compiler, it guards nothing.
        compiler="$(rustc -vV | cksum | cut -d' ' -f1)"
        # A cache key may not contain a comma, and a discriminator is free
        # text, so anything outside a safe set becomes an underscore.
        discriminator="$(printf '%s' "$SR_DISCRIMINATOR" | tr -c 'A-Za-z0-9._-' '_')"
        lane="sccache-${RUNNER_OS}-${RUNNER_ARCH}-${compiler}-${discriminator}-"
        {
          echo "key=${lane}${SR_LOCK_HASH}-${GITHUB_RUN_ID}"
          echo "restore-keys<<SETUP_RUST_RESTORE_KEYS"
          echo "${lane}${SR_LOCK_HASH}-"
          echo "${lane}"
          echo "SETUP_RUST_RESTORE_KEYS"
        } >> "$GITHUB_OUTPUT"
    - name: Restore and save the sccache directory on the default branch
      # The full action, so its post-job step saves the directory under the
      # run's key once the build is done. A composite action has no post step
      # of its own, and this is the only way to save after the caller's
      # build. Only a push to the default branch writes, so the trunk is the
      # directory's single writer and a pull request can never seed another
      # branch's cache.
      if: >-
        ${{ steps.sccache-backend.outputs.owns-local-cache == 'true'
        && github.event_name == 'push'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.sccache-backend.outputs.sccache-dir }}
        key: ${{ steps.sccache-cache-key.outputs.key }}
        restore-keys: ${{ steps.sccache-cache-key.outputs.restore-keys }}
    - name: Restore the sccache directory
      # Everywhere else: read the trunk's directory, never write one.
      if: >-
        ${{ steps.sccache-backend.outputs.owns-local-cache == 'true'
        && !(github.event_name == 'push'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      # v6.1.0
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.sccache-backend.outputs.sccache-dir }}
        key: ${{ steps.sccache-cache-key.outputs.key }}
        restore-keys: ${{ steps.sccache-cache-key.outputs.restore-keys }}
    - name: Record the caller's cache service selection
      id: cache-service
      # Read BEFORE the sccache-action steps, because they overwrite these.
      # The last thing mozilla-actions/sccache-action does is write
      # ACTIONS_CACHE_SERVICE_V2=on to GITHUB_ENV, along with the runner's own
      # ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN. On a GitHub-hosted
      # runner that is what a caller wants. On Ubicloud the v2 flag overrides
      # the empty value export-ubicloud-cache-credentials published, the proxy
      # serves v1, and every write goes to the wrong endpoint.
      #
      # All three are recorded, not just the one that does harm today. They
      # are the sccache-action's to change, and a version that started
      # exporting a different results URL or token would break the proxy the
      # same way, silently. (#441)
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      run: |
        set -euo pipefail
        # A fresh delimiter per write. A fixed one lets a value that happens
        # to contain that line close the block early and turn the rest of
        # itself into further assignments, which is how a cache flag becomes
        # arbitrary environment.
        new_delimiter() {
          printf 'SETUP_RUST_%s' \
            "$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        }
        # $1 the variable, $2 the output key, $3 non-empty when the value is a
        # credential. Bash 3.2 on macOS runners has no nameref, so the
        # indirect read is eval.
        record() {
          local name="$1" key="$2" secret="$3" value
          # ${VAR+x} rather than -n: clearing the variable, which is exactly
          # what export-ubicloud-cache-credentials does, is a choice, and
          # bash 3.2 cannot parse [[ -v VAR ]].
          if ! eval "[[ \${$name+x} ]]"; then
            echo "${key}_state=unset" >> "$GITHUB_OUTPUT"
            return
          fi
          eval "value=\${$name}"
          # A caller who exported a token without marking it secret would
          # otherwise have it appear here first. Masking is per value, never
          # blanket: masking a flag whose value is "on" would redact that
          # word everywhere in the log.
          if [[ -n "$secret" && -n "$value" ]]; then
            echo "::add-mask::$value"
          fi
          # The delimiter form carries an empty value, which the plain
          # name=value form cannot round-trip. It also refuses a value
          # containing a newline the chance to become a second assignment,
          # which a plain name=value line would grant it.
          local delimiter
          delimiter="$(new_delimiter)"
          if printf '%s' "$value" | grep -qxF "$delimiter"; then
            echo "::error title=setup-rust sccache::${name} contains this step's delimiter" >&2
            exit 1
          fi
          {
            echo "${key}_state=set"
            echo "${key}_value<<${delimiter}"
            printf '%s\n' "$value"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }
        record ACTIONS_CACHE_SERVICE_V2 cache_service ''
        record ACTIONS_RESULTS_URL results_url ''
        record ACTIONS_RUNTIME_TOKEN runtime_token secret

    # x86_64-apple-darwin binaries were dropped after sccache v0.12.0
    - name: Run sccache (x86_64 macOS)
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' && runner.os == 'macOS' && runner.arch == 'X64' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.12.0
    - name: Run sccache
      # Pinned, like its x86_64 macOS sibling. Left unset, the action asks the
      # GitHub API for the latest release on every job: a floating dependency
      # and a network call in the critical path. That call timed out on #440
      # and failed the job with "Unable to locate executable file: undefined",
      # a red check with no step log to explain it.
      #
      # This pin is the action's own. Consumers pinning a prebuilt sccache
      # binary of their own choose independently, and today do not agree:
      # 0.16.0 on Whitaker and Axinite, 0.17.0 on Chutoro and Wildside.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' && !(runner.os == 'macOS' && runner.arch == 'X64') }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - name: Restore the caller's cache service selection
      # AFTER both sccache-action steps and BEFORE anything starts a server,
      # deliberately. Undoes what those steps wrote to GITHUB_ENV, so a caller
      # who cleared ACTIONS_CACHE_SERVICE_V2, as an Ubicloud lane does, keeps
      # their choice. A caller who never set a variable keeps the action's
      # value, which is right on a GitHub-hosted runner.
      #
      # GITHUB_ENV reaches only the next step, so this cannot be merged into
      # the step that starts the server. A manifest test holds the order.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      env:
        CALLER_CACHE_SERVICE_STATE: ${{ steps.cache-service.outputs.cache_service_state }}
        CALLER_CACHE_SERVICE_VALUE: ${{ steps.cache-service.outputs.cache_service_value }}
        CALLER_RESULTS_URL_STATE: ${{ steps.cache-service.outputs.results_url_state }}
        CALLER_RESULTS_URL_VALUE: ${{ steps.cache-service.outputs.results_url_value }}
        CALLER_RUNTIME_TOKEN_STATE: ${{ steps.cache-service.outputs.runtime_token_state }}
        CALLER_RUNTIME_TOKEN_VALUE: ${{ steps.cache-service.outputs.runtime_token_value }}
      run: |
        set -euo pipefail
        # A fresh delimiter per write, for the reason the record step gives:
        # a fixed one lets a value containing that line close the block early
        # and turn the rest of itself into further assignments.
        new_delimiter() {
          printf 'SETUP_RUST_%s' \
            "$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        }
        # One bounded outcome per variable, over a closed set: a lane whose
        # proxy selection was silently overridden is visible in the log rather
        # than only in a cache that never fills.
        report() {
          echo "metric setup-rust.sccache.$1=$2"
        }
        # $1 the variable, $2 its metric, $3 the recorded state, $4 the
        # recorded value. Bash 3.2 on macOS runners has no nameref, so the
        # indirect read is eval.
        restore() {
          local name="$1" metric="$2" state="$3" recorded="$4"
          local is_set=no current=''
          if [[ "$state" != set ]]; then
            report "$metric" absent
            return
          fi
          if eval "[[ \${$name+x} ]]"; then
            is_set=yes
            eval "current=\${$name}"
          fi
          if [[ "$is_set" == yes && "$current" == "$recorded" ]]; then
            report "$metric" unchanged
            return
          fi
          # The delimiter form carries an empty value, which the plain
          # name=value form cannot round-trip, and denies a value containing a
          # newline the second assignment that form would grant it.
          local delimiter
          delimiter="$(new_delimiter)"
          if printf '%s' "$recorded" | grep -qxF "$delimiter"; then
            echo "::error title=setup-rust sccache::${name} contains this step's delimiter" >&2
            exit 1
          fi
          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$recorded"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
          report "$metric" restored
          # The variable, never its value: one of the three is a credential.
          echo "::notice title=setup-rust sccache::restored the caller's ${name}, which the sccache steps had overwritten"
        }
        restore ACTIONS_CACHE_SERVICE_V2 cache-service \
          "${CALLER_CACHE_SERVICE_STATE:-unset}" "${CALLER_CACHE_SERVICE_VALUE-}"
        restore ACTIONS_RESULTS_URL results-url \
          "${CALLER_RESULTS_URL_STATE:-unset}" "${CALLER_RESULTS_URL_VALUE-}"
        restore ACTIONS_RUNTIME_TOKEN runtime-token \
          "${CALLER_RUNTIME_TOKEN_STATE:-unset}" "${CALLER_RUNTIME_TOKEN_VALUE-}"
    - name: Export sccache as the rustc wrapper
      id: rustc-wrapper
      # sccache-action installs sccache and exports SCCACHE_PATH, but Cargo
      # only routes compilation through it when RUSTC_WRAPPER names it. Without
      # this the action reports sccache as enabled while every consumer that
      # does not set the wrapper itself compiles without it, which is what
      # Chutoro's zero compile requests showed.
      #
      # AFTER both sccache-action steps, deliberately, since SCCACHE_PATH is
      # their output and does not exist before they run.
      #
      # Its counterpart, "Select the sccache backend", sits BEFORE those steps
      # for the opposite reason: sccache binds its backend at server start,
      # "Start the sccache server" below is what starts it, and GITHUB_ENV
      # reaches only the next step, so that choice has to be made first. The
      # two exports cannot be merged or reordered, and a manifest test holds
      # both positions.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      env:
        EXPORT_WRAPPER: ${{ inputs.export-rustc-wrapper }}
      run: |
        set -euo pipefail
        # One bounded outcome per terminal path, over a closed set, with no
        # path or value in the line so a scraper sees a series it can
        # aggregate.
        report() {
          echo "metric setup-rust.sccache.wrapper=$1"
          # The next step needs to know whether this one exported, and the
          # environment cannot say: an inherited wrapper and one this step
          # wrote look identical from there.
          echo "state=$1" >> "$GITHUB_OUTPUT"
        }
        # A caller wrapping rustc for its own reasons must not be overridden
        # silently. ${VAR+x} rather than -n: an inherited empty value is still
        # a deliberate choice, and macOS runners ship bash 3.2, which cannot
        # parse [[ -v VAR ]].
        if [[ ${RUSTC_WRAPPER+x} ]]; then
          report caller-set
          echo "::notice title=setup-rust sccache::RUSTC_WRAPPER already set; leaving the caller's value in place"
          exit 0
        fi
        if [[ -z "${SCCACHE_PATH:-}" ]]; then
          report missing-sccache-path
          echo "::error title=setup-rust sccache::sccache-action did not export SCCACHE_PATH" >&2
          exit 1
        fi
        # A job that must not inherit the wrapper (a root lane, nested cargo
        # builds) opts out and scopes it itself from the `sccache-path` output.
        # The server still starts below, so a scoped wrapper finds it running.
        if [[ "${EXPORT_WRAPPER-true}" != true ]]; then
          report not-exported
          echo "::notice title=setup-rust sccache::export-rustc-wrapper is not true; RUSTC_WRAPPER left to the caller"
          exit 0
        fi
        echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
        report exported
        echo "::notice title=setup-rust sccache::RUSTC_WRAPPER exported"
    - name: Start the sccache server
      id: sccache-server
      # LAST of the sccache steps, deliberately. sccache reads its cache
      # configuration once, when the server starts, and never rebinds, so the
      # server has to start after every export that could change it: the
      # backend selection, the cache-service restore above, and whatever the
      # caller exported before this action ran.
      #
      # Starting it here rather than leaving it to the first wrapped rustc
      # also makes the binding a step with a name and an outcome, instead of
      # a side effect of a compile that happens to come first.
      if: ${{ inputs.use-sccache == 'true' && github.event_name != 'release' }}
      shell: bash
      env:
        WRAPPER_STATE: ${{ steps.rustc-wrapper.outputs.state }}
      run: |
        set -euo pipefail
        # One bounded outcome per terminal path, over a closed set.
        report() {
          echo "metric setup-rust.sccache.server=$1"
        }
        # Only restart a server this action's own wrapper export owns. An
        # inherited RUSTC_WRAPPER may name this very binary, when a caller ran
        # setup-rust earlier in the job or nested it through
        # rust-build-release, and stopping that server would discard the
        # statistics of everything compiled so far. Checked first, because a
        # caller who owns the wrapper owes this action no SCCACHE_PATH either.
        if [[ "${WRAPPER_STATE:-}" != exported && "${WRAPPER_STATE:-}" != not-exported ]]; then
          report caller-set
          exit 0
        fi
        if [[ -z "${SCCACHE_PATH:-}" ]]; then
          report missing-sccache-path
          echo "::error title=setup-rust sccache::sccache-action did not export SCCACHE_PATH" >&2
          exit 1
        fi
        # A server already running holds the backend it bound when it
        # started, which was before the restore above. Stopping it is the
        # only way to rebind; a fresh server also starts with zero counters,
        # so a caller's later --show-stats measures their own build.
        # The server's first act is to probe its cache backend, and on
        # Ubicloud that probe intermittently outlasts sccache's fixed 10 s
        # startup timeout. The timeout is settable only through the config
        # file SCCACHE_CONF names, never an environment variable, so write one.
        # A caller's own config is kept, with the timeout placed ahead of it
        # because a top-level key written after a table would land inside that
        # table. A root key the caller already set wins, bare or quoted; one
        # nested under a table header, or inside a multi-line string, is not
        # the root key and does not count.
        # The merged copy may carry backend credentials, so it is created
        # private.
        conf="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/setup-rust-sccache.toml"
        if [[ -n "${SCCACHE_CONF:-}" && -f "$SCCACHE_CONF" ]] \
          && awk '
            # Reads one line the way TOML does, only to learn whether a
            # multi-line string is still open at its end. A comment ends the
            # scan, and a delimiter inside a one-line string or a comment is
            # not an opener. `ml` holds the open delimiter kind, or "".
            function scan(line,   i, n, c) {
              n = length(line)
              i = 1
              while (i <= n) {
                c = substr(line, i, 1)
                # TOML lets one or two content quotes sit directly before a
                # closing delimiter, so a run of three to five quotes closes the
                # string at its END. Consuming only the first three would leave
                # a stray quote that opens a one-line string over the next token.
                if (ml == "dq") {
                  if (c == "\\") { i += 2; continue }
                  if (substr(line, i, 3) == dq3) {
                    ml = ""
                    while (substr(line, i, 1) == dq1) i++
                    continue
                  }
                  i++; continue
                }
                if (ml == "sq") {
                  if (substr(line, i, 3) == sq3) {
                    ml = ""
                    while (substr(line, i, 1) == sq1) i++
                    continue
                  }
                  i++; continue
                }
                if (c == "#") return
                if (substr(line, i, 3) == dq3) { ml = "dq"; i += 3; continue }
                if (substr(line, i, 3) == sq3) { ml = "sq"; i += 3; continue }
                if (c == dq1) {
                  i++
                  while (i <= n) {
                    c = substr(line, i, 1)
                    if (c == "\\") { i += 2; continue }
                    if (c == dq1) break
                    i++
                  }
                  i++; continue
                }
                if (c == sq1) {
                  i++
                  while (i <= n && substr(line, i, 1) != sq1) i++
                  i++; continue
                }
                i++
              }
            }
            BEGIN {
              dq1 = sprintf("%c", 34); sq1 = sprintf("%c", 39)
              dq3 = dq1 dq1 dq1; sq3 = sq1 sq1 sq1; ml = ""
            }
            ml != "" { scan($0); next }
            /^[[:space:]]*\[/ { exit }
            /^[[:space:]]*("server_startup_timeout_ms"|'"'"'server_startup_timeout_ms'"'"'|server_startup_timeout_ms)[[:space:]]*=/ { found = 1; exit }
            { scan($0) }
            END { exit !found }
          ' "$SCCACHE_CONF"; then
          conf="$SCCACHE_CONF"
          timeout_source=caller
        elif [[ -n "${SCCACHE_CONF:-}" && -f "$SCCACHE_CONF" ]]; then
          (
            umask 077
            { printf 'server_startup_timeout_ms = 60000\n'; cat "$SCCACHE_CONF"; } > "$conf.new"
          )
          mv "$conf.new" "$conf"
          timeout_source=merged
        else
          printf 'server_startup_timeout_ms = 60000\n' > "$conf"
          timeout_source=default
        fi
        # Which branch decided the startup timeout, over a closed set: the
        # caller's own value kept, the default prepended to the caller's config,
        # or the default alone. No path or value appears in the line.
        echo "metric setup-rust.sccache.timeout=${timeout_source}"
        export SCCACHE_CONF="$conf"
        echo "SCCACHE_CONF=$conf" >> "$GITHUB_ENV"
        "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
        # A cache is an optimization, so a server that will not start must
        # not fail the job. Clearing the wrapper makes Cargo compile with
        # plain rustc (an empty RUSTC_WRAPPER counts as unset), and the
        # warning keeps the loss visible.
        if ! "$SCCACHE_PATH" --start-server; then
          report start-failed
          # Three signals, so a fallback can be found without reading logs:
          # the annotation title (a contract: never rename it), a line on the
          # run page, and the sccache-status output for a caller to act on.
          echo "::warning title=sccache-fallback::sccache server did not start within 60 s; this job compiled without the compiler cache"
          echo "sccache: FALLBACK (cache disabled for this job)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "status=fallback" >> "$GITHUB_OUTPUT"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          exit 0
        fi
        echo "status=started" >> "$GITHUB_OUTPUT"
        echo "path=${SCCACHE_PATH}" >> "$GITHUB_OUTPUT"
        # A server this step started has zero counters already. Zeroing is
        # belt and braces against a --start-server that adopted one, and it
        # costs a baseline rather than the cache, so it warns rather than
        # failing the job.
        if "$SCCACHE_PATH" --zero-stats >/dev/null; then
          report started
        else
          report started-stats-not-zeroed
          echo "::warning title=setup-rust sccache::could not zero sccache statistics; a later --show-stats may include earlier work"
        fi
        echo "::notice title=setup-rust sccache::sccache server started"
    - name: Install system dependencies
      if: ${{ inputs.install-postgres-deps == 'true' && runner.os == 'Linux' }}
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      shell: bash
    - name: Install libpq (headers + import library)
      if: ${{ inputs.install-postgres-deps == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        # Install PostgreSQL 17 but suppress the server service – we only need the client bits
        choco install postgresql17 --no-progress -y --params '/Password:postgres /NoService /SkipStackBuilder'

        # Tell the rest of the job where the headers and import library are
        $pgRoot = "${Env:ProgramFiles}\PostgreSQL\17"
        "PG_INCLUDE=$pgRoot\include" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "PG_LIB=$pgRoot\lib"         | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        echo "$pgRoot\bin"           | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install MSYS2 toolchain and SQLite
      if: ${{ inputs.install-sqlite-deps == 'true' && runner.os == 'Windows' }}
      # v2.32.0
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-sqlite3
    - name: Setup osxcross (macOS SDK + linker)
      if: ${{ inputs.with-darwin == 'true' && runner.os == 'Linux' }}
      uses: mbround18/setup-osxcross@b26146d499c54979ed3d023266865dc188881911
      with:
        osx-version: ${{ inputs.darwin-sdk-version }}
    - name: Install Rust macOS targets
      if: ${{ inputs.with-darwin == 'true' && runner.os == 'Linux' }}
      run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      shell: bash
    - name: Cache OpenBSD stdlib
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' }}
      id: openbsd-stdlib-cache
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.NIGHTLY_SYSROOT }}/lib/rustlib/x86_64-unknown-openbsd
        key: openbsd-stdlib-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
    - name: Clone Rust repo & build OpenBSD std
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' && steps.openbsd-stdlib-cache.outputs.cache-hit != 'true' }}
      run: |
        git clone --depth 1 --single-branch https://github.com/rust-lang/rust.git
        cd rust
        HOST_TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
        ./x.py build --stage 1 --target x86_64-unknown-openbsd library/std
        ARTEFACT_DIR="build/$HOST_TRIPLE/stage1/lib/rustlib/x86_64-unknown-openbsd"
        uv run --script "${{ github.action_path }}/scripts/copy_openbsd_stdlib.py" \
          "$ARTEFACT_DIR" "$NIGHTLY_SYSROOT"
      shell: bash
    - name: Add OpenBSD target
      if: ${{ inputs.with-openbsd == 'true' && runner.os == 'Linux' }}
      run: rustup target add x86_64-unknown-openbsd --toolchain ${{ env.OPENBSD_NIGHTLY }}
      shell: bash
