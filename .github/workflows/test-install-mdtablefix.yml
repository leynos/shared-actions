name: Test install-mdtablefix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MDTABLEFIX_TEST_VERSION: 0.5.0

jobs:
  install-mdtablefix:
    name: Install and reuse mdtablefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdtablefix
        uses: ./.github/actions/install-mdtablefix
        with:
          version: ${{ env.MDTABLEFIX_TEST_VERSION }}
          bin-dir: ${{ runner.temp }}/mdtablefix-bin

      - name: Verify the installed version
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/mdtablefix-bin"
          test -x "${bin_dir}/mdtablefix"
          reported="$(mdtablefix --version)"
          expected="mdtablefix ${MDTABLEFIX_TEST_VERSION}"
          test "${reported}" = "${expected}"
          echo "mdtablefix_test_version=${reported}"

      - name: Record the shell for contrast
        shell: bash
        run: |
          # The same three probes the macOS job runs, so the two logs can
          # be read against each other.
          set -euo pipefail
          echo "mdtablefix_test_bash_version=${BASH_VERSION}"
          bash --version | head -n 1
          echo "mdtablefix_test_bash_path=$(command -v bash)"
          dir="${RUNNER_TEMP}/err-trap"
          mkdir -p "${dir}"
          printf '%s\n' '#!/usr/bin/env bash' 'exit 94' > "${dir}/failing-tool"
          chmod +x "${dir}/failing-tool"
          # Three cases, differing only in what fails and where. The action's
          # own fragment was the second: an external command, last in the
          # script, exactly where `cargo binstall` sat.
          probe() {
            local name="$1" tail="$2" verdict=not-run observed
            {
              printf '%s\n' 'set -Eeuo pipefail'
              printf '%s\n' "trap 'echo err-trap=fired' ERR"
              printf '%s\n' "${tail}"
            } > "${dir}/probe.sh"
            observed="$(bash "${dir}/probe.sh" 2>&1 || true)"
            case "${observed}" in
              *err-trap=fired*) verdict=fired ;;
            esac
            echo "mdtablefix_test_err_trap.${name}=${verdict}"
          }
          # The same three again, but read from a command string rather than a
          # file. A runner writes a composite fragment to a file and runs it;
          # the Python harness passed it to `bash -c`. If those differ here,
          # the harness was the thing that differed, not the platform.
          probe_dash_c() {
            local name="$1" tail="$2" verdict=not-run observed script
            script="$(
              printf '%s\n' 'set -Eeuo pipefail'
              printf '%s\n' "trap 'echo err-trap=fired' ERR"
              printf '%s\n' "${tail}"
            )"
            observed="$(bash -c "${script}" 2>&1 || true)"
            case "${observed}" in
              *err-trap=fired*) verdict=fired ;;
            esac
            echo "mdtablefix_test_err_trap.dash-c-${name}=${verdict}"
          }
          probe builtin-last 'false'
          probe external-last "${dir}/failing-tool"
          probe external-then-noop "$(printf '%s\n:' "${dir}/failing-tool")"
          probe_dash_c builtin-last 'false'
          probe_dash_c external-last "${dir}/failing-tool"
          probe_dash_c external-then-noop "$(printf '%s\n:' "${dir}/failing-tool")"

      - name: Poison cargo before the second invocation
        shell: bash
        run: |
          # The cached outcome is asserted by making any other outcome
          # impossible: a second invocation that reaches cargo-binstall runs
          # this stub and fails the job.
          set -euo pipefail
          poisoned="${RUNNER_TEMP}/poisoned-cargo"
          mkdir -p "${poisoned}"
          cat > "${poisoned}/cargo" <<'POISONED_CARGO'
          #!/usr/bin/env bash
          echo "the second invocation must be served from bin-dir, not from cargo" >&2
          exit 1
          POISONED_CARGO
          chmod +x "${poisoned}/cargo"
          printf '%s\n' "${poisoned}" >> "$GITHUB_PATH"

      - name: Install mdtablefix again
        uses: ./.github/actions/install-mdtablefix
        with:
          version: ${{ env.MDTABLEFIX_TEST_VERSION }}
          bin-dir: ${{ runner.temp }}/mdtablefix-bin

      - name: Verify the cached invocation
        shell: bash
        run: |
          set -euo pipefail
          reported="$(mdtablefix --version)"
          test "${reported}" = "mdtablefix ${MDTABLEFIX_TEST_VERSION}"
          echo "mdtablefix_test_cached=true"

  install-mdtablefix-no-prebuilt:
    name: Fail closed where no prebuilt release exists
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the shell this contract was proven under
        shell: bash
        run: |
          # The action reports every failure by checking an exit status, never
          # from an `ERR` trap, because a trap did not run on this platform.
          # Record which Bash decided that, and re-run the case, so the rule
          # rests on a measurement anyone can read back rather than on a
          # recollection.
          set -euo pipefail
          echo "mdtablefix_test_bash_version=${BASH_VERSION}"
          bash --version | head -n 1
          echo "mdtablefix_test_bash_path=$(command -v bash)"
          dir="${RUNNER_TEMP}/err-trap"
          mkdir -p "${dir}"
          printf '%s\n' '#!/usr/bin/env bash' 'exit 94' > "${dir}/failing-tool"
          chmod +x "${dir}/failing-tool"
          # Three cases, differing only in what fails and where. The action's
          # own fragment was the second: an external command, last in the
          # script, exactly where `cargo binstall` sat.
          probe() {
            local name="$1" tail="$2" verdict=not-run observed
            {
              printf '%s\n' 'set -Eeuo pipefail'
              printf '%s\n' "trap 'echo err-trap=fired' ERR"
              printf '%s\n' "${tail}"
            } > "${dir}/probe.sh"
            observed="$(bash "${dir}/probe.sh" 2>&1 || true)"
            case "${observed}" in
              *err-trap=fired*) verdict=fired ;;
            esac
            echo "mdtablefix_test_err_trap.${name}=${verdict}"
          }
          # The same three again, but read from a command string rather than a
          # file. A runner writes a composite fragment to a file and runs it;
          # the Python harness passed it to `bash -c`. If those differ here,
          # the harness was the thing that differed, not the platform.
          probe_dash_c() {
            local name="$1" tail="$2" verdict=not-run observed script
            script="$(
              printf '%s\n' 'set -Eeuo pipefail'
              printf '%s\n' "trap 'echo err-trap=fired' ERR"
              printf '%s\n' "${tail}"
            )"
            observed="$(bash -c "${script}" 2>&1 || true)"
            case "${observed}" in
              *err-trap=fired*) verdict=fired ;;
            esac
            echo "mdtablefix_test_err_trap.dash-c-${name}=${verdict}"
          }
          probe builtin-last 'false'
          probe external-last "${dir}/failing-tool"
          probe external-then-noop "$(printf '%s\n:' "${dir}/failing-tool")"
          probe_dash_c builtin-last 'false'
          probe_dash_c external-last "${dir}/failing-tool"
          probe_dash_c external-then-noop "$(printf '%s\n:' "${dir}/failing-tool")"

      - name: Install mdtablefix
        id: install-mdtablefix
        continue-on-error: true
        uses: ./.github/actions/install-mdtablefix
        with:
          version: ${{ env.MDTABLEFIX_TEST_VERSION }}
          bin-dir: ${{ runner.temp }}/mdtablefix-bin

      - name: Verify the fail-closed contract
        shell: bash
        run: |
          # mdtablefix publishes no macOS asset, so the only way to satisfy
          # this runner is a source build. The action must refuse, and must
          # leave no executable behind.
          set -euo pipefail
          test "${{ steps.install-mdtablefix.outcome }}" = failure
          test ! -e "${RUNNER_TEMP}/mdtablefix-bin/mdtablefix"
          echo "mdtablefix_test_no_prebuilt=true"
