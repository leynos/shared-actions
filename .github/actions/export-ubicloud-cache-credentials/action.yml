name: Export Ubicloud cache credentials
description: >
  Publish Ubicloud's local cache proxy credentials to the job environment so
  later shell steps, such as an sccache server, can reach it.
runs:
  using: composite
  steps:
    - name: Export cache credentials
      # A JavaScript action, not a shell step, and that is the whole point.
      # The runner exposes ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN to
      # action steps only; a `run:` step never sees them. This step reads them
      # where they exist and republishes them through GITHUB_ENV, where every
      # later step can.
      # v9.0.0
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
      with:
        script: |
          // Parse an exact dotted quad, or return null. Matching a prefix
          // such as /^10\./ against the host would accept the DNS name
          // 10.attacker.example and hand it the runtime token, so the address
          // has to be a complete IPv4 literal before any range is considered.
          // A name that merely resolves to a private address is refused too:
          // resolution is not ours to trust, and Ubicloud's proxy URL carries
          // a literal.
          const parseIpv4 = (host) => {
            const parts = host.split('.');
            if (parts.length !== 4) {
              return null;
            }
            const octets = parts.map((part) =>
              /^[0-9]{1,3}$/.test(part) ? Number(part) : Number.NaN,
            );
            return octets.every(
              (octet) => Number.isInteger(octet) && octet >= 0 && octet <= 255,
            )
              ? octets
              : null;
          };

          // fc00::/7, the IPv6 unique-local range: the first byte is fc or fd.
          const isIpv6UniqueLocal = (host) => {
            const [first] = host.split(':');
            if (!/^[0-9a-f]{1,4}$/.test(first)) {
              return false;
            }
            const leadingByte = Number.parseInt(first, 16) >>> 8;
            return leadingByte === 0xfc || leadingByte === 0xfd;
          };

          // Ubicloud's proxy listens on the runner's private network. A public
          // host means this is not an Ubicloud runner, and republishing a
          // GitHub-hosted cache endpoint would point sccache at the wrong
          // service while claiming otherwise.
          const isPrivateHost = (hostname) => {
            const host = hostname.replace(/^\[|\]$/g, '').toLowerCase();
            if (host === 'localhost' || host === '::1') {
              return true;
            }
            if (host.includes(':')) {
              return isIpv6UniqueLocal(host);
            }
            const octets = parseIpv4(host);
            if (octets === null) {
              return false;
            }
            const [first, second] = octets;
            if (first === 10 || first === 127) {
              return true;
            }
            if (first === 192 && second === 168) {
              return true;
            }
            return first === 172 && second >= 16 && second <= 31;
          };

          // One bounded outcome per terminal path. The name is fixed and the
          // value comes from this closed set, so a log scraper sees a series
          // it can aggregate. No URL, host, port, token or error text appears.
          const RESULTS = {
            exported: 'exported',
            missingCacheUrl: 'missing-cache-url',
            missingRuntimeToken: 'missing-runtime-token',
            invalidUrl: 'invalid-url',
            publicHost: 'public-host',
          };

          // Read the credentials from an explicit mapping rather than reaching
          // for ambient state, so the boundary is one argument wide.
          const readCredentials = (env) => ({
            cacheUrl: env.ACTIONS_CACHE_URL ?? '',
            runtimeToken: env.ACTIONS_RUNTIME_TOKEN ?? '',
          });

          // A pure decision: it returns what should happen and never performs
          // it. Every rejection names the bounded result it belongs to, so the
          // metric and the message cannot drift apart.
          const validateCredentials = ({ cacheUrl, runtimeToken }) => {
            if (!cacheUrl) {
              return {
                result: RESULTS.missingCacheUrl,
                message:
                  'ACTIONS_CACHE_URL is not set. This action is for Ubicloud ' +
                  'runners, whose local cache proxy exports it; do not call ' +
                  'it on GitHub-hosted runners.',
              };
            }
            if (!runtimeToken) {
              return {
                result: RESULTS.missingRuntimeToken,
                message:
                  'ACTIONS_RUNTIME_TOKEN is not set, so the cache proxy ' +
                  'could not be authenticated.',
              };
            }
            let parsed;
            try {
              parsed = new URL(cacheUrl);
            } catch {
              return {
                result: RESULTS.invalidUrl,
                message: 'ACTIONS_CACHE_URL is not a valid URL.',
              };
            }
            if (!isPrivateHost(parsed.hostname)) {
              return {
                result: RESULTS.publicHost,
                message:
                  `ACTIONS_CACHE_URL host ${parsed.hostname} is not on a ` +
                  'private network, so this is not an Ubicloud cache proxy. ' +
                  'Remove this action from GitHub-hosted jobs.',
              };
            }
            return { result: RESULTS.exported, host: parsed.host };
          };

          // The only part that touches the toolkit.
          const publish = (credentials, host) => {
            // The proxy URL carries a bearer-like path segment, so it is as
            // sensitive as the token. Both are masked before anything is
            // logged: the runner redacts only what it already knows, so the
            // order is the protection rather than the calls themselves.
            core.setSecret(credentials.runtimeToken);
            core.setSecret(credentials.cacheUrl);

            core.exportVariable('ACTIONS_CACHE_URL', credentials.cacheUrl);
            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              credentials.runtimeToken,
            );
            // sccache's GHA backend selects the v2 cache service when this is
            // set. Ubicloud's proxy serves v1, so clear it rather than leaving
            // whatever the runner set.
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', '');

            // Name the host and port only. The path segment is the secret.
            core.notice(
              `Ubicloud cache proxy exported: host=${host}`,
              { title: 'Ubicloud cache credentials' },
            );
          };

          const credentials = readCredentials(process.env);
          const decision = validateCredentials(credentials);
          if (decision.result === RESULTS.exported) {
            publish(credentials, decision.host);
          }
          core.info(
            `metric ubicloud-cache-credentials.result=${decision.result}`,
          );
          if (decision.message !== undefined) {
            core.setFailed(decision.message);
          }
